<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIV 시스템</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LIV 시스템">
    <meta name="theme-color" content="#ff85a2">
    <link rel="manifest" href="./manifest.json">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        /* ==========================================
           공통/PC 디자인 (원본 100% 유지)
           ========================================== */
        :root {
            --main-pink: #ff85a2;
            --soft-pink: #fff0f3;
            --black: #111111;
            --gray-light: #f4f6f8;
            --white: #ffffff;
            
            --color-pub: #e8f0eb;
            --color-cover: #fff0e6;
            --color-proof: #ffe6eb;
            --color-task: #fdf5f6;
            --color-email: #eff0ff;
            --color-meeting: #fcf4dd;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; font-family: 'Pretendard', -apple-system, sans-serif; background-color: var(--gray-light); color: var(--black); display: flex; }

        .sidebar-hover-zone { display: none; }
        .sidebar { width: 240px; background: var(--black); color: var(--white); display: flex; flex-direction: column; padding: 0; z-index: 1000; flex-shrink: 0; transition: left 0.3s ease; height: 100%; }
        .logo-area { padding: 30px 20px; text-align: center; border-bottom: 1px solid #222; display: flex; flex-direction: column; justify-content: center; }
        .logo-title { font-size: 2rem; font-weight: 800; letter-spacing: 2px; margin: 0; font-family: serif; color: var(--white); }
        .logo-subtitle { font-size: 0.75rem; font-weight: 300; letter-spacing: 4px; color: var(--main-pink); margin-top: 5px; text-transform: uppercase; }

        .nav-group { padding: 15px 0; flex-grow: 1; overflow-y: auto; }
        .nav-label { padding: 15px 25px 5px; font-size: 0.75rem; color: #666; font-weight: bold; text-transform: uppercase; }
        .nav-item { padding: 12px 25px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; font-size: 0.9rem; border-left: 3px solid transparent; color: #ddd; }
        .nav-item:hover { background: #1a1a1a; color: var(--white); }
        .nav-item.active { background: #1a1a1a; border-left: 3px solid var(--main-pink); color: var(--main-pink); font-weight: bold; }
        
        .writer-sub-list { background: #0a0a0a; display: none; }
        .writer-sub-list.show { display: block; }
        .writer-sub-item { padding: 10px 25px 10px 40px; font-size: 0.85rem; cursor: pointer; color: #888; }
        .writer-sub-item:hover { color: var(--white); background: #111; }

        .main-container { flex-grow: 1; padding: 25px; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; background: #fafbfc; min-width: 0; position: relative; }
        .card { background: var(--white); border-radius: 10px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); border: 1px solid #eaeaea; margin-bottom: 20px; }
        h2 { font-size: 1.4rem; margin-top: 0; margin-bottom: 15px; font-weight: 700; color: var(--black); }
        
        .cal-wrapper { display: flex; flex-direction: column; flex-grow: 1; height: 100%; min-height: 500px; }
        .cal-header-wrap { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap:10px; }
        .cal-nav { display: flex; align-items: center; gap: 15px; font-size: 1.2rem; font-weight: bold; }
        .cal-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 5px; color: #555; }
        .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .filter-btn { padding: 5px 10px; border: 1px solid #ddd; background: #fff; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
        .filter-btn.active { background: var(--main-pink); border-color: var(--main-pink); color: #fff; font-weight: bold; }
        
        .calendar-grid { flex-grow: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day-header { text-align: center; font-weight: bold; padding: 4px 0; color: #888; font-size: 0.85rem; margin-bottom: 0; }
        .day-box { background: #fff; border: 1px solid #eee; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; overflow-y: auto; min-height: 0; transition: 0.2s; cursor: pointer; }
        .day-box:hover { border-color: #ccc; }
        .day-box::-webkit-scrollbar { width: 3px; }
        .day-box::-webkit-scrollbar-thumb { background: #ddd; }
        .day-num { font-weight: 700; margin-bottom: 5px; font-size: 0.8rem; color: #444; }
        .day-box.today { background: var(--soft-pink); border: 1px solid var(--main-pink); }

        .table-wrap { width: 100%; overflow-x: hidden; }
        .liv-table { width: 100%; min-width: 1050px; border-collapse: collapse; background: #fff; }
        .liv-table th { text-align: left; padding: 10px; font-size: 0.8rem; color: #888; border-bottom: 2px solid #eee; }
        .liv-table td { padding: 12px 10px; border-bottom: 1px solid #eee; vertical-align: middle; font-size: 0.85rem; position: relative; }
        .cover-thumb { width: 75px; height: 105px; border-radius: 4px; object-fit: cover; border: 1px solid #ddd; background: #fafafa; flex-shrink: 0; display: block; }
        .input-text, .input-select, .input-date { height: 32px !important; padding: 0 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.85rem; box-sizing: border-box; font-family: inherit; width: 100%; line-height: 30px; margin: 0; }
        .input-text:focus, .input-select:focus, .input-date:focus { border-color: var(--main-pink); outline: none; }
        .row-child { background-color: #f1f3f5 !important; }
        .child-indicator { display: inline-block; color: var(--main-pink); font-weight: bold; margin-right: 5px; padding-left: 15px; font-size: 0.8rem; }
        .btn { height: 32px !important; line-height: 32px; padding: 0 15px; border-radius: 4px; border: none; cursor: pointer; font-weight: 600; font-size: 0.8rem; white-space: nowrap; display: inline-block; box-sizing: border-box; transition: 0.2s; }
        .btn-black { background: var(--black); color: white; }
        .btn-pink { background: var(--main-pink); color: white; }
        .btn-del { height: 28px !important; line-height: 26px; background: #fff; color: #999; border: 1px solid #ddd; padding: 0 8px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; box-sizing: border-box; }
        .btn-del:hover { color: #e63946; border-color: #e63946; background: #fff0f0; }
        
        .schedule-adder { background: #fff; padding: 12px 15px; border-radius: 6px; border: 1px solid #eee; display: flex; gap: 8px; align-items: center; margin-bottom: 15px; flex-wrap: nowrap; width: 100%; max-width: 100%; box-sizing: border-box; }
        .adder-label { font-weight: bold; color: #555; white-space: nowrap; flex-shrink: 0; }
        .schedule-adder .input-date { width: 130px; flex-shrink: 0; }
        .schedule-adder .input-select { width: 110px; flex-shrink: 0; }
        .adder-bottom-row { display: flex; gap: 8px; flex: 1 1 auto; align-items: center; min-width: 0; } 
        .adder-bottom-row .input-text { flex: 1 1 auto; min-width: 0; width: 100%; }
        .adder-bottom-row .btn-black { flex: 0 0 60px !important; width: 60px !important; text-align: center; padding: 0; flex-shrink: 0; }

        .dash-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        
        .event-item { cursor: grab; font-size: 0.75rem; padding: 4px 6px; border-radius: 4px; margin-bottom: 3px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; color: #333; gap: 4px; user-select: none; }
        .event-item:active { cursor: grabbing; }
        .event-item:hover { filter: brightness(0.95); }
        .evt-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-grow: 1; }
        .evt-writer { background: transparent; padding: 0; font-size: 0.8rem; font-weight: 700; color: #555; flex-shrink: 0; margin-left: 4px; }
        
        .ev-pub { background: var(--color-pub); border-left: 3px solid #a3b8ac; }
        .ev-cover { background: var(--color-cover); border-left: 3px solid #ffbba1; }
        .ev-proof1 { background: var(--color-proof); border-left: 3px solid #ff9db3; }
        .ev-proof2 { background: #ffe3fa; border-left: 3px solid #d991ce; }
        .ev-task { background: var(--color-task); border-left: 3px solid #e08996; }
        .ev-email { background: var(--color-email); border-left: 3px solid #9ba0fc; }
        .ev-meeting { background: var(--color-meeting); border-left: 3px solid #e6c565; }

        .status-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; height: 32px; }
        .status-label { font-size: 0.75rem; font-weight: bold; color: #888; width: 40px; flex-shrink: 0; }
        .platform-box { padding: 10px; background: #fffcfd; border-radius: 6px; border: 1px solid var(--main-pink); }
        .platform-box-title { font-size: 0.75rem; font-weight: bold; color: var(--main-pink); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .platform-grid { display: flex; flex-wrap: wrap; gap: 6px; }
        .platform-grid label { font-size: 0.7rem; display: flex; align-items: center; gap: 2px; cursor: pointer; color: #222; }

        .date-grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; width: 100%; min-width: 220px; }
        .date-grid-item { display: flex; align-items: center; gap: 5px; }
        .date-grid-label { font-size: 0.75rem; color: #666; width: 25px; font-weight: bold; flex-shrink: 0; text-align: right; }

        .memo-board { display: flex; flex-wrap: wrap; gap: 15px; }
        .memo-postit { width: 440px; min-height: 440px; padding: 25px; border-radius: 4px; box-shadow: 2px 4px 8px rgba(0,0,0,0.05); position: relative; display: flex; flex-direction: column; background-color:#fff3b0; }
        .memo-postit textarea { flex-grow: 1; border: none; background: transparent; resize: none; font-family: 'Pretendard'; font-size: 1.1rem; line-height: 1.5; color: #333; outline: none; }
        .memo-date { font-size: 0.8rem; color: rgba(0,0,0,0.4); text-align: right; margin-top: 10px; font-weight: bold; }
        .memo-del { position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 0.9rem; font-weight: bold; color: rgba(0,0,0,0.3); transition: 0.2s; }
        .memo-del:hover { color: #e63946; }
        .memo-add-btn { width: 440px; height: 440px; border: 2px dashed #ccc; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; font-size: 1.2rem; color: #888; transition: 0.2s; }
        .memo-add-btn:hover { background: #eee; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 3000; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: #fff; padding: 25px; border-radius: 8px; width: 300px; max-height: 80vh; display: flex; flex-direction: column; }
        .mobile-only { display: none !important; }
        .desktop-only-td { display: table-cell; }

        /* ==========================================
           📱 모바일 전용 반응형 수정 영역 (앱 최적화)
           ========================================== */
        @media (max-width: 1200px), (orientation: portrait) {
            .sidebar { position: fixed; left: -240px; height: 100vh; height: 100dvh; box-shadow: 5px 0 15px rgba(0,0,0,0.2); }
            .sidebar-hover-zone { display: flex; align-items: center; position: fixed; left: 0; top: 0; bottom: 0; width: 15px; z-index: 1001; cursor: pointer; background: rgba(255,133,162,0.1); border-right: 1px solid rgba(255,133,162,0.2); }
            .sidebar-hover-zone::after { content: '▶'; position: absolute; left: 0; top: 50%; transform: translateY(-50%); background: var(--main-pink); color: white; padding: 10px 2px; font-size: 10px; border-radius: 0 4px 4px 0; }
            .sidebar-hover-zone:hover + .sidebar, .sidebar:hover { left: 0; }
            
            .main-container { padding: 15px 15px 15px 35px; margin: 0; width: 100%; box-sizing: border-box; }
            .dash-grid-3 { grid-template-columns: 1fr; }
            
            .memo-board { width: 100%; display: flex; flex-direction: column; gap: 15px; }
            .memo-postit { width: 100% !important; min-height: 320px !important; height: auto; }
            .memo-add-btn { width: 100% !important; height: 80px !important; min-height: 80px !important; font-size: 1rem; }

            .main-container.view-calendar { padding: 10px 10px 10px 35px !important; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
            .main-container.view-calendar .cal-wrapper { flex: 1; min-height: 0; display: flex; flex-direction: column; }
            .main-container.view-calendar .calendar-grid { flex: 1; min-height: 0; display: grid; overflow: hidden; }
            .main-container.view-calendar .day-box { min-height: 0; padding: 2px 4px; overflow-y: auto; }
            .main-container.view-calendar .day-num { font-size: 0.7rem; margin-bottom: 2px; }
            .main-container.view-calendar .event-item { font-size: 0.65rem; padding: 2px 4px; margin-bottom: 2px; }

            .schedule-adder { flex-wrap: wrap; height: auto; }
            .adder-label { flex: 1 1 100%; margin-bottom: 4px; display: block; }
            .schedule-adder .input-date { flex: 1 1 calc(33% - 8px); width: auto; }
            .schedule-adder .input-select { flex: 1 1 calc(33% - 8px); width: auto; }
            .adder-bottom-row { flex: 1 1 100%; width: 100%; margin-top: 4px; display: flex; gap: 8px; }

            .desktop-only-td, .liv-table td.desktop-only-td { display: none !important; }
            .mobile-only { display: flex !important; }
            .liv-table thead { display: none !important; }
            .table-wrap { overflow-x: hidden; }
            .liv-table { display: block; width: 100% !important; min-width: 0 !important; }
            .liv-table tbody, .liv-table tr { display: block; width: 100%; }
            .liv-table th { display: none; } 
            .liv-table tr { margin-bottom: 20px; border: 1px solid #ddd; border-radius: 10px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.02); padding: 15px; position: relative; display: flex; flex-direction: column; gap: 15px; }
            .liv-table td { display: block; width: 100%; padding: 0; border: none; position: static; }
            .row-child { border-left: 4px solid var(--main-pink); margin-left: 0; border-radius: 0 10px 10px 0; }
            .mobile-del-btn { display: block !important; position: absolute !important; top: 35px; right: 15px; z-index: 10; margin: 0; }
            .mobile-title-wrap { padding-right: 50px; } 
            .date-grid-2x2 { gap: 10px; min-width: 0; }
        }

        #firebase-loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fafbfc; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .loading-spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--main-pink); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="firebase-loading">
        <div class="loading-spinner"></div>
        <h2 style="color:var(--main-pink); margin:0;">데이터 동기화 중...</h2>
        <p style="color:#888; font-size:0.9rem;">PC와 모바일을 연결하고 있습니다.</p>
    </div>

    <div class="sidebar-hover-zone"></div>
    <aside class="sidebar">
        <div class="logo-area">
            <h1 class="logo-title">LIV</h1>
            <div class="logo-subtitle">publishing</div>
        </div>
        <div class="nav-group">
            <div class="nav-item active" onclick="changeView('dashboard')">데스크</div>
            <div class="nav-item" onclick="changeView('calendar')">스케줄러</div>
            <div class="nav-item" onclick="changeView('memo')">메모</div>
            <div class="nav-label">Management</div>
            <div class="nav-item" onclick="changeView('writer'); toggleWriters();">계약 작가 관리 <span>▼</span></div>
            <div class="writer-sub-list show" id="sidebar-writer-list"></div>
            <div style="padding: 15px 25px; text-align: center;">
                <button class="btn btn-black" style="width: 100%; height: 36px; line-height: 36px;" onclick="openWriterModal()">+ 새 작가 등록</button>
            </div>
            <div style="padding: 0 25px 15px; text-align: center; display:flex; gap:5px;">
                <button class="btn btn-del" style="flex:1; height: 30px !important; line-height:28px; padding:0;" onclick="exportData()">데이터 백업</button>
                <button class="btn btn-del" style="flex:1; height: 30px !important; line-height:28px; padding:0;" onclick="document.getElementById('import-input').click()">데이터 복원</button>
                <input type="file" id="import-input" style="display:none;" accept=".json" onchange="importData(event)">
            </div>
        </div>
        <div style="padding: 15px; font-size: 0.7rem; color: #555; text-align: center; border-top: 1px solid #222;">Liv Publishing Team</div>
    </aside>

    <main class="main-container" id="main-view"></main>

    <div class="modal-overlay" id="writer-modal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:var(--main-pink);">새 작가 등록</h3>
            <label>작가명 (필명)</label><input type="text" id="new-writer-name" class="input-text">
            <label>교정 스타일</label>
            <select id="new-writer-proof" class="input-select">
                <option value="피드백과 함께 꼼꼼 교정">피드백과 함께 꼼꼼 교정</option><option value="피드백과 함께 러프 교정">피드백과 함께 러프 교정</option><option value="피드백 없이 꼼꼼 교정">피드백 없이 꼼꼼 교정</option><option value="피드백 없이 러프 교정">피드백 없이 러프 교정</option>
            </select>
            <label>메일 수신 시간</label>
            <select id="new-writer-email" class="input-select"><option value="상시 연락">상시 연락</option><option value="평일 주간만">평일 주간만</option></select>
            <div style="display:flex; justify-content:space-between; margin-top:20px; gap:10px;">
                <button class="btn btn-del" style="flex:1; height: 36px;" onclick="closeWriterModal()">취소</button>
                <button class="btn btn-black" style="flex:1; height: 36px;" onclick="confirmAddWriter()">등록</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="day-modal">
        <div class="modal-content" style="width: 320px; max-width: 90%;">
            <h3 style="margin-top:0; color:var(--black); border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center;">
                <span id="day-modal-title">날짜</span>
                <span style="font-size: 0.8rem; color: var(--main-pink); cursor: pointer; padding: 5px;" onclick="closeDayModal()">✕ 닫기</span>
            </h3>
            <div id="day-modal-list" style="overflow-y: auto; flex-grow: 1; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js?v=' + new Date().getTime()).catch(err => console.log('SW Fail:', err));
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBipOGzVqm1vcTrgN9b6IXGtfewOgtJJb8",
            authDomain: "liv-management.firebaseapp.com",
            projectId: "liv-management",
            storageBucket: "liv-management.firebasestorage.app",
            messagingSenderId: "206638436310",
            appId: "1:206638436310:web:3ec139c6522a84a89c5e77",
            measurementId: "G-WX64SC0CDS"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let livData = { writers: [], extraTasks: [], memos: [] };
        let currentDate = new Date();
        let currentCalFilter = 'all';
        let currentWriterFilter = null; 
        let currentSearchText = ''; 
        let currentViewName = 'dashboard';
        let currentViewParam = null;

        db.collection("config").doc("mainData").onSnapshot((doc) => {
            document.getElementById('firebase-loading').style.display = 'none'; 
            if (doc.metadata.hasPendingWrites) return;
            if (doc.exists) {
                livData = doc.data();
                if(!livData.writers) livData.writers = [];
                if(!livData.extraTasks) livData.extraTasks = [];
                if(!livData.memos) livData.memos = [];
                renderSidebarWriters();
                changeView(currentViewName, currentViewParam); 
            } else {
                const saved = localStorage.getItem('livDataFinal_v21'); 
                if (saved) livData = JSON.parse(saved);
                saveData(); 
            }
        });

        function saveData() { db.collection("config").doc("mainData").set(livData); renderSidebarWriters(); }

        const msStatuses = ['계약 완료', '원고 피드백', '원고 입고 대기', '1교 대기', '1교 중', '1교 완료', '작교 대기', '작교 완료', '2교 대기', '2교 중', '2교 완료', '최종고 완성', '이펍 제작 완료', '출간 등록 완료', '출간 대기', '출간 완료'];
        const coverStatuses = ['제안서 입고 전', '제안서 입고 완료', '제작 중', '제작 완료'];
        const platforms = ['리디', '시리즈', '예스24', '알라딘', '교보문고', '미스터블루', '봄툰', '북큐브', '구글북스', '스토린랩'];

        function getStatusColor(status, type) {
            const list = type === 'ms' ? msStatuses : coverStatuses;
            const idx = list.indexOf(status);
            if(idx === -1 || idx === 0) return '#ffffff'; 
            const lightness = 98 - (idx / (list.length - 1)) * 28;
            return `hsl(345, 60%, ${lightness}%)`;
        }

        function exportData() {
            const dataStr = JSON.stringify(livData);
            const blob = new Blob([dataStr], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `liv_backup.json`; a.click(); URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData && typeof importedData === 'object') {
                        livData = importedData; saveData(); alert('복원 성공!'); changeView('dashboard');
                    }
                } catch (err) { alert('오류 발생'); }
                event.target.value = ''; 
            };
            reader.readAsText(file);
        }

        // ★ 모바일 사이드바의 '터치 잔상'을 완벽하게 죽이는 마법의 코드 ★
        function closeSidebarMobile() {
            if (window.matchMedia('(max-width: 1200px), (orientation: portrait)').matches) {
                const sidebar = document.querySelector('.sidebar');
                
                // 1. 강제로 왼쪽으로 밀어 넣어서 닫음 (애니메이션 0.3초)
                sidebar.style.setProperty('left', '-240px', 'important');
                
                // 2. 애니메이션이 끝난 직후
                setTimeout(() => { 
                    sidebar.style.display = 'none'; // 브라우저의 '손가락 잔상' 기억을 강제로 날려버림
                    sidebar.style.left = ''; // 강제 값 제거 (잔상이 없어서 안 튀어나옴)
                    
                    // 3. 아주 짧은 시간 뒤에 본래 속성(flex)으로 복구
                    setTimeout(() => {
                        sidebar.style.display = ''; 
                    }, 50);
                }, 300); 
            }
        }

        function changeView(view, param = null) {
            currentViewName = view; currentViewParam = param;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const main = document.getElementById('main-view');
            
            if(view === 'calendar') main.classList.add('view-calendar');
            else main.classList.remove('view-calendar');

            if(view === 'dashboard') { document.querySelectorAll('.nav-item')[0].classList.add('active'); renderDashboard(main); }
            else if(view === 'calendar') { document.querySelectorAll('.nav-item')[1].classList.add('active'); currentDate = new Date(); currentCalFilter = 'all'; renderCalendar(main); }
            else if(view === 'memo') { document.querySelectorAll('.nav-item')[2].classList.add('active'); renderMemoBoard(main); }
            else if(view === 'writer') { document.querySelectorAll('.nav-item')[3].classList.add('active'); if(param === null) { currentWriterFilter = null; currentSearchText = ''; } renderWriterDetail(main, param); }
            
            // 작가관리 메뉴를 펼치는 터치가 아니라면 무조건 사이드바 접기 (터치 잔상 완벽 제거)
            if (!(view === 'writer' && param === null)) {
                closeSidebarMobile();
            }
        }

        function getWriterOptions() { let html = `<option value="">[선택 안함]</option>`; livData.writers.forEach(w => html += `<option value="${w.id}">${w.name}</option>`); return html; }

        function renderDashboard(container) {
            const tzoffset = (new Date()).getTimezoneOffset() * 60000;
            const today = new Date(Date.now() - tzoffset);
            const tom = new Date(today.getTime() + 86400000);
            const afterTom = new Date(today.getTime() + 86400000 * 2);

            container.innerHTML = `
                <h2>업무 데스크</h2>
                <div class="schedule-adder">
                    <span class="adder-label">+ 빠른 등록</span>
                    <input type="date" id="dash-date" class="input-date" value="${today.toISOString().split('T')[0]}">
                    <select id="dash-writer" class="input-select">${getWriterOptions()}</select>
                    <select id="dash-type" class="input-select"><option value="ev-task">일반</option><option value="ev-email">메일</option><option value="ev-meeting">미팅</option></select>
                    <div class="adder-bottom-row"><input type="text" id="dash-title" class="input-text" placeholder="일정 내용을 입력하세요"><button class="btn btn-black" onclick="addExtraTask('dash-date', 'dash-writer', 'dash-type', 'dash-title', 'dashboard')">등록</button></div>
                </div>
                <div class="dash-grid-3">
                    <div class="card" style="padding: 15px;"><h3 style="margin-top:0; font-size:1rem; border-bottom:1px solid #eee; padding-bottom:10px;">오늘 (${today.getMonth()+1}/${today.getDate()})</h3><div id="today-tasks"></div></div>
                    <div class="card" style="padding: 15px;"><h3 style="margin-top:0; font-size:1rem; border-bottom:1px solid #eee; padding-bottom:10px;">내일 (${tom.getMonth()+1}/${tom.getDate()})</h3><div id="tom-tasks"></div></div>
                    <div class="card" style="padding: 15px;"><h3 style="margin-top:0; font-size:1rem; border-bottom:1px solid #eee; padding-bottom:10px;">모레 (${afterTom.getMonth()+1}/${afterTom.getDate()})</h3><div id="after-tasks"></div></div>
                </div>
            `;
            updateTasksHtml(today.toISOString().split('T')[0], 'today-tasks', 'dashboard', 'all'); updateTasksHtml(tom.toISOString().split('T')[0], 'tom-tasks', 'dashboard', 'all'); updateTasksHtml(afterTom.toISOString().split('T')[0], 'after-tasks', 'dashboard', 'all');

        function addExtraTask(dateId, writerSelId, typeId, titleId, view) {
            const date = document.getElementById(dateId).value; const wId = document.getElementById(writerSelId).value; const type = document.getElementById(typeId).value; const title = document.getElementById(titleId).value;
            if(!title || !date) return; if(!livData.extraTasks) livData.extraTasks = []; livData.extraTasks.push({ id: Date.now(), date, writerId: wId, type, title }); saveData(); changeView(view);
        }

        function completeWorkTask(wId, workId, key, view) {
            if(!confirm('달력에서 지우시겠습니까?')) return; const work = livData.writers.find(x => x.id === wId).works.find(x => x.id === workId);
            if (!work.completedDates) work.completedDates = {}; work.completedDates[key] = true; saveData(); changeView(view);
        }
        function completeExtraTask(taskId, view) { if(!confirm('일반 일정을 완료하시겠습니까?')) return; livData.extraTasks = livData.extraTasks.filter(t => t.id !== taskId); saveData(); changeView(view); }

        function drag(ev, type, wId, itemId) { ev.dataTransfer.setData("type", type); ev.dataTransfer.setData("wId", wId); ev.dataTransfer.setData("itemId", itemId); }
        function allowDrop(ev) { ev.preventDefault(); }
        function drop(ev, newDate) {
            ev.preventDefault(); const type = ev.dataTransfer.getData("type"); const wId = ev.dataTransfer.getData("wId"); const itemId = ev.dataTransfer.getData("itemId"); if (!type) return;
            if (type === 'extraTask') { const task = livData.extraTasks.find(t => t.id == itemId); if (task) task.date = newDate; } 
            else { const writer = livData.writers.find(w => w.id == wId); if (writer) { const work = writer.works.find(w => w.id == itemId); if (work) work[type] = newDate; } }
            saveData(); renderCalendar(document.getElementById('main-view'));
        }

        function renderCalendar(container) {
            const year = currentDate.getFullYear(); const month = currentDate.getMonth(); 
            const todayStr = new Date(Date.now() - (new Date()).getTimezoneOffset() * 60000).toISOString().split('T')[0];
            const firstDay = new Date(year, month, 1).getDay(); const daysInMonth = new Date(year, month + 1, 0).getDate();
            const weeks = Math.ceil((firstDay + daysInMonth) / 7);

            let html = `
                <div class="cal-wrapper">
                    <div class="card" style="padding: 15px 20px; margin-bottom: 10px;">
                        <div class="cal-header-wrap">
                            <div class="cal-nav"><button class="cal-btn" onclick="moveMonth(-1)">◀</button><span>${year}년 ${month + 1}월</span><button class="cal-btn" onclick="moveMonth(1)">▶</button></div>
                            <div class="filter-group">
                                <button class="filter-btn ${currentCalFilter==='all'?'active':''}" onclick="setCalFilter('all')">전체</button>
                                <button class="filter-btn ${currentCalFilter==='pub'?'active':''}" onclick="setCalFilter('pub')">출간</button>
                                <button class="filter-btn ${currentCalFilter==='cover'?'active':''}" onclick="setCalFilter('cover')">표지</button>
                                <button class="filter-btn ${currentCalFilter==='proof'?'active':''}" onclick="setCalFilter('proof')">교정</button>
                            </div>
                        </div>
                        <div class="schedule-adder" style="margin-bottom:0; padding:0; border:none;">
                            <input type="date" id="cal-date" class="input-date" value="${todayStr}">
                            <select id="cal-writer" class="input-select">${getWriterOptions()}</select>
                            <select id="cal-type" class="input-select"><option value="ev-task">일반</option><option value="ev-email">메일</option><option value="ev-meeting">미팅</option></select>
                            <div class="adder-bottom-row"><input type="text" id="cal-title" class="input-text" placeholder="달력에 바로 등록"><button class="btn btn-black" onclick="addExtraTask('cal-date', 'cal-writer', 'cal-type', 'cal-title', 'calendar')">등록</button></div>
                        </div>
                    </div>
                    <div class="calendar-grid" style="grid-template-rows: auto repeat(${weeks}, minmax(0, 1fr));">
                        ${['일','월','화','수','목','금','토'].map(d => `<div class="day-header">${d}</div>`).join('')}
            `;
            for(let i=0; i<firstDay; i++) html += `<div></div>`;
            for(let i=1; i<=daysInMonth; i++) {
                const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const isToday = dStr === todayStr ? 'today' : '';
                html += `<div class="day-box ${isToday}" ondragover="allowDrop(event)" ondrop="drop(event, '${dStr}')" onclick="openDayModal(event, '${dStr}')">
                            <div class="day-num">${i}</div>
                            <div id="cal-day-${dStr}" style="display:flex; flex-direction:column; gap:2px; min-height: 10px;"></div>
                         </div>`;
            }
            html += `</div></div>`;
            container.innerHTML = html;

            for(let i=1; i<=daysInMonth; i++) updateTasksHtml(`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`, `cal-day-${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`, 'calendar', currentCalFilter);
        }

        function openDayModal(e, dateStr) {
            if (e && e.target && e.target.closest && e.target.closest('.event-item')) return;
            const titleEl = document.getElementById('day-modal-title'); const listEl = document.getElementById('day-modal-list');
            const parts = dateStr.split('-'); titleEl.innerText = `${parts[0]}년 ${parseInt(parts[1], 10)}월 ${parseInt(parts[2], 10)}일 일정`;
            
            let listHtml = '';
            livData.writers.forEach(w => w.works.forEach(work => {
                if (work.pubDate === dateStr) listHtml += createDayModalItemHtml('ev-pub', '[출간]', work.title, w.name, work.completedDates && work.completedDates.pubDate);
                if (work.coverDate === dateStr) listHtml += createDayModalItemHtml('ev-cover', '[표지]', work.title, w.name, work.completedDates && work.completedDates.coverDate);
                if (work.proofDate === dateStr) listHtml += createDayModalItemHtml('ev-proof1', '[1교]', work.title, w.name, work.completedDates && work.completedDates.proofDate);
                if (work.proofDate2 === dateStr) listHtml += createDayModalItemHtml('ev-proof2', '[2교]', work.title, w.name, work.completedDates && work.completedDates.proofDate2);
            }));
            
            if (livData.extraTasks) {
                livData.extraTasks.forEach(t => {
                    if (t.date === dateStr) { const writerObj = t.writerId ? livData.writers.find(x => x.id == t.writerId) : null; listHtml += createDayModalItemHtml(t.type, '', t.title, writerObj ? writerObj.name : '', false); }
                });
            }
            if (listHtml === '') listHtml = '<div style="color:#999; text-align:center; padding: 40px 0; font-size: 0.95rem;">등록된 일정이 없습니다.</div>';
            listEl.innerHTML = listHtml; document.getElementById('day-modal').classList.add('show');
        }
        
        function createDayModalItemHtml(typeClass, prefix, title, writerName, isCompleted) {
            const completedStyle = isCompleted ? 'text-decoration: line-through; opacity: 0.4;' : '';
            return `<div class="event-item ${typeClass}" style="padding: 12px 10px; font-size: 0.95rem; cursor: default; margin-bottom: 4px; ${completedStyle}"><div style="font-weight: 800; flex-grow:1; white-space: normal; word-break: keep-all;">${prefix} ${title}</div>${writerName ? `<div style="font-size: 0.8rem; color:#555; font-weight: bold; background:rgba(255,255,255,0.6); padding: 4px 8px; border-radius: 4px; flex-shrink: 0; margin-left: 10px;">${writerName}</div>` : ''}</div>`;
        }
        
        function closeDayModal() { document.getElementById('day-modal').classList.remove('show'); }
        function moveMonth(dir) { currentDate.setMonth(currentDate.getMonth() + dir); renderCalendar(document.getElementById('main-view')); }
        function setCalFilter(filter) { currentCalFilter = filter; renderCalendar(document.getElementById('main-view')); }

        function updateTasksHtml(dateStr, containerId, view, filter) {
            const el = document.getElementById(containerId); if(!el) return; let html = '';
            livData.writers.forEach(w => w.works.forEach(work => {
                const wTag = `<span class="evt-writer">${w.name}</span>`;
                if((filter === 'all' || filter === 'pub') && work.pubDate === dateStr && !(work.completedDates && work.completedDates.pubDate)) html += `<div class="event-item ev-pub" draggable="true" ondragstart="drag(event, 'pubDate', ${w.id}, ${work.id})" ondblclick="completeWorkTask(${w.id}, ${work.id}, 'pubDate', '${view}')"><span class="evt-title">[출간] ${work.title}</span> ${wTag}</div>`;
                if((filter === 'all' || filter === 'cover') && work.coverDate === dateStr && !(work.completedDates && work.completedDates.coverDate)) html += `<div class="event-item ev-cover" draggable="true" ondragstart="drag(event, 'coverDate', ${w.id}, ${work.id})" ondblclick="completeWorkTask(${w.id}, ${work.id}, 'coverDate', '${view}')"><span class="evt-title">[표지] ${work.title}</span> ${wTag}</div>`;

            }));
            if(livData.extraTasks) { livData.extraTasks.forEach(t => { if((filter === 'all' || filter === 'task') && t.date === dateStr) { const writerObj = t.writerId ? livData.writers.find(x => x.id == t.writerId) : null; const wTag = writerObj ? `<span class="evt-writer">${writerObj.name}</span>` : ''; html += `<div class="event-item ${t.type}" draggable="true" ondragstart="drag(event, 'extraTask', null, ${t.id})" ondblclick="completeExtraTask(${t.id}, '${view}')"><span class="evt-title">${t.title}</span> ${wTag}</div>`; } }); }
            el.innerHTML = html;
        }

            let html = `<h2>출판사 중요 메모</h2><div class="memo-board"><div class="memo-add-btn" onclick="addMemo()">+ 새 메모 추가</div>`;

        function executeTextSearch() { currentSearchText = document.getElementById('search-writer-input').value.toLowerCase(); currentWriterFilter = null; renderWriterDetail(document.getElementById('main-view'), null); }
        function filterByChip(wId) { currentWriterFilter = wId; currentSearchText = ''; renderWriterDetail(document.getElementById('main-view'), wId); }

                    <div style="display:flex; flex-direction:column; gap:15px;">
                        <div style="display:flex; gap:10px;"><input type="text" id="search-writer-input" value="${currentSearchText}" class="input-text" placeholder="작가 이름 또는 작품 이름을 검색하세요..." style="font-size:1rem; padding:0 15px; height:45px!important; border-color:var(--main-pink);" onkeyup="if(event.key==='Enter') executeTextSearch()"><button class="btn btn-black" style="height:45px!important; width:80px; font-size:1rem; padding: 0;" onclick="executeTextSearch()">검색</button></div>

        function renderFilteredWriters() {
            const container = document.getElementById('writers-container'); let writersToRender = JSON.parse(JSON.stringify(livData.writers));
            if (currentWriterFilter) { writersToRender = writersToRender.filter(w => w.id === currentWriterFilter); }

        function generateWorkRows(writer) {

            let html = ''; writer.works.filter(w => !w.parentId).forEach(p => { html += getRowHtml(writer.id, p, false); writer.works.filter(w => w.parentId === p.id).forEach(c => { html += getRowHtml(writer.id, c, true); }); });

        function getRowHtml(writerId, w, isChild) {
            const rowClass = isChild ? 'row-child' : ''; const prefix = isChild ? `<span class="child-indicator">└</span>` : ''; const baseTitleStr = w.title.replace(/\s*\d+권$/, '').replace(/'/g, "\\'");
            const msBg = getStatusColor(w.msStatus, 'ms'); const cvBg = getStatusColor(w.coverStatus, 'cover');

            let statusHtml = '';
            if (w.msStatus === '출간 완료') {
                statusHtml = `<div class="platform-box" style="margin-top:0; padding:10px;"><div class="platform-box-title" style="margin-bottom:8px;"><span>론칭 플랫폼</span><button class="btn-del" style="height:22px; line-height:20px; font-size:0.7rem;" onclick="revertStatus(${writerId}, ${w.id})">상태 변경</button></div><div class="platform-grid">${platforms.map(p => `<label><input type="checkbox" ${w.platforms && w.platforms.includes(p) ? 'checked' : ''} onchange="togglePlatform(${writerId}, ${w.id}, '${p}')"> ${p}</label>`).join('')}</div></div>`;
            } else {
                statusHtml = `<div class="status-row"><span class="status-label">작업</span><select class="input-select" style="background-color:${msBg}; font-weight:bold;" onchange="updateWork(${writerId}, ${w.id}, 'msStatus', this.value)"><option value="" disabled selected>선택</option>${msStatuses.map(s => `<option ${w.msStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="status-row"><span class="status-label">표지</span><select class="input-select" style="background-color:${cvBg}; font-weight:bold;" onchange="updateWork(${writerId}, ${w.id}, 'coverStatus', this.value)"><option value="" disabled selected>선택</option>${coverStatuses.map(s => `<option ${w.coverStatus===s?'selected':''}>${s}</option>`).join('')}</select></div>`;
            }

            return `
                <tr class="${rowClass}">
                    <td>
                        <div class="mobile-only mobile-del-btn"><button class="btn-del" onclick="deleteWork(${writerId}, ${w.id})">삭제</button></div>
                        <div style="display:flex; gap:12px; align-items:flex-start;">
                            <label style="cursor:pointer; flex-shrink:0;" title="표지 등록"><img src="${w.coverImg || 'https://via.placeholder.com/75x105?text=Cover'}" class="cover-thumb" id="thumb-${w.id}"><input type="file" style="display:none;" accept="image/*" onchange="uploadWorkCover(this, ${writerId}, ${w.id})"></label>
                            <div class="mobile-title-wrap" style="display:flex; flex-direction:column; gap:6px; flex-grow:1;">
                                <div style="display:flex; align-items:center; gap:5px;">${prefix}<span style="font-weight: 800; font-size: 0.95rem; color: #222; word-break: keep-all; padding-top:4px;">${w.title}</span></div>
                                <div class="mobile-only" style="flex-wrap:wrap; align-items:center; gap:6px; background:rgba(0,0,0,0.03); padding:5px 8px; border-radius:4px; border:1px solid #eaeaea;"><span style="font-size:0.75rem; font-weight:bold; color:#666;">인세:</span><input type="number" class="input-text" style="width:55px; height:28px!important;" value="${w.royalty}" onchange="updateWork(${writerId}, ${w.id}, 'royalty', this.value)">%<span style="font-size:0.75rem; font-weight:bold; color:#666; margin-left:5px;">후속:</span>${!isChild ? `<select class="input-select" style="padding:0 6px; width:45px; height:28px!important;" onchange="updateWork(${writerId}, ${w.id}, 'sequel', this.value)"><option value="N" ${w.sequel==='N'?'selected':''}>N</option><option value="Y" ${w.sequel==='Y'?'selected':''}>Y</option></select>${w.sequel === 'Y' ? `<button class="btn" style="background:#ddd; color:#333; height:28px!important; line-height:28px; padding:0 6px; font-size:0.7rem;" onclick="addSequel(${writerId}, ${w.id}, '${baseTitleStr}')">생성</button>` : ''}` : `<span style="color:#aaa; font-size:0.7rem;">종속</span>`}</div>
                            </div>
                        </div>
                    </td>
                    <td class="desktop-only-td"><input type="number" class="input-text" value="${w.royalty}" onchange="updateWork(${writerId}, ${w.id}, 'royalty', this.value)"></td>
                    <td class="desktop-only-td">${!isChild ? `<div style="display:flex; align-items:center; gap:5px;"><select class="input-select" style="padding:0 6px; width:50px;" onchange="updateWork(${writerId}, ${w.id}, 'sequel', this.value)"><option value="N" ${w.sequel==='N'?'selected':''}>N</option><option value="Y" ${w.sequel==='Y'?'selected':''}>Y</option></select>${w.sequel === 'Y' ? `<button class="btn" style="background:#eee; color:#333; padding:0 8px; font-size:0.75rem;" onclick="addSequel(${writerId}, ${w.id}, '${baseTitleStr}')">생성</button>` : ''}</div>` : `<span style="color:#aaa; font-size:0.75rem; padding-left:5px;">종속됨</span>`}</td>
                    <td>${statusHtml}</td>
                    <td><div class="date-grid-2x2"><div class="date-grid-item"><span class="date-grid-label">출간</span><input type="date" class="input-date" value="${w.pubDate}" onchange="updateWork(${writerId}, ${w.id}, 'pubDate', this.value)"></div><div class="date-grid-item"><span class="date-grid-label">1교</span><input type="date" class="input-date" value="${w.proofDate}" onchange="updateWork(${writerId}, ${w.id}, 'proofDate', this.value)"></div><div class="date-grid-item"><span class="date-grid-label">표지</span><input type="date" class="input-date" value="${w.coverDate}" onchange="updateWork(${writerId}, ${w.id}, 'coverDate', this.value)"></div><div class="date-grid-item"><span class="date-grid-label">2교</span><input type="date" class="input-date" value="${w.proofDate2 || ''}" onchange="updateWork(${writerId}, ${w.id}, 'proofDate2', this.value)"></div></div></td>
                    <td class="desktop-only-td" style="text-align:center;"><button class="btn-del" onclick="deleteWork(${writerId}, ${w.id})">삭제</button></td>
                </tr>
            `;
        }

        function revertStatus(wId, workId) { updateWork(wId, workId, 'msStatus', '출간 대기'); }
        function togglePlatform(wId, workId, platform) {
            const w = livData.writers.find(x => x.id === wId); const work = w.works.find(x => x.id === workId);
            if(!work.platforms) work.platforms = []; if(work.platforms.includes(platform)) work.platforms = work.platforms.filter(p => p !== platform); else work.platforms.push(platform); saveData();
        }
        function updateWork(wId, workId, key, val) {
            const w = livData.writers.find(x => x.id === wId); const work = w.works.find(x => x.id === workId); work[key] = val;
            if (['pubDate', 'coverDate', 'proofDate', 'proofDate2'].includes(key)) { if (work.completedDates && work.completedDates[key]) { work.completedDates[key] = false; } }
            saveData(); if (['msStatus', 'coverStatus', 'sequel'].includes(key)) { changeView('writer', currentWriterFilter); }
        }

        function openWriterModal() { 
            document.getElementById('writer-modal').classList.add('show'); 
            closeSidebarMobile(); // 모달창 열 때 사이드바 접기
        }
        function closeWriterModal() { document.getElementById('writer-modal').classList.remove('show'); document.getElementById('new-writer-name').value = ''; }
        function confirmAddWriter() {
            const name = document.getElementById('new-writer-name').value; if(!name) return alert("작가명을 입력하세요.");
            livData.writers.push({ id: Date.now(), name, proofStyle: document.getElementById('new-writer-proof').value, emailTime: document.getElementById('new-writer-email').value, works: [] });
            saveData(); closeWriterModal(); changeView('writer', livData.writers[livData.writers.length-1].id);
        }

        function uploadWorkCover(input, wId, workId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { const img = new Image(); img.onload = function() { const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); canvas.width = 120; canvas.height = img.height * (120/img.width); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); const b64 = canvas.toDataURL('image/jpeg', 0.7); document.getElementById(`thumb-${workId}`).src = b64; updateWork(wId, workId, 'coverImg', b64); }; img.src = e.target.result; }; reader.readAsDataURL(input.files[0]);
            }
        }

        function toggleWriters() { document.getElementById('sidebar-writer-list').classList.toggle('show'); }
        function renderSidebarWriters() { document.getElementById('sidebar-writer-list').innerHTML = livData.writers.map(w => `<div class="writer-sub-item" onclick="changeView('writer', ${w.id})">${w.name}</div>`).join(''); }
        
        function addWork(wId) { const title = prompt("추가할 작품의 제목을 입력하세요:"); if(!title) return; livData.writers.find(x => x.id === wId).works.push({ id: Date.now(), title: title, royalty: 70, sequel: 'N', msStatus: '계약 완료', coverStatus: '제안서 입고 전', pubDate: '', coverDate: '', proofDate: '', proofDate2: '', coverImg: '', platforms: [] }); saveData(); changeView('writer', currentWriterFilter); }
        function addSequel(wId, parentId, baseTitle) { const w = livData.writers.find(x => x.id === wId); const childCount = w.works.filter(x => x.parentId === parentId).length; const nextVol = childCount + 2; w.works.push({ id: Date.now(), title: `${baseTitle} ${nextVol}권`, parentId: parentId, royalty: 70, sequel: 'N', msStatus: '계약 완료', coverStatus: '제안서 입고 전', pubDate: '', coverDate: '', proofDate: '', proofDate2: '', coverImg: '', platforms: [] }); saveData(); changeView('writer', currentWriterFilter); }
        function deleteWriter(wId) { if(!confirm('계정을 삭제하시겠습니까?')) return; livData.writers = livData.writers.filter(w => w.id !== wId); saveData(); changeView('dashboard'); }
        function deleteWork(wId, workId) { if(!confirm('작품을 삭제하시겠습니까?')) return; const w = livData.writers.find(x => x.id === wId); w.works = w.works.filter(x => x.id !== workId && x.parentId !== workId); saveData(); changeView('writer', currentWriterFilter); }
    </script>
</body>
</html>
