<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIV 시스템</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LIV 시스템">
    <meta name="theme-color" content="#ff85a2">
    <link rel="manifest" href="./manifest.json">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        /* ==========================================
           공통/PC 디자인
           ========================================== */
        :root {
            --main-pink: #ff85a2; --soft-pink: #fff0f3; --black: #111111; 
            --gray-light: #f4f6f8; --white: #ffffff;
            --color-pub: #e8f0eb; --color-cover: #fff0e6; --color-proof: #ffe6eb;
            --color-task: #fdf5f6; --color-email: #eff0ff; --color-meeting: #fcf4dd;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; font-family: 'Pretendard', sans-serif; background-color: var(--gray-light); color: var(--black); display: flex; }

        .sidebar { width: 240px; background: var(--black); color: var(--white); display: flex; flex-direction: column; padding: 0; z-index: 1000; flex-shrink: 0; transition: left 0.3s ease; height: 100%; }
        .logo-area { padding: 30px 20px; text-align: center; border-bottom: 1px solid #222; }
        .logo-title { font-size: 2rem; font-weight: 800; letter-spacing: 2px; margin: 0; font-family: serif; color: var(--white); }
        .logo-subtitle { font-size: 0.75rem; font-weight: 300; letter-spacing: 4px; color: var(--main-pink); margin-top: 5px; text-transform: uppercase; }

        .nav-group { padding: 15px 0; flex-grow: 1; overflow-y: auto; }
        .nav-label { padding: 15px 25px 5px; font-size: 0.75rem; color: #666; font-weight: bold; }
        .nav-item { padding: 12px 25px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 0.9rem; color: #ddd; border-left: 3px solid transparent; }
        .nav-item:hover { background: #1a1a1a; color: var(--white); }
        .nav-item.active { background: #1a1a1a; border-left: 3px solid var(--main-pink); color: var(--main-pink); font-weight: bold; }
        
        .writer-sub-list { background: #0a0a0a; display: none; }
        .writer-sub-list.show { display: block; }
        .writer-sub-item { padding: 10px 25px 10px 40px; font-size: 0.85rem; cursor: pointer; color: #888; }
        .writer-sub-item:hover { color: var(--white); background: #111; }

        .main-container { flex-grow: 1; padding: 25px; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; background: #fafbfc; min-width: 0; position: relative; }
        .card { background: var(--white); border-radius: 10px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); border: 1px solid #eaeaea; margin-bottom: 20px; }
        
        /* 업무 데스크 */
        .dash-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .schedule-adder { background: #fff; padding: 12px 15px; border-radius: 6px; border: 1px solid #eee; display: flex; gap: 8px; align-items: center; margin-bottom: 15px; flex-wrap: nowrap; width: 100%; box-sizing: border-box; }
        .adder-label { font-weight: bold; color: #555; white-space: nowrap; flex-shrink: 0; }
        .schedule-adder .input-date { width: 130px; flex-shrink: 0; }
        .schedule-adder .input-select { width: 110px; flex-shrink: 0; }
        .adder-bottom-row { display: flex; gap: 8px; flex: 1 1 auto; align-items: center; min-width: 0; } 
        .adder-bottom-row .input-text { flex: 1 1 auto; min-width: 0; width: 100%; }
        .adder-bottom-row .btn-black { flex: 0 0 60px !important; width: 60px !important; text-align: center; padding: 0; flex-shrink: 0; }

        /* 캘린더 공통 */
        .cal-wrapper, .week-cal-wrapper { display: flex; flex-direction: column; flex-grow: 1; height: 100%; }
        .cal-header-wrap { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .cal-nav { display: flex; align-items: center; gap: 15px; font-size: 1.2rem; font-weight: bold; }
        .cal-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 5px; color: #555; }
        .filter-group { display: flex; gap: 5px; }
        .filter-btn { padding: 5px 10px; border: 1px solid #ddd; background: #fff; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
        .filter-btn.active { background: var(--main-pink); border-color: var(--main-pink); color: #fff; font-weight: bold; }
        
        .calendar-grid { flex-grow: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day-header { text-align: center; font-weight: bold; padding: 4px 0; color: #888; font-size: 0.85rem; }
        .day-box { background: #fff; border: 1px solid #eee; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; overflow-y: auto; min-height: 0; cursor: pointer; }
        .day-box.today { background: var(--soft-pink); border: 1px solid var(--main-pink); }
        .day-num { font-weight: 700; margin-bottom: 5px; font-size: 0.8rem; }

        /* 주간 캘린더 (4x2) */
        .week-grid { flex-grow: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 10px; }
        .week-day-box { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; overflow-y: auto; min-height: 0; cursor: pointer; }
        .week-day-header { font-weight: 800; font-size: 1rem; margin-bottom: 10px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .week-day-box.today { border: 2px solid var(--main-pink); background: var(--soft-pink); }

        /* 미니 달력 네비게이터 */
        .week-nav-box { background: #fff; border: 2px solid var(--main-pink); border-radius: 10px; display: flex; flex-direction: column; padding: 10px; overflow: hidden; }
        .mini-cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-weight: bold; font-size: 0.85rem; color: var(--main-pink); }
        .mini-cal-header span { cursor: pointer; padding: 0 5px; }
        .mini-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; flex-grow: 1; }
        .mini-day { font-size: 0.6rem; text-align: center; color: #999; padding: 1px 0; }
        .mini-day.active { background: var(--main-pink); color: white; border-radius: 2px; }

        /* 일정 아이템 */
        .event-item, .week-evt-item { cursor: grab; font-size: 0.75rem; padding: 4px 6px; border-radius: 4px; margin-bottom: 3px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid transparent; }
        .event-item:active, .week-evt-item:active { cursor: grabbing; }
        .evt-title, .week-evt-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-grow: 1; }
        .evt-writer, .week-evt-writer { font-size: 0.75rem; font-weight: 800; color: #555; background: rgba(255,255,255,0.6); padding: 1px 4px; border-radius: 3px; margin-left: 5px; flex-shrink: 0; }

        .ev-pub { background: var(--color-pub); border-left-color: #a3b8ac; }
        .ev-cover { background: var(--color-cover); border-left-color: #ffbba1; }
        .ev-proof1 { background: var(--color-proof); border-left-color: #ff9db3; }
        .ev-proof2 { background: #ffe3fa; border-left-color: #d991ce; }
        .ev-task { background: var(--color-task); border-left-color: #e08996; }
        .ev-email { background: var(--color-email); border-left-color: #9ba0fc; }
        .ev-meeting { background: var(--color-meeting); border-left-color: #e6c565; }

        /* 테이블 */
        .liv-table { width: 100%; min-width: 1050px; border-collapse: collapse; }
        .liv-table th { text-align: left; padding: 10px; font-size: 0.8rem; color: #888; border-bottom: 2px solid #eee; }
        .liv-table td { padding: 12px 10px; border-bottom: 1px solid #eee; vertical-align: middle; font-size: 0.85rem; position: relative; }
        .cover-thumb { width: 75px; height: 105px; border-radius: 4px; object-fit: cover; border: 1px solid #ddd; background: #fafafa; flex-shrink: 0; display: block; }
        .input-text, .input-select, .input-date { height: 32px !important; padding: 0 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.85rem; box-sizing: border-box; font-family: inherit; width: 100%; line-height: 30px; margin: 0; }
        .input-text:focus, .input-select:focus, .input-date:focus { border-color: var(--main-pink); outline: none; }
        .row-child { background-color: #f1f3f5 !important; }
        .child-indicator { display: inline-block; color: var(--main-pink); font-weight: bold; margin-right: 5px; padding-left: 15px; font-size: 0.8rem; }
        .btn { height: 32px !important; line-height: 32px; padding: 0 15px; border-radius: 4px; border: none; cursor: pointer; font-weight: 600; font-size: 0.8rem; white-space: nowrap; display: inline-block; box-sizing: border-box; transition: 0.2s; }
        .btn-black { background: var(--black); color: white; }
        .btn-pink { background: var(--main-pink); color: white; }
        .btn-del { height: 28px !important; line-height: 26px; background: #fff; color: #999; border: 1px solid #ddd; padding: 0 8px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; box-sizing: border-box; }
        .btn-del:hover { color: #e63946; border-color: #e63946; background: #fff0f0; }

        .status-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; height: 32px; }
        .status-label { font-size: 0.75rem; font-weight: bold; color: #888; width: 40px; flex-shrink: 0; }
        .platform-box { padding: 10px; background: #fffcfd; border-radius: 6px; border: 1px solid var(--main-pink); }
        .platform-box-title { font-size: 0.75rem; font-weight: bold; color: var(--main-pink); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .platform-grid { display: flex; flex-wrap: wrap; gap: 6px; }
        .platform-grid label { font-size: 0.7rem; display: flex; align-items: center; gap: 2px; cursor: pointer; color: #222; }

        .date-grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; width: 100%; min-width: 220px; }
        .date-grid-item { display: flex; align-items: center; gap: 5px; }
        .date-grid-label { font-size: 0.75rem; color: #666; width: 25px; font-weight: bold; flex-shrink: 0; text-align: right; }

        /* 메모장 */
        .memo-board { display: flex; flex-wrap: wrap; gap: 15px; }
        .memo-postit { width: 440px; min-height: 440px; padding: 25px; border-radius: 4px; box-shadow: 2px 4px 8px rgba(0,0,0,0.05); position: relative; display: flex; flex-direction: column; background-color:#fff3b0; }
        .memo-postit textarea { flex-grow: 1; border: none; background: transparent; resize: none; font-family: 'Pretendard'; font-size: 1.1rem; line-height: 1.5; color: #333; outline: none; }
        .memo-date { font-size: 0.8rem; color: rgba(0,0,0,0.4); text-align: right; margin-top: 10px; font-weight: bold; }
        .memo-del { position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 0.9rem; font-weight: bold; color: rgba(0,0,0,0.3); transition: 0.2s; }
        .memo-del:hover { color: #e63946; }
        .memo-add-btn { width: 440px; height: 440px; border: 2px dashed #ccc; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; font-size: 1.2rem; color: #888; transition: 0.2s; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 3000; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: #fff; padding: 25px; border-radius: 10px; width: 320px; max-height: 80vh; overflow-y: auto; }
        
        .mobile-only { display: none !important; }
        .mobile-del-btn { display: none; }
        .desktop-only-td { display: table-cell; }

        /* ==========================================
           📱 모바일 전용 반응형
           ========================================== */
        @media (max-width: 1200px), (orientation: portrait) {
            .sidebar { position: fixed; left: -240px; height: 100vh; height: 100dvh; box-shadow: 5px 0 15px rgba(0,0,0,0.2); }
            .sidebar.mobile-open { left: 0 !important; }
            .sidebar-hover-zone { display: block; position: fixed; left: 0; top: 0; bottom: 0; width: 15px; z-index: 1001; }
            .sidebar-hover-zone::after { content: '▶'; position: absolute; top: 50%; background: var(--main-pink); color: white; padding: 10px 2px; font-size: 10px; border-radius: 0 4px 4px 0; }
            .main-container { padding: 15px 15px 15px 35px; width: 100%; box-sizing: border-box; }
            
            /* 데스크 압축 */
            .dash-grid-3 { grid-template-columns: 1fr; }
            .schedule-adder { flex-wrap: wrap; height: auto; }
            .adder-label { flex: 1 1 100%; margin-bottom: 4px; display: block; }
            .schedule-adder .input-date { flex: 1 1 calc(33% - 8px); width: auto; }
            .schedule-adder .input-select { flex: 1 1 calc(33% - 8px); width: auto; }
            .adder-bottom-row { flex: 1 1 100%; width: 100%; margin-top: 4px; display: flex; gap: 8px; }
            
            /* 주간 캘린더 모바일 2x4 */
            .week-grid { grid-template-columns: 1fr 1fr !important; grid-template-rows: repeat(4, 1fr) !important; gap: 5px !important; }
            .week-day-box { padding: 6px !important; overflow: hidden !important; }
            .week-day-header { font-size: 0.75rem !important; margin-bottom: 5px !important; padding-bottom: 3px !important; }
            .week-evt-item { height: 18px; padding: 1px 3px !important; margin-bottom: 2px !important; }
            .week-evt-title { font-size: 0.65rem !important; }
            .week-evt-writer { font-size: 0.55rem !important; padding: 0 2px !important; }
            
            /* 월간 달력 압축 */
            .main-container.view-calendar .day-box { padding: 2px !important; overflow: hidden !important; }
            .main-container.view-calendar .event-item { height: 14px; padding: 1px 2px; margin-bottom: 1px; border-left-width: 2px; }
            .main-container.view-calendar .evt-title { display: none !important; }
            .main-container.view-calendar .evt-writer { font-size: 0.55rem !important; margin: 0; padding: 0; }

            /* 캘린더 상단 헤더 가독성 */
            .cal-header-wrap { flex-direction: column !important; align-items: center !important; gap: 12px !important; }
            .cal-nav { gap: 10px !important; }
            .cal-nav span { white-space: nowrap !important; }
            .filter-group { flex-wrap: nowrap !important; width: 100%; justify-content: center !important; overflow-x: auto; padding-bottom: 4px; }
            .filter-btn { white-space: nowrap !important; flex-shrink: 0; }

            /* 입력칸 우측 잘림 방지 */
            .status-row { width: 100% !important; box-sizing: border-box !important; }
            .status-row .input-select { flex: 1 !important; min-width: 0 !important; width: 0 !important; }
            .date-grid-item { min-width: 0 !important; width: 100% !important; }
            .date-grid-item .input-date { flex: 1 !important; min-width: 0 !important; width: 0 !important; padding: 0 4px !important; }

            /* 모바일 테이블 */
            .desktop-only-td, .liv-table td.desktop-only-td { display: none !important; }
            .mobile-only { display: flex !important; }
            
            .mobile-del-btn { display: block !important; position: absolute !important; top: 15px !important; right: 15px !important; z-index: 10; }
            
            .liv-table thead { display: none !important; }
            .table-wrap { overflow-x: hidden; }
            .liv-table { display: block; width: 100% !important; min-width: 0 !important; }
            .liv-table tbody, .liv-table tr { display: block; width: 100%; }
            .liv-table th { display: none; } 
            
            .liv-table tr { margin-bottom: 20px; border: 1px solid #ddd; border-radius: 10px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.02); padding: 15px; position: relative; display: flex; flex-direction: column; gap: 15px; }
            .liv-table td { display: block; width: 100%; padding: 0; border: none; position: static; }
            .row-child { border-left: 4px solid var(--main-pink); margin-left: 0; border-radius: 0 10px 10px 0; }
            
            .mobile-title-wrap { padding-right: 50px; } 
            
            .date-grid-2x2 { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 8px !important; width: 100% !important; box-sizing: border-box !important; }
        }

        #firebase-loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fafbfc; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .loading-spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--main-pink); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="firebase-loading"><div class="loading-spinner"></div><h2 style="color:var(--main-pink); margin:0;">데이터 동기화 중...</h2></div>

    <div class="sidebar-hover-zone" onclick="openMobileSidebar()"></div>
    <aside class="sidebar" id="main-sidebar">
        <div class="logo-area"><h1 class="logo-title">LIV</h1><div class="logo-subtitle">publishing</div></div>
        <div class="nav-group">
            <div class="nav-item active" onclick="changeView('dashboard')">데스크</div>
            <div class="nav-item" onclick="changeView('calendar')">월간 스케줄러</div>
            <div class="nav-item" onclick="changeView('week-calendar')">주간 스케줄러</div>
            <div class="nav-item" onclick="changeView('memo')">메모</div>
            <div class="nav-label">Management</div>
            <div class="nav-item" onclick="changeView('writer'); toggleWriters();">계약 작가 관리 <span>▼</span></div>
            <div class="writer-sub-list show" id="sidebar-writer-list"></div>
            <div style="padding: 15px 25px;"><button class="btn btn-black" style="width: 100%; height: 36px; line-height: 36px;" onclick="openWriterModal()">+ 새 작가 등록</button></div>
            <div style="padding: 0 25px 15px; display:flex; flex-direction: column; gap:5px;">
                <div style="display:flex; gap:5px;">
                    <button class="btn btn-del" style="flex:1; font-size:0.7rem;" onclick="exportData()">수동 백업</button>
                    <button class="btn btn-del" style="flex:1; font-size:0.7rem;" onclick="document.getElementById('import-input').click()">수동 복원</button>
                </div>
                <button class="btn" style="background:#ffe6eb; color:#e63946; font-size:0.7rem; font-weight:bold; border: 1px solid #ffb3c1;" onclick="restoreFromAutoBackup()">🚨 긴급 복구</button>
                <input type="file" id="import-input" style="display:none;" accept=".json" onchange="importData(event)">
            </div>
        </div>
    </aside>

    <main class="main-container" id="main-view" onclick="closeSidebarMobile()"></main>

    <div class="modal-overlay" id="writer-modal">
        <div class="modal-content">
            <h3 style="color:var(--main-pink); margin-top:0;">새 작가 등록</h3>
            <label style="font-size:0.8rem; font-weight:bold; margin-bottom:5px; display:block;">작가명</label>
            <input type="text" id="new-writer-name" class="input-text" style="margin-bottom:10px; width:100%;">
            <label style="font-size:0.8rem; font-weight:bold; margin-bottom:5px; display:block;">교정 스타일</label>
            <select id="new-writer-proof" class="input-select" style="margin-bottom:10px; width:100%;">
                <option value="피드백과 함께 꼼꼼 교정">피드백과 함께 꼼꼼 교정</option>
                <option value="피드백과 함께 러프 교정">피드백과 함께 러프 교정</option>
                <option value="피드백 없이 꼼꼼 교정">피드백 없이 꼼꼼 교정</option>
                <option value="피드백 없이 러프 교정">피드백 없이 러프 교정</option>
            </select>
            <label style="font-size:0.8rem; font-weight:bold; margin-bottom:5px; display:block;">메일 수신 시간</label>
            <select id="new-writer-email" class="input-select" style="margin-bottom:10px; width:100%;">
                <option value="상시 연락">상시 연락</option>
                <option value="평일 주간만">평일 주간만</option>
            </select>
            <div style="display:flex; gap:10px; margin-top:10px;"><button class="btn btn-del" style="flex:1; height: 36px!important;" onclick="closeWriterModal()">취소</button><button class="btn btn-black" style="flex:1; height: 36px!important;" onclick="confirmAddWriter()">등록</button></div>
        </div>
    </div>

    <div class="modal-overlay" id="day-modal">
        <div class="modal-content">
            <h3 id="day-modal-title" style="margin-top:0; border-bottom:2px solid #eee; padding-bottom:10px;"></h3>
            <div id="day-modal-list" style="display:flex; flex-direction:column; gap:8px;"></div>
            <button class="btn btn-black" style="width:100%; margin-top:20px;" onclick="closeDayModal()">닫기</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=' + new Date().getTime()).catch(e=>console.log(e));

        const firebaseConfig = { apiKey: "AIzaSyBipOGzVqm1vcTrgN9b6IXGtfewOgtJJb8", authDomain: "liv-management.firebaseapp.com", projectId: "liv-management", storageBucket: "liv-management.firebasestorage.app" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        let livData = { writers: [], extraTasks: [], memos: [] };
        let currentDate = new Date(), currentWeekStart = new Date(), currentCalFilter = 'all', currentWriterFilter = null, currentSearchText = '', currentViewName = 'dashboard', currentViewParam = null;

        db.collection("config").doc("mainData").onSnapshot((doc) => {
            document.getElementById('firebase-loading').style.display = 'none';
            if (doc.metadata.hasPendingWrites) return;
            if (doc.exists) {
                livData = doc.data();
                if(!livData.writers) livData.writers = []; if(!livData.extraTasks) livData.extraTasks = []; if(!livData.memos) livData.memos = [];
                
                if (livData.writers.length > 0 || livData.memos.length > 0 || livData.extraTasks.length > 0) {
                    livData.lastBackupTime = new Date().toLocaleString(); localStorage.setItem('liv_auto_backup', JSON.stringify(livData));
                }
                renderSidebarWriters(); changeView(currentViewName, currentViewParam);
            } else {
                const sv = localStorage.getItem('livDataFinal_v21'); if (sv) { livData = JSON.parse(sv); saveData(); }
            }
        });

        function saveData() {
            if (!livData || (livData.writers.length === 0 && livData.memos.length === 0 && livData.extraTasks.length === 0)) {
                if(!confirm("🚨 데이터가 비어있습니다! 보호하시려면 '취소'를 누르세요.")) return;
            } else {
                livData.lastBackupTime = new Date().toLocaleString(); localStorage.setItem('liv_auto_backup', JSON.stringify(livData));
            }
            db.collection("config").doc("mainData").set(livData); renderSidebarWriters();
        }

        function restoreFromAutoBackup() {
            const bk = localStorage.getItem('liv_auto_backup');
            if (bk && confirm("자동 백업본을 불러올까요?")) { livData = JSON.parse(bk); saveData(); changeView('dashboard'); alert('복구되었습니다.'); }
            else if(!bk) alert("백업본이 없습니다.");
        }

        const msStatuses = ['계약 완료', '원고 피드백', '원고 입고 대기', '1교 대기', '1교 중', '1교 완료', '작교 대기', '작교 완료', '2교 대기', '2교 중', '2교 완료', '최종고 완성', '이펍 제작 완료', '출간 등록 완료', '출간 대기', '출간 완료'];
        const coverStatuses = ['제안서 입고 전', '제안서 입고 완료', '제작 중', '제작 완료'];
        const platforms = ['리디', '시리즈', '예스24', '알라딘', '교보문고', '미스터블루', '봄툰', '북큐브', '구글북스', '스토린랩'];
        
        function getStatusColor(s, t) { let l = t==='ms'?msStatuses:coverStatuses; let i = l.indexOf(s); return i<=0 ? '#fff' : `hsl(345, 60%, ${98-(i/(l.length-1))*28}%)`; }
        function exportData() { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(livData)],{type:"application/json"})); a.download=`liv.json`; a.click(); }
        function importData(e) { const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=x=>{ try{ livData=JSON.parse(x.target.result); saveData(); changeView('dashboard'); }catch(err){alert('오류')} }; r.readAsText(f); }

        function openMobileSidebar() { const sb = document.getElementById('main-sidebar'); if(sb) sb.classList.add('mobile-open'); }
        function closeSidebarMobile() { const sb = document.getElementById('main-sidebar'); if(sb) sb.classList.remove('mobile-open'); }

        function changeView(v, p = null) {
            currentViewName = v; currentViewParam = p;
            document.querySelectorAll('.nav-item').forEach((el, idx) => {
                el.classList.remove('active');
                if((v==='dashboard' && idx===0) || (v==='calendar' && idx===1) || (v==='week-calendar' && idx===2) || (v==='memo' && idx===3) || (v==='writer' && idx===4)) el.classList.add('active');
            });
            const m = document.getElementById('main-view');
            m.className = 'main-container' + (v==='calendar'?' view-calendar':'') + (v==='week-calendar'?' view-week-calendar':'');
            
            if(v==='dashboard') renderDashboard(m);
            else if(v==='calendar') renderCalendar(m);
            else if(v==='week-calendar') {
                if(currentViewName !== 'week-calendar') { currentWeekStart = new Date(); currentWeekStart.setDate(currentWeekStart.getDate() - currentWeekStart.getDay()); }
                renderWeekCalendar(m);
            }
            else if(v==='memo') renderMemoBoard(m);
            else if(v==='writer') { currentWriterFilter = p; currentSearchText = ''; renderWriterDetail(m, p); }
            
            if (!(v==='writer' && p===null)) closeSidebarMobile();
        }

        function getWriterOptions() { return `<option value="">[선택 안함]</option>` + livData.writers.map(w=>`<option value="${w.id}">${w.name}</option>`).join(''); }

        function renderDashboard(container) {
            const tzoffset = (new Date()).getTimezoneOffset() * 60000;
            const today = new Date(Date.now() - tzoffset);
            const tom = new Date(today.getTime() + 86400000);
            const afterTom = new Date(today.getTime() + 86400000 * 2);

            container.innerHTML = `
                <h2>업무 데스크</h2>
                <div class="schedule-adder">
                    <span class="adder-label">+ 빠른 등록</span>
                    <input type="date" id="dash-date" class="input-date" value="${today.toISOString().split('T')[0]}">
                    <select id="dash-writer" class="input-select">${getWriterOptions()}</select>
                    <select id="dash-type" class="input-select">
                        <option value="ev-task">일반</option><option value="ev-email">메일</option><option value="ev-meeting">미팅</option>
                    </select>
                    <div class="adder-bottom-row">
                        <input type="text" id="dash-title" class="input-text" placeholder="일정 내용을 입력하세요">
                        <button class="btn btn-black" onclick="addExtraTask('dash-date', 'dash-writer', 'dash-type', 'dash-title', 'dashboard')">등록</button>
                    </div>
                </div>
                <div class="dash-grid-3">
                    <div class="card" style="padding: 15px;">
                        <h3 style="margin-top:0; font-size:1rem; border-bottom:1px solid #eee; padding-bottom:10px;">오늘 (${today.getMonth()+1}/${today.getDate()})</h3>
                        <div id="today-tasks" style="min-height: 50px;" ondragover="allowDrop(event)" ondrop="drop(event, '${today.toISOString().split('T')[0]}')"></div>
                    </div>
                    <div class="card" style="padding: 15px;">
                        <h3 style="margin-top:0; font-size:1rem; border-bottom:1px solid #eee; padding-bottom:10px;">내일 (${tom.getMonth()+1}/${tom.getDate()})</h3>
                        <div id="tom-tasks" style="min-height: 50px;" ondragover="allowDrop(event)" ondrop="drop(event, '${tom.toISOString().split('T')[0]}')"></div>
                    </div>
                    <div class="card" style="padding: 15px;">
                        <h3 style="margin-top:0; font-size:1rem; border-bottom:1px solid #eee; padding-bottom:10px;">모레 (${afterTom.getMonth()+1}/${afterTom.getDate()})</h3>
                        <div id="after-tasks" style="min-height: 50px;" ondragover="allowDrop(event)" ondrop="drop(event, '${afterTom.toISOString().split('T')[0]}')"></div>
                    </div>
                </div>
            `;
            updateTasksHtml(today.toISOString().split('T')[0], 'today-tasks', 'dashboard', 'all'); 
            updateTasksHtml(tom.toISOString().split('T')[0], 'tom-tasks', 'dashboard', 'all'); 
            updateTasksHtml(afterTom.toISOString().split('T')[0], 'after-tasks', 'dashboard', 'all');
        }

        function addExtraTask(dateId, writerSelId, typeId, titleId, view) {
            const date = document.getElementById(dateId).value; 
            const wId = document.getElementById(writerSelId).value; 
            const type = document.getElementById(typeId).value; 
            const title = document.getElementById(titleId).value;
            if(!title || !date) return; 
            if(!livData.extraTasks) livData.extraTasks = []; 
            livData.extraTasks.push({ id: Date.now(), date, writerId: wId, type, title }); 
            saveData(); changeView(view);
        }

        function completeWorkTask(wId, wkId, key, view) {
            if(!confirm('해당 일정을 달력에서 지우시겠습니까?')) return; 
            const work = livData.writers.find(x => x.id === wId).works.find(x => x.id === wkId);
            if (!work.completedDates) work.completedDates = {}; 
            work.completedDates[key] = true; 
            saveData(); changeView(view);
        }

        function completeExtraTask(taskId, view) {
            if(!confirm('해당 일반 일정을 완료하시겠습니까?')) return; 
            livData.extraTasks = livData.extraTasks.filter(t => t.id !== taskId); 
            saveData(); changeView(view);
        }

        function drag(ev, type, wId, itemId) { ev.dataTransfer.setData("type", type); ev.dataTransfer.setData("wId", wId); ev.dataTransfer.setData("itemId", itemId); }
        function allowDrop(ev) { ev.preventDefault(); }
        function drop(ev, newDate) {
            ev.preventDefault(); 
            const type = ev.dataTransfer.getData("type"); const wId = ev.dataTransfer.getData("wId"); const itemId = ev.dataTransfer.getData("itemId"); 
            if (!type) return;
            if (type === 'extraTask') { 
                const task = livData.extraTasks.find(t => t.id == itemId); if (task) task.date = newDate; 
            } else { 
                const writer = livData.writers.find(w => w.id == wId); 
                if (writer) { const work = writer.works.find(w => w.id == itemId); if (work) work[type] = newDate; } 
            }
            saveData(); renderCalendar(document.getElementById('main-view'));
        }

        function renderCalendar(c) {
            const y=currentDate.getFullYear(), m=currentDate.getMonth(), td=new Date().toISOString().split('T')[0];
            const fd=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate(), wks=Math.ceil((fd+dim)/7);
            
            let h = `<div class="cal-wrapper">
                <div class="card" style="padding:15px 20px; margin-bottom:10px;">
                    <div class="cal-header-wrap">
                        <div class="cal-nav">
                            <button class="cal-btn" onclick="currentDate.setMonth(currentDate.getMonth()-1);renderCalendar(document.getElementById('main-view'))">◀</button>
                            <span>${y}년 ${m+1}월</span>
                            <button class="cal-btn" onclick="currentDate.setMonth(currentDate.getMonth()+1);renderCalendar(document.getElementById('main-view'))">▶</button>
                        </div>
                        <div class="filter-group">
                            <button class="filter-btn ${currentCalFilter==='all'?'active':''}" onclick="currentCalFilter='all';renderCalendar(document.getElementById('main-view'))">전체</button>
                            <button class="filter-btn ${currentCalFilter==='pub'?'active':''}" onclick="currentCalFilter='pub';renderCalendar(document.getElementById('main-view'))">출간</button>
                            <button class="filter-btn ${currentCalFilter==='cover'?'active':''}" onclick="currentCalFilter='cover';renderCalendar(document.getElementById('main-view'))">표지</button>
                            <button class="filter-btn ${currentCalFilter==='proof'?'active':''}" onclick="currentCalFilter='proof';renderCalendar(document.getElementById('main-view'))">교정</button>
                        </div>
                    </div>
                </div>
                <div class="calendar-grid" style="grid-template-rows: auto repeat(${wks}, 1fr);">
                    ${['일','월','화','수','목','금','토'].map(d=>`<div class="day-header">${d}</div>`).join('')}`;
            
            for(let i=0; i<fd; i++) h += `<div></div>`;
            for(let i=1; i<=dim; i++) {
                let ds = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                h += `<div class="day-box ${ds===td?'today':''}" ondragover="allowDrop(event)" ondrop="drop(event, '${ds}')" onclick="openDayModal(event, '${ds}')"><div class="day-num">${i}</div><div id="cal-day-${ds}" style="display:flex; flex-direction:column; gap:2px; min-height: 10px;"></div></div>`;
            }
            c.innerHTML = h + `</div></div>`;
            for(let i=1; i<=dim; i++) updateTasksHtml(`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`, `cal-day-${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`, 'calendar', currentCalFilter);
        }

        function renderWeekCalendar(c) {
            let start = new Date(currentWeekStart); start.setDate(start.getDate() - start.getDay());
            let days = []; for(let i=0; i<7; i++) { days.push(new Date(start)); start.setDate(start.getDate()+1); }
            const dn = ['일','월','화','수','목','금','토'], td = new Date().toISOString().split('T')[0];
            
            let h = `<div class="week-cal-wrapper"><div class="week-grid">`;
            for(let i=0; i<7; i++) {
                let ds = days[i].toISOString().split('T')[0];
                h += `<div class="week-day-box ${ds===td?'today':''}" onclick="openDayModal(event, '${ds}')"><div class="week-day-header">${days[i].getMonth()+1}/${days[i].getDate()} (${dn[i]})</div><div id="week-day-${ds}"></div></div>`;
            }
            
            h += `<div class="week-nav-box">
                    <div class="mini-cal-header">
                        <span onclick="currentWeekStart.setDate(currentWeekStart.getDate()-7);renderWeekCalendar(document.getElementById('main-view'))" style="cursor:pointer;">◀</span>
                        <span>${days[0].getFullYear()}.${days[0].getMonth()+1}</span>
                        <span onclick="currentWeekStart.setDate(currentWeekStart.getDate()+7);renderWeekCalendar(document.getElementById('main-view'))" style="cursor:pointer;">▶</span>
                    </div>
                    <div class="mini-cal-grid">`;
            let my=days[0].getFullYear(), mm=days[0].getMonth(), mfd=new Date(my,mm,1).getDay(), mdim=new Date(my,mm+1,0).getDate();
            for(let i=0; i<mfd; i++) h += `<div></div>`;
            for(let i=1; i<=mdim; i++) {
                let isSel = false; days.forEach(d => { if(d.getMonth()===mm && d.getDate()===i) isSel=true; });
                h += `<div class="mini-day ${isSel?'active':''}">${i}</div>`;
            }
            h += `</div><div style="font-size:0.6rem; text-align:center; margin-top:5px; color:#ff85a2; font-weight:bold;">WEEKLY NAV</div></div></div></div>`;
            c.innerHTML = h;
            days.forEach(d => updateWeekTasksHtml(d.toISOString().split('T')[0], `week-day-${d.toISOString().split('T')[0]}`));
        }

        function updateTasksHtml(dateStr, containerId, view, filter) {
            const el = document.getElementById(containerId); if(!el) return; let html = '';
            livData.writers.forEach(w => (w.works||[]).forEach(work => {
                const wTag = `<span class="evt-writer">${w.name}</span>`;
                if((filter === 'all' || filter === 'pub') && work.pubDate === dateStr && !(work.completedDates && work.completedDates.pubDate)) html += `<div class="event-item ev-pub" draggable="true" ondragstart="drag(event, 'pubDate', ${w.id}, ${work.id})" ondblclick="completeWorkTask(${w.id}, ${work.id}, 'pubDate', '${view}')"><span class="evt-title">[출간] ${work.title}</span> ${wTag}</div>`;
                if((filter === 'all' || filter === 'cover') && work.coverDate === dateStr && !(work.completedDates && work.completedDates.coverDate)) html += `<div class="event-item ev-cover" draggable="true" ondragstart="drag(event, 'coverDate', ${w.id}, ${work.id})" ondblclick="completeWorkTask(${w.id}, ${work.id}, 'coverDate', '${view}')"><span class="evt-title">[표지] ${work.title}</span> ${wTag}</div>`;
                if((filter === 'all' || filter === 'proof') && work.proofDate === dateStr && !(work.completedDates && work.completedDates.proofDate)) html += `<div class="event-item ev-proof1" draggable="true" ondragstart="drag(event, 'proofDate', ${w.id}, ${work.id})" ondblclick="completeWorkTask(${w.id}, ${work.id}, 'proofDate', '${view}')"><span class="evt-title">[1교] ${work.title}</span> ${wTag}</div>`;
                if((filter === 'all' || filter === 'proof') && work.proofDate2 === dateStr && !(work.completedDates && work.completedDates.proofDate2)) html += `<div class="event-item ev-proof2" draggable="true" ondragstart="drag(event, 'proofDate2', ${w.id}, ${work.id})" ondblclick="completeWorkTask(${w.id}, ${work.id}, 'proofDate2', '${view}')"><span class="evt-title">[2교] ${work.title}</span> ${wTag}</div>`;
            }));
            
            if(livData.extraTasks) { 
                livData.extraTasks.forEach(t => { 
                    if((filter === 'all' || filter === 'task') && t.date === dateStr) { 
                        const writerObj = t.writerId ? livData.writers.find(x => x.id == t.writerId) : null; 
                        const wTag = writerObj ? `<span class="evt-writer">${writerObj.name}</span>` : ''; 
                        html += `<div class="event-item ${t.type}" draggable="true" ondragstart="drag(event, 'extraTask', null, ${t.id})" ondblclick="completeExtraTask(${t.id}, '${view}')"><span class="evt-title">${t.title}</span> ${wTag}</div>`; 
                    } 
                }); 
            }
            el.innerHTML = html;
        }

        function updateWeekTasksHtml(ds, cid) {
            const el = document.getElementById(cid); if(!el) return; let h='';
            livData.writers.forEach(w => (w.works||[]).forEach(wk => {
                const wt = `<span class="week-evt-writer">${w.name}</span>`;
                if(wk.pubDate===ds && !(wk.completedDates||{}).pubDate) h+=`<div class="week-evt-item ev-pub"><span class="week-evt-title">[출] ${wk.title}</span>${wt}</div>`;
                if(wk.coverDate===ds && !(wk.completedDates||{}).coverDate) h+=`<div class="week-evt-item ev-cover"><span class="week-evt-title">[표] ${wk.title}</span>${wt}</div>`;
                if(wk.proofDate===ds && !(wk.completedDates||{}).proofDate) h+=`<div class="week-evt-item ev-proof1"><span class="week-evt-title">[1교] ${wk.title}</span>${wt}</div>`;
                if(wk.proofDate2===ds && !(wk.completedDates||{}).proofDate2) h+=`<div class="week-evt-item ev-proof2"><span class="week-evt-title">[2교] ${wk.title}</span>${wt}</div>`;
            }));
            if(livData.extraTasks) livData.extraTasks.forEach(t=>{ if(t.date===ds){ const wo=t.writerId?livData.writers.find(x=>x.id==t.writerId):null; h+=`<div class="week-evt-item ${t.type}"><span class="week-evt-title">${t.title}</span> ${wo?`<span class="week-evt-writer">${wo.name}</span>`:''}</div>`; } });
            el.innerHTML = h;
        }

        function openDayModal(e, ds) {
            if(e.target.closest('.event-item') || e.target.closest('.week-evt-item')) return;
            document.getElementById('day-modal-title').innerText = ds;
            let h = '';
            livData.writers.forEach(w => (w.works||[]).forEach(wk => {
                if(wk.pubDate===ds) h+=`<div class="event-item ev-pub" style="padding:10px;"><b>[출간]</b> ${wk.title} <span class="evt-writer">${w.name}</span></div>`;
                if(wk.coverDate===ds) h+=`<div class="event-item ev-cover" style="padding:10px;"><b>[표지]</b> ${wk.title} <span class="evt-writer">${w.name}</span></div>`;
                if(wk.proofDate===ds) h+=`<div class="event-item ev-proof1" style="padding:10px;"><b>[1교]</b> ${wk.title} <span class="evt-writer">${w.name}</span></div>`;
                if(wk.proofDate2===ds) h+=`<div class="event-item ev-proof2" style="padding:10px;"><b>[2교]</b> ${wk.title} <span class="evt-writer">${w.name}</span></div>`;
            }));
            if(livData.extraTasks) livData.extraTasks.forEach(t=>{ if(t.date===ds){ const wo=t.writerId?livData.writers.find(x=>x.id==t.writerId):null; h+=`<div class="event-item ${t.type}" style="padding:10px;"><b>[일반]</b> ${t.title} ${wo?`<span class="evt-writer">${wo.name}</span>`:''}</div>`; }});
            document.getElementById('day-modal-list').innerHTML = h || '<div style="color:#999; text-align:center; padding:40px 0;">일정이 없습니다.</div>';
            document.getElementById('day-modal').classList.add('show');
        }
        function closeDayModal() { document.getElementById('day-modal').classList.remove('show'); }

        function renderMemoBoard(c) {
            let h=`<h2>메모</h2><div class="memo-board"><div class="memo-add-btn" onclick="addMemo()">+ 메모 추가</div>`;
            livData.memos.forEach(m=>{ h+=`<div class="memo-postit" style="background-color:${m.color};"><span class="memo-del" onclick="deleteMemo(${m.id})">삭제</span><textarea onchange="updateMemo(${m.id}, this.value)" placeholder="내용을 입력하세요">${m.text}</textarea><div class="memo-date">${m.date}</div></div>`; });
            c.innerHTML = h + `</div>`;
        }
        function addMemo() { const cl=['#fff3b0','#cff0ff','#e2f4c9','#ffdcf4']; livData.memos.push({id:Date.now(), text:'', color:cl[Math.floor(Math.random()*cl.length)], date:new Date(Date.now()-(new Date()).getTimezoneOffset()*60000).toISOString().split('T')[0]}); saveData(); changeView('memo'); }
        function updateMemo(i, t) { livData.memos.find(m=>m.id===i).text=t; saveData(); }
        function deleteMemo(i) { if(confirm("삭제할까요?")){ livData.memos=livData.memos.filter(m=>m.id!==i); saveData(); changeView('memo'); } }

        function executeTextSearch() { currentSearchText = document.getElementById('search-writer-input').value.toLowerCase(); currentWriterFilter = null; renderWriterDetail(document.getElementById('main-view'), null); }
        function filterByChip(w) { currentWriterFilter = w; currentSearchText = ''; renderWriterDetail(document.getElementById('main-view'), w); }

        function renderWriterDetail(c, wId=null) {
            let ch=`<button class="btn ${currentWriterFilter===null?'btn-black':'btn-del'}" style="height:32px!important;" onclick="filterByChip(null)">전체 보기</button>`;
            livData.writers.forEach(w=>{ ch+=`<button class="btn ${currentWriterFilter===w.id?'btn-black':'btn-del'}" style="height:32px!important; margin-left:5px;" onclick="filterByChip(${w.id})">${w.name}</button>`; });
            c.innerHTML = `<div class="card" style="margin-bottom:20px;"><h2 style="margin-top:0; border-bottom:2px solid #eee; padding-bottom:10px;">작가 및 작품 검색</h2><div style="display:flex; flex-direction:column; gap:15px;"><div style="display:flex; gap:10px;"><input type="text" id="search-writer-input" value="${currentSearchText}" class="input-text" placeholder="검색..." onkeyup="if(event.key==='Enter') executeTextSearch()"><button class="btn btn-black" onclick="executeTextSearch()">검색</button></div><div id="writer-chips" style="display:flex; flex-wrap:wrap; gap:6px;">${ch}</div></div></div><div id="writers-container" style="display:flex; flex-direction:column; gap:20px;"></div>`;
            renderFilteredWriters();
        }

        function renderFilteredWriters() {
            let lst = JSON.parse(JSON.stringify(livData.writers));
            if(currentWriterFilter) lst=lst.filter(w=>w.id===currentWriterFilter);
            if(currentSearchText) lst=lst.map(w=>{ if(w.name.toLowerCase().includes(currentSearchText))return w; const m=w.works.filter(wk=>wk.title.toLowerCase().includes(currentSearchText)); if(m.length>0){ w.works=m; return w; } return null; }).filter(Boolean);
            const c=document.getElementById('writers-container'); if(lst.length===0) return c.innerHTML=`<div class="card" style="text-align:center; padding:40px; color:#888;">결과가 없습니다.</div>`;
            let h=''; 
            lst.forEach(w=>{ 
                const pStyle = w.proofStyle || "정보 없음"; const eTime = w.emailTime || "정보 없음";
                h+=`<div style="display:flex; flex-direction:column; gap:10px;"><div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; padding:20px; margin-bottom:0; background:var(--soft-pink); border:2px solid var(--main-pink);"><div><h2 style="margin:0; margin-bottom:8px;">${w.name}</h2><div style="font-size:0.85rem; font-weight:bold; color:var(--main-pink);"><span>${pStyle}</span><span style="margin-left:12px;">${eTime}</span></div></div><div style="display:flex; gap:8px;"><button class="btn btn-black" onclick="addWork(${w.id})">+ 새 작품 추가</button><button class="btn-del" style="height:32px; line-height:30px;" onclick="deleteWriter(${w.id})">계정 삭제</button></div></div><div class="card" style="padding:0; border:none; box-shadow:none; background:transparent; margin-bottom:0;"><div class="table-wrap"><table class="liv-table"><thead><tr><th style="width:32%;">표지 / 작품명</th><th class="desktop-only-td" style="width:8%;">인세</th><th class="desktop-only-td" style="width:10%;">후속권</th><th style="width:20%;">상태</th><th style="width:25%;">일정</th><th class="desktop-only-td" style="width:5%; text-align:center;">관리</th></tr></thead><tbody>${generateWorkRows(w)}</tbody></table></div></div></div>`; 
            });
            c.innerHTML = h;
        }

        function generateWorkRows(w) {
            if(!w.works||w.works.length===0) return `<tr><td colspan="6" style="text-align:center; padding:30px; color:#999; border:none;">등록된 작품이 없습니다.</td></tr>`;
            let h=''; w.works.filter(x=>!x.parentId).forEach(p=>{ h+=getRowHtml(w.id,p,false); w.works.filter(c=>c.parentId===p.id).forEach(c=>{ h+=getRowHtml(w.id,c,true); }); }); return h;
        }

        const msStatuses2 = ['계약 완료', '원고 피드백', '원고 입고 대기', '1교 대기', '1교 중', '1교 완료', '작교 대기', '작교 완료', '2교 대기', '2교 중', '2교 완료', '최종고 완성', '이펍 제작 완료', '출간 등록 완료', '출간 대기', '출간 완료'];
        const coverStatuses2 = ['제안서 입고 전', '제안서 입고 완료', '제작 중', '제작 완료'];

        function getRowHtml(wId, w, isC) {
            let rc=isC?'row-child':'', px=isC?`<span class="child-indicator">└</span>`:'', bT=w.title.replace(/\s*\d+권$/,'').replace(/'/g,"\\'");
            let msB=getStatusColor(w.msStatus,'ms'), cvB=getStatusColor(w.coverStatus,'cover');
            let sH=w.msStatus==='출간 완료'?`<div class="platform-box" style="margin-top:0; padding:10px;"><div class="platform-box-title" style="margin-bottom:8px;"><span>론칭 플랫폼</span><button class="btn-del" style="height:22px; line-height:20px; font-size:0.7rem;" onclick="revertStatus(${wId}, ${w.id})">상태 변경</button></div><div class="platform-grid">${platforms.map(p=>`<label><input type="checkbox" ${w.platforms&&w.platforms.includes(p)?'checked':''} onchange="togglePlatform(${wId}, ${w.id}, '${p}')"> ${p}</label>`).join('')}</div></div>`:`<div class="status-row"><span class="status-label">작업</span><select class="input-select" style="background-color:${msB}; font-weight:bold;" onchange="updateWork(${wId}, ${w.id}, 'msStatus', this.value)"><option value="" disabled selected>선택</option>${msStatuses2.map(s=>`<option ${w.msStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="status-row"><span class="status-label">표지</span><select class="input-select" style="background-color:${cvB}; font-weight:bold;" onchange="updateWork(${wId}, ${w.id}, 'coverStatus', this.value)"><option value="" disabled selected>선택</option>${coverStatuses2.map(s=>`<option ${w.coverStatus===s?'selected':''}>${s}</option>`).join('')}</select></div>`;
            let sqH=!isC?`<select class="input-select" style="padding:0 6px; width:45px; height:28px!important;" onchange="updateWork(${wId}, ${w.id}, 'sequel', this.value)"><option value="N" ${w.sequel==='N'?'selected':''}>N</option><option value="Y" ${w.sequel==='Y'?'selected':''}>Y</option></select>${w.sequel==='Y'?`<button class="btn" style="background:#ddd; color:#333; height:28px!important; line-height:28px; padding:0 6px; font-size:0.7rem;" onclick="addSequel(${wId}, ${w.id}, '${bT}')">생성</button>`:''}`:`<span style="color:#aaa; font-size:0.7rem;">종속</span>`;
            
            return `<tr class="${rc}">
                <td>
                    <div class="mobile-del-btn"><button class="btn-del" onclick="deleteWork(${wId}, ${w.id})">삭제</button></div>
                    <div style="display:flex; gap:12px; align-items:flex-start;">
                        <label style="cursor:pointer; flex-shrink:0;" title="표지 등록"><img src="${w.coverImg||'https://via.placeholder.com/75x105?text=Cover'}" class="cover-thumb" id="thumb-${w.id}"><input type="file" style="display:none;" accept="image/*" onchange="uploadWorkCover(this, ${wId}, ${w.id})"></label>
                        <div class="mobile-title-wrap" style="display:flex; flex-direction:column; gap:6px; flex-grow:1;">
                            <div style="display:flex; align-items:center; gap:5px;">${px}<span style="font-weight: 800; font-size: 0.95rem; color: #222; word-break: keep-all; padding-top:4px;">${w.title}</span></div>
                            <div class="mobile-only" style="flex-wrap:wrap; align-items:center; gap:6px; background:rgba(0,0,0,0.03); padding:5px 8px; border-radius:4px; border:1px solid #eaeaea;">
                                <span style="font-size:0.75rem; font-weight:bold; color:#666;">인세:</span><input type="number" class="input-text" style="width:55px; height:28px!important;" value="${w.royalty}" onchange="updateWork(${wId}, ${w.id}, 'royalty', this.value)">%
                                <span style="font-size:0.75rem; font-weight:bold; color:#666; margin-left:5px;">후속:</span>${sqH}
                            </div>
                        </div>
                    </div>
                </td>
                <td class="desktop-only-td"><input type="number" class="input-text" value="${w.royalty}" onchange="updateWork(${wId}, ${w.id}, 'royalty', this.value)"></td>
                <td class="desktop-only-td"><div style="display:flex; align-items:center; gap:5px;">${sqH}</div></td>
                <td>${sH}</td>
                <td>
                    <div class="date-grid-2x2">
                        <div class="date-grid-item"><span class="date-grid-label">출간</span><input type="date" class="input-date" value="${w.pubDate||''}" onchange="updateWork(${wId}, ${w.id}, 'pubDate', this.value)"></div>
                        <div class="date-grid-item"><span class="date-grid-label">1교</span><input type="date" class="input-date" value="${w.proofDate||''}" onchange="updateWork(${wId}, ${w.id}, 'proofDate', this.value)"></div>
                        <div class="date-grid-item"><span class="date-grid-label">표지</span><input type="date" class="input-date" value="${w.coverDate||''}" onchange="updateWork(${wId}, ${w.id}, 'coverDate', this.value)"></div>
                        <div class="date-grid-item"><span class="date-grid-label">2교</span><input type="date" class="input-date" value="${w.proofDate2||''}" onchange="updateWork(${wId}, ${w.id}, 'proofDate2', this.value)"></div>
                    </div>
                </td>
                <td class="desktop-only-td" style="text-align:center;"><button class="btn-del" onclick="deleteWork(${wId}, ${w.id})">삭제</button></td>
            </tr>`;
        }

        function uploadWorkCover(inp, wId, wkId) { if(inp.files&&inp.files[0]){ const r=new FileReader(); r.onload=e=>{ const img=new Image(); img.onload=()=>{ const cv=document.createElement('canvas'); const ct=cv.getContext('2d'); cv.width=120; cv.height=img.height*(120/img.width); ct.drawImage(img,0,0,cv.width,cv.height); const b64=cv.toDataURL('image/jpeg',0.7); document.getElementById(`thumb-${wkId}`).src=b64; updateWork(wId, wkId, 'coverImg', b64); }; img.src=e.target.result; }; r.readAsDataURL(inp.files[0]); } }
        function addWork(wId) { const t=prompt("제목:"); if(!t)return; livData.writers.find(x=>x.id===wId).works.push({id:Date.now(), title:t, royalty:70, sequel:'N', msStatus:'계약 완료', coverStatus:'제안서 입고 전', pubDate:'', coverDate:'', proofDate:'', proofDate2:'', coverImg:'', platforms:[]}); saveData(); changeView('writer', currentWriterFilter); }
        function deleteWork(wId, wkId) { if(!confirm('삭제할까요?'))return; const w=livData.writers.find(x=>x.id===wId); w.works=w.works.filter(x=>x.id!==wkId&&x.parentId!==wkId); saveData(); changeView('writer', currentWriterFilter); }
        function deleteWriter(wId) { if(!confirm('계정을 삭제할까요?'))return; livData.writers=livData.writers.filter(w=>w.id!==wId); saveData(); changeView('dashboard'); }
        function updateWork(wId, workId, key, val) { const w = livData.writers.find(x => x.id === wId); const work = w.works.find(x => x.id === workId); work[key] = val; saveData(); if (['msStatus', 'coverStatus', 'sequel'].includes(key)) { changeView('writer', currentWriterFilter); } }
        function togglePlatform(wId, workId, p) { const wk=livData.writers.find(x=>x.id===wId).works.find(x=>x.id===workId); if(!wk.platforms)wk.platforms=[]; if(wk.platforms.includes(p))wk.platforms=wk.platforms.filter(x=>x!==p); else wk.platforms.push(p); saveData(); }
        function revertStatus(wId, workId) { updateWork(wId, workId, 'msStatus', '출간 대기'); }
        function openWriterModal() { document.getElementById('writer-modal').classList.add('show'); closeSidebarMobile(); }
        function closeWriterModal() { document.getElementById('writer-modal').classList.remove('show'); document.getElementById('new-writer-name').value = ''; }
        function confirmAddWriter() { const n = document.getElementById('new-writer-name').value; const p = document.getElementById('new-writer-proof').value; const e = document.getElementById('new-writer-email').value; if(!n) return alert("작가명을 입력하세요."); livData.writers.push({ id: Date.now(), name: n, proofStyle: p, emailTime: e, works: [] }); saveData(); closeWriterModal(); changeView('writer', livData.writers[livData.writers.length-1].id); }
        function toggleWriters() { document.getElementById('sidebar-writer-list').classList.toggle('show'); }
        function renderSidebarWriters() { document.getElementById('sidebar-writer-list').innerHTML = livData.writers.map(w => `<div class="writer-sub-item" onclick="changeView('writer', ${w.id})">${w.name}</div>`).join(''); }
        
        /* ★ 부활한 후속권 생성 기능 ★ */
        function addSequel(wId, pId, bt) { 
            const w=livData.writers.find(x=>x.id===wId); 
            const nx=w.works.filter(x=>x.parentId===pId).length+2; 
            w.works.push({id:Date.now(), title:`${bt} ${nx}권`, parentId:pId, royalty:70, sequel:'N', msStatus:'계약 완료', coverStatus:'제안서 입고 전', pubDate:'', coverDate:'', proofDate:'', proofDate2:'', coverImg:'', platforms:[]}); 
            saveData(); 
            changeView('writer', currentWriterFilter); 
        }
    </script>
</body>
</html>
