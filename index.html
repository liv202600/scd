            z-index: 5 !important;
        }

        .daily-v9-left.daily-v9-mobile-collapsed .daily-v9-scroll,
        .daily-v9-left.daily-v9-mobile-collapsed .daily-v9-manual,
        .daily-v9-left.daily-v9-mobile-collapsed .daily-v9-edit {
            display: none !important;
        }

        .daily-v9-left.daily-v9-mobile-collapsed {
            padding-bottom: 12px !important;
            margin-bottom: 10px !important;
        }

        .daily-v9-left.daily-v9-mobile-collapsed .daily-v9-hint::after {
            content: " 펼치기를 누르면 목록과 직접 추가 영역이 보입니다.";
            color: #aaa;
            font-weight: 700;
        }
    }
</style>

<script>
(function () {
    const STORAGE_KEY = 'livDailyV9MonthlyCardMobileState';

    function isMobilePortraitMode() {
        try {
            return window.matchMedia('(max-width: 900px), (orientation: portrait)').matches;
        } catch (e) {
            return window.innerWidth <= 900;
        }
    }

    function getSavedOpenState() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved === 'open') return true;
            if (saved === 'closed') return false;
        } catch (e) {}

        return false;
    }

    function saveOpenState(open) {
        try {
            localStorage.setItem(STORAGE_KEY, open ? 'open' : 'closed');
        } catch (e) {}
    }

    function getCard() {
        return document.querySelector('.daily-v9-main .daily-v9-left');
    }

    function getHeader(card) {
        if (!card) return null;

        const title = Array.from(card.querySelectorAll('h3')).find(h => {
            return (h.textContent || '').trim().includes('월간 스케줄러 일정');
        });

        return title ? title.parentElement : card.firstElementChild;
    }

    function applyState(open) {
        const card = getCard();
        if (!card) return;

        const btn = card.querySelector('.daily-v9-mobile-toggle-btn');

        if (!isMobilePortraitMode()) {
            card.classList.remove('daily-v9-mobile-collapsed');

            if (btn) {
                btn.textContent = '접기 ▲';
                btn.setAttribute('aria-expanded', 'true');
            }

            return;
        }

        card.classList.toggle('daily-v9-mobile-collapsed', !open);

        if (btn) {
            btn.textContent = open ? '접기 ▲' : '펼치기 ▼';
            btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        }
    }

    function enhanceDailyMonthlyCard() {
        const card = getCard();
        if (!card) return;

        const header = getHeader(card);
        if (!header) return;

        header.classList.add('daily-v9-mobile-toggle-head');

        let btn = header.querySelector('.daily-v9-mobile-toggle-btn');

        if (!btn) {
            btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'daily-v9-mobile-toggle-btn';
            btn.setAttribute('aria-label', '월간 스케줄러 일정 접기 펼치기');

            btn.addEventListener('click', function (event) {
                event.preventDefault();
                event.stopPropagation();

                const currentlyOpen = !card.classList.contains('daily-v9-mobile-collapsed');
                const nextOpen = !currentlyOpen;

                saveOpenState(nextOpen);
                applyState(nextOpen);
            });

            header.appendChild(btn);
        }

        applyState(getSavedOpenState());
    }

    function scheduleEnhance() {
        clearTimeout(window.__dailyV9MobileToggleTimer);
        window.__dailyV9MobileToggleTimer = setTimeout(enhanceDailyMonthlyCard, 80);
    }

    function boot() {
        scheduleEnhance();

        const observer = new MutationObserver(function () {
            if (document.querySelector('.daily-v9-main .daily-v9-left')) {
                scheduleEnhance();
            }
        });

        observer.observe(document.body, {
            childList: true,
            subtree: true
        });

        window.addEventListener('resize', scheduleEnhance);
        window.addEventListener('orientationchange', function () {
            setTimeout(scheduleEnhance, 250);
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
    } else {
        boot();
    }
})();
</script>
