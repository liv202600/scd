<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIV 시스템</title>
    
    <!-- ★ 모바일 앱 설정 ★ -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LIV 시스템">
    <meta name="theme-color" content="#ff85a2">
    <link rel="manifest" href="./manifest.json">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        /* ==========================================
           공통/PC 디자인
           ========================================== */
        :root {
            --main-pink: #ff85a2; --soft-pink: #fff0f3; --black: #111111; 
            --gray-light: #f4f6f8; --white: #ffffff;
            --color-pub: #e8f0eb; --color-cover: #fff0e6; --color-proof: #ffe6eb;
            --color-task: #fdf5f6; --color-email: #eff0ff; --color-meeting: #fcf4dd;
            --color-settlement: #ff4d5f; --color-personal: #e9f7ff;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; font-family: 'Pretendard', sans-serif; background-color: var(--gray-light); color: var(--black); display: flex; }

        .sidebar { width: 240px; background: var(--black); color: var(--white); display: flex; flex-direction: column; padding: 0; z-index: 1000; flex-shrink: 0; transition: left 0.3s ease; height: 100%; }
        .logo-area { padding: 30px 20px; text-align: center; border-bottom: 1px solid #222; }
        .logo-title { font-size: 2rem; font-weight: 800; letter-spacing: 2px; margin: 0; font-family: serif; color: var(--white); }
        .logo-subtitle { font-size: 0.75rem; font-weight: 300; letter-spacing: 4px; color: var(--main-pink); margin-top: 5px; text-transform: uppercase; }
        .liv-logo-card { width: 150px; height: 82px; margin: 0 auto; background: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 10px; box-shadow: 0 2px 10px rgba(255,255,255,0.08); }
        .liv-logo-img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }

        .nav-group { padding: 15px 0; flex-grow: 1; overflow-y: auto; }
        .nav-label { padding: 15px 25px 5px; font-size: 0.75rem; color: #666; font-weight: bold; }
        .nav-item { padding: 12px 25px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 0.9rem; color: #ddd; border-left: 3px solid transparent; }
        .nav-item:hover { background: #1a1a1a; color: var(--white); }
        .nav-item.active { background: #1a1a1a; border-left: 3px solid var(--main-pink); color: var(--main-pink); font-weight: bold; }
        
        .writer-sub-list { background: #0a0a0a; display: none; }
        .writer-sub-list.show { display: block; }
        .writer-sub-item { padding: 10px 25px 10px 40px; font-size: 0.85rem; cursor: pointer; color: #888; }
        .writer-sub-item:hover { color: var(--white); background: #111; }

        .main-container { flex-grow: 1; padding: 25px; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; background: #fafbfc; min-width: 0; position: relative; }
        .card { background: var(--white); border-radius: 10px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); border: 1px solid #eaeaea; margin-bottom: 20px; }
        
        /* 업무 데스크 */
        .dash-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .schedule-adder { background: #fff; padding: 12px 15px; border-radius: 6px; border: 1px solid #eee; display: flex; gap: 8px; align-items: center; margin-bottom: 15px; flex-wrap: nowrap; width: 100%; box-sizing: border-box; }
        .adder-label { font-weight: bold; color: #555; white-space: nowrap; flex-shrink: 0; }
        .schedule-adder .input-date { width: 130px; flex-shrink: 0; }
        .schedule-adder .input-select { width: 110px; flex-shrink: 0; }
        .adder-bottom-row { display: flex; gap: 8px; flex: 1 1 auto; align-items: center; min-width: 0; } 
        .adder-bottom-row .input-text { flex: 1 1 auto; min-width: 0; width: 100%; }
        .adder-bottom-row .btn-black { flex: 0 0 60px !important; width: 60px !important; text-align: center; padding: 0; flex-shrink: 0; }

        /* 캘린더 공통 */
        .cal-wrapper, .week-cal-wrapper { display: flex; flex-direction: column; flex-grow: 1; height: 100%; }
        .cal-header-wrap { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .cal-nav { display: flex; align-items: center; gap: 15px; font-size: 1.2rem; font-weight: bold; }
        .cal-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 5px; color: #555; }
        .filter-group { display: flex; gap: 5px; }
        .filter-btn { padding: 5px 10px; border: 1px solid #ddd; background: #fff; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
        .filter-btn.active { background: var(--main-pink); border-color: var(--main-pink); color: #fff; font-weight: bold; }
        
        .calendar-grid { flex-grow: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day-header { text-align: center; font-weight: bold; padding: 4px 0; color: #888; font-size: 0.85rem; }
        .day-box { background: #fff; border: 1px solid #eee; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; overflow-y: auto; min-height: 0; cursor: pointer; }
        .day-box.today { background: var(--soft-pink); border: 1px solid var(--main-pink); }
        .day-num { font-weight: 700; margin-bottom: 5px; font-size: 0.8rem; }

        /* 주간 캘린더 (4x2) */
        .week-grid { flex-grow: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 10px; }
        .week-day-box { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; overflow-y: auto; min-height: 0; cursor: pointer; }
        .week-day-header { font-weight: 800; font-size: 1rem; margin-bottom: 10px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .week-day-box.today { border: 2px solid var(--main-pink); background: var(--soft-pink); }

        /* 미니 달력 네비게이터 */
        .week-nav-box { background: #fff; border: 2px solid var(--main-pink); border-radius: 10px; display: flex; flex-direction: column; padding: 10px; overflow: hidden; }
        .mini-cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-weight: bold; font-size: 0.85rem; color: var(--main-pink); }
        .mini-cal-header span { cursor: pointer; padding: 0 5px; }
        .mini-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; flex-grow: 1; }
        .mini-day { font-size: 0.6rem; text-align: center; color: #999; padding: 1px 0; }
        .mini-day.active { background: var(--main-pink); color: white; border-radius: 2px; }

        /* 일정 아이템 */
        .event-item, .week-evt-item { cursor: grab; font-size: 0.75rem; padding: 4px 6px; border-radius: 4px; margin-bottom: 3px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid transparent; }
        .event-item:active, .week-evt-item:active { cursor: grabbing; }
        .evt-title, .week-evt-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-grow: 1; }
        .evt-writer, .week-evt-writer { font-size: 0.75rem; font-weight: 800; color: #555; background: rgba(255,255,255,0.6); padding: 1px 4px; border-radius: 3px; margin-left: 5px; flex-shrink: 0; }

        .ev-pub { background: var(--color-pub); border-left-color: #a3b8ac; }
        .ev-cover { background: var(--color-cover); border-left-color: #ffbba1; }
        .ev-proof1 { background: var(--color-proof); border-left-color: #ff9db3; }
        .ev-proof2 { background: #ffe3fa; border-left-color: #d991ce; }
        .ev-task { background: var(--color-task); border-left-color: #e08996; }
        .ev-email { background: var(--color-email); border-left-color: #9ba0fc; }
        .ev-meeting { background: var(--color-meeting); border-left-color: #e6c565; }
        .ev-settlement { background: var(--color-settlement); border-left-color: #c9182b; color: #fff; }
        .ev-settlement .evt-writer, .ev-settlement .week-evt-writer { background: rgba(255,255,255,0.25); color:#fff; }
        .ev-personal { background: var(--color-personal); border-left-color: #8ecae6; }
        .clickable-title { cursor: pointer; }
        .clickable-title:hover { color: var(--main-pink); text-decoration: underline; }
        .date-red { color: #e63946 !important; font-weight: 800; }
        .holiday-name { color: #e63946; font-size: 0.6rem; font-weight: 700; margin-left: 3px; word-break: keep-all; }

        /* 테이블 */
        .liv-table { width: 100%; min-width: 1050px; border-collapse: collapse; }
        .liv-table th { text-align: left; padding: 10px; font-size: 0.8rem; color: #888; border-bottom: 2px solid #eee; }
        .liv-table td { padding: 12px 10px; border-bottom: 1px solid #eee; vertical-align: middle; font-size: 0.85rem; position: relative; }
        .cover-thumb { width: 75px; height: 105px; border-radius: 4px; object-fit: cover; border: 1px solid #ddd; background: #fafafa; flex-shrink: 0; display: block; }
        .input-text, .input-select, .input-date { height: 32px !important; padding: 0 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.85rem; box-sizing: border-box; font-family: inherit; width: 100%; line-height: 30px; margin: 0; }
        .input-text:focus, .input-select:focus, .input-date:focus { border-color: var(--main-pink); outline: none; }
        .row-child { background-color: #f1f3f5 !important; }
        .child-indicator { display: inline-block; color: var(--main-pink); font-weight: bold; margin-right: 5px; padding-left: 15px; font-size: 0.8rem; }
        .btn { height: 32px !important; line-height: 32px; padding: 0 15px; border-radius: 4px; border: none; cursor: pointer; font-weight: 600; font-size: 0.8rem; white-space: nowrap; display: inline-block; box-sizing: border-box; transition: 0.2s; }
        .btn-black { background: var(--black); color: white; }
        .btn-pink { background: var(--main-pink); color: white; }
        .btn-del { height: 28px !important; line-height: 26px; background: #fff; color: #999; border: 1px solid #ddd; padding: 0 8px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; box-sizing: border-box; }
        .btn-del:hover { color: #e63946; border-color: #e63946; background: #fff0f0; }

        .status-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; height: 32px; }
        .status-label { font-size: 0.75rem; font-weight: bold; color: #888; width: 40px; flex-shrink: 0; }
        .platform-box { padding: 10px; background: #fffcfd; border-radius: 6px; border: 1px solid var(--main-pink); }
        .platform-box-title { font-size: 0.75rem; font-weight: bold; color: var(--main-pink); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .platform-grid { display: flex; flex-wrap: wrap; gap: 6px; }
        .platform-grid label { font-size: 0.7rem; display: flex; align-items: center; gap: 2px; cursor: pointer; color: #222; }

        .date-grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; width: 100%; min-width: 220px; }
        .date-grid-item { display: flex; align-items: center; gap: 5px; }
        .date-grid-label { font-size: 0.75rem; color: #666; width: 25px; font-weight: bold; flex-shrink: 0; text-align: right; }

        /* 메모장 */
        .memo-board { display: flex; flex-wrap: wrap; gap: 15px; }
        .memo-postit { width: 440px; min-height: 440px; padding: 25px; border-radius: 4px; box-shadow: 2px 4px 8px rgba(0,0,0,0.05); position: relative; display: flex; flex-direction: column; background-color:#fff3b0; }
        .memo-postit textarea { flex-grow: 1; border: none; background: transparent; resize: none; font-family: 'Pretendard'; font-size: 1.1rem; line-height: 1.5; color: #333; outline: none; }
        .memo-date { font-size: 0.8rem; color: rgba(0,0,0,0.4); text-align: right; margin-top: 10px; font-weight: bold; }
        .memo-del { position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 0.9rem; font-weight: bold; color: rgba(0,0,0,0.3); transition: 0.2s; }
        .memo-del:hover { color: #e63946; }
        .memo-add-btn { width: 440px; height: 440px; border: 2px dashed #ccc; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; font-size: 1.2rem; color: #888; transition: 0.2s; }

        .webtoon-card-grid { display: flex; flex-wrap: wrap; gap: 18px; align-items: stretch; }
        .webtoon-card { width: 280px; min-height: 520px; display: flex; flex-direction: column; gap: 10px; }
        .webtoon-cover { width: 100%; height: 210px; object-fit: cover; border-radius: 8px; background: #f3f3f3; border: 1px solid #eee; display:block; }
        .webtoon-meta { font-size: 0.8rem; color: #555; line-height: 1.45; }
        .sales-summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .sales-summary-box { background:#fff; border:1px solid #eee; border-radius:10px; padding:15px; }
        .sales-summary-label { font-size:0.78rem; color:#777; font-weight:700; margin-bottom:6px; }
        .sales-summary-value { font-size:1.15rem; font-weight:900; color:var(--black); }
        .sales-chart-wrap { width:100%; overflow-x:auto; }
        #sales-chart { width:100%; min-width:640px; height:260px; background:#fff; border:1px solid #eee; border-radius:10px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 3000; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: #fff; padding: 25px; border-radius: 10px; width: 320px; max-height: 80vh; overflow-y: auto; }
        
        .mobile-only { display: none !important; }
        .mobile-del-btn { display: none; }
        .desktop-only-td { display: table-cell; }

        /* ==========================================
           📱 모바일 전용 반응형
           ========================================== */
        @media (max-width: 1200px), (orientation: portrait) {
            .sidebar { position: fixed; left: -240px; height: 100vh; height: 100dvh; box-shadow: 5px 0 15px rgba(0,0,0,0.2); }
            .sidebar.mobile-open { left: 0 !important; }
            .sidebar-hover-zone { display: block; position: fixed; left: 0; top: 0; bottom: 0; width: 15px; z-index: 1001; }
            .sidebar-hover-zone::after { content: '▶'; position: absolute; top: 50%; background: var(--main-pink); color: white; padding: 10px 2px; font-size: 10px; border-radius: 0 4px 4px 0; }
            .main-container { padding: 15px 15px 15px 35px; width: 100%; box-sizing: border-box; }
            
            /* 데스크 압축 */
            .dash-grid-3 { grid-template-columns: 1fr; }
            .schedule-adder { flex-wrap: wrap; height: auto; }
            .adder-label { flex: 1 1 100%; margin-bottom: 4px; display: block; }
            .schedule-adder .input-date { flex: 1 1 calc(33% - 8px); width: auto; }
            .schedule-adder .input-select { flex: 1 1 calc(33% - 8px); width: auto; }
            .adder-bottom-row { flex: 1 1 100%; width: 100%; margin-top: 4px; display: flex; gap: 8px; }
            
            /* 주간 캘린더 모바일 2x4 */
            .week-grid { grid-template-columns: 1fr 1fr !important; grid-template-rows: repeat(4, 1fr) !important; gap: 5px !important; }
            .week-day-box { padding: 6px !important; overflow: hidden !important; }
            .week-day-header { font-size: 0.75rem !important; margin-bottom: 5px !important; padding-bottom: 3px !important; }
            .week-evt-item { height: 18px; padding: 1px 3px !important; margin-bottom: 2px !important; }
            .week-evt-title { font-size: 0.65rem !important; }
            .week-evt-writer { font-size: 0.55rem !important; padding: 0 2px !important; }
            
            /* 월간 달력 압축 */
            .main-container.view-calendar .day-box { padding: 2px !important; overflow: hidden !important; }
            .main-container.view-calendar .event-item { height: 14px; padding: 1px 2px; margin-bottom: 1px; border-left-width: 2px; }
            .main-container.view-calendar .evt-title { display: none !important; }
            .main-container.view-calendar .evt-writer { font-size: 0.55rem !important; margin: 0; padding: 0; }

            /* 캘린더 상단 헤더 가독성 */
            .cal-header-wrap { flex-direction: column !important; align-items: center !important; gap: 12px !important; }
            .cal-nav { gap: 10px !important; }
            .cal-nav span { white-space: nowrap !important; }
            .filter-group { flex-wrap: nowrap !important; width: 100%; justify-content: center !important; overflow-x: auto; padding-bottom: 4px; }
            .filter-btn { white-space: nowrap !important; flex-shrink: 0; }

            /* 입력칸 우측 잘림 방지 */
            .status-row { width: 100% !important; box-sizing: border-box !important; }
            .status-row .input-select { flex: 1 !important; min-width: 0 !important; width: 100% !important; }
            .date-grid-item { min-width: 0 !important; width: 100% !important; }
            .date-grid-item .input-date { flex: 1 !important; min-width: 0 !important; width: 100% !important; padding: 0 4px !important; }

            /* 모바일 테이블 */
            .desktop-only-td, .liv-table td.desktop-only-td { display: none !important; }
            .mobile-only { display: flex !important; }
            
            .mobile-del-btn { display: block !important; position: absolute !important; top: 15px !important; right: 15px !important; z-index: 10; }
            
            .liv-table thead { display: none !important; }
            .table-wrap { overflow-x: hidden; }
            .liv-table { display: block; width: 100% !important; min-width: 0 !important; }
            .liv-table tbody, .liv-table tr { display: block; width: 100%; }
            .liv-table th { display: none; } 
            
            .liv-table tr { margin-bottom: 20px; border: 1px solid #ddd; border-radius: 10px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.02); padding: 15px; position: relative; display: flex; flex-direction: column; gap: 15px; }
            .liv-table td { display: block; width: 100%; padding: 0; border: none; position: static; }
            .row-child { border-left: 4px solid var(--main-pink); margin-left: 0; border-radius: 0 10px 10px 0; }
            
            .mobile-title-wrap { padding-right: 50px; } 
            
            .date-grid-2x2 { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 8px !important; width: 100% !important; box-sizing: border-box !important; }
            .webtoon-card-grid { display: flex !important; flex-direction: column !important; flex-wrap: nowrap !important; }
            .webtoon-card { width: 100% !important; min-height: auto !important; }
        }

        #firebase-loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fafbfc; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .loading-spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--main-pink); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="firebase-loading"><div class="loading-spinner"></div><h2 style="color:var(--main-pink); margin:0;">데이터 동기화 중...</h2></div>

    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=' + new Date().getTime()).catch(e=>console.log(e));

        const firebaseConfig = { apiKey: "AIzaSyBipOGzVqm1vcTrgN9b6IXGtfewOgtJJb8", authDomain: "liv-management.firebaseapp.com", projectId: "liv-management", storageBucket: "liv-management.firebasestorage.app" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();
        try { db.settings({ ignoreUndefinedProperties: true }); } catch(e) { console.warn('Firestore settings skipped:', e); }

        let livData = { writers: [], extraTasks: [], memos: [], webtoons: [], salesRecords: [] };
        let currentDate = parseDateString(getKstDateString()), currentWeekStart = parseDateString(getKstDateString()), currentCalFilter = 'all', currentWriterFilter = null, currentSearchText = '', currentViewName = 'dashboard', currentViewParam = null, currentProgressTab = 'ms';
        let extraTaskClickTimer = null;

        // 전체 데이터 삭제 사고 방지용 최소 안전장치
        // - 데이터를 복구/덮어쓰기하지 않음
        // - Firebase 저장 직전, 비어 있는 데이터가 기존 원격 데이터를 덮어쓰는 경우만 차단
        let firebaseLoadedOnce = false;
        let lastKnownNonEmptyCount = 0;

        function countImportantData(data) {
            if (!data || typeof data !== 'object') return 0;
            const writers = Array.isArray(data.writers) ? data.writers.length : 0;
            const works = Array.isArray(data.writers) ? data.writers.reduce((sum, w) => sum + (Array.isArray(w.works) ? w.works.length : 0), 0) : 0;
            const webtoons = Array.isArray(data.webtoons) ? data.webtoons.length : 0;
            const extraTasks = Array.isArray(data.extraTasks) ? data.extraTasks.length : 0;
            const memos = Array.isArray(data.memos) ? data.memos.length : 0;
            const salesRecords = Array.isArray(data.salesRecords) ? data.salesRecords.length : 0;
            return writers + works + webtoons + extraTasks + memos + salesRecords;
        }


        // 일일 자동 백업: 앱을 열거나 저장할 때, 그날의 안전한 데이터 사본을 별도 보관
        // - mainData를 덮어쓰지 않음
        // - 기존 백업보다 데이터 수가 적은 사본은 덮어쓰지 않음
        // - 실패해도 일반 저장 흐름을 막지 않음
        let dailyAutoBackupInProgress = false;
        let dailyAutoBackupLastSignature = '';

        function cloneLivDataForDailyBackup(data) {
            return JSON.parse(JSON.stringify(data || {}));
        }

        function getDailyBackupSummary(data) {
            return {
                writers: Array.isArray(data.writers) ? data.writers.length : 0,
                works: Array.isArray(data.writers) ? data.writers.reduce((sum, w) => sum + (Array.isArray(w.works) ? w.works.length : 0), 0) : 0,
                webtoons: Array.isArray(data.webtoons) ? data.webtoons.length : 0,
                extraTasks: Array.isArray(data.extraTasks) ? data.extraTasks.length : 0,
                memos: Array.isArray(data.memos) ? data.memos.length : 0,
                salesRecords: Array.isArray(data.salesRecords) ? data.salesRecords.length : 0
            };
        }

        async function runDailyAutoBackup(reason = 'auto') {
            if (!firebaseLoadedOnce || !livData || dailyAutoBackupInProgress) return;
            const dateKey = getKstDateString();
            const importantCount = countImportantData(livData);
            if (importantCount <= 0) return;

            const signature = `${dateKey}|${importantCount}|${livData.lastBackupTime || ''}`;
            if (dailyAutoBackupLastSignature === signature) return;

            dailyAutoBackupInProgress = true;
            try {
                const backupData = cloneLivDataForDailyBackup(livData);
                const summary = getDailyBackupSummary(backupData);
                const localKey = `liv_daily_backup_${dateKey}`;

                try {
                    const existingLocal = localStorage.getItem(localKey);
                    const existingLocalCount = existingLocal ? countImportantData(JSON.parse(existingLocal)) : 0;
                    if (existingLocalCount <= importantCount) {
                        localStorage.setItem(localKey, JSON.stringify(backupData));
                        localStorage.setItem('liv_daily_backup_latest_key', dateKey);
                    }
                } catch(e) {
                    console.warn('Local daily backup skipped:', e);
                }

                try {
                    const ref = db.collection('livDailyBackups').doc(dateKey);
                    const oldSnap = await ref.get();
                    const oldCount = oldSnap.exists ? countImportantData(oldSnap.data()) : 0;
                    if (oldCount > importantCount) {
                        console.warn('Daily Firebase backup kept existing larger backup:', { dateKey, oldCount, importantCount, reason });
                        dailyAutoBackupLastSignature = signature;
                        return;
                    }

                    const firebaseBackupData = cloneLivDataForDailyBackup(backupData);
                    firebaseBackupData.dailyBackupMeta = {
                        date: dateKey,
                        reason,
                        importantCount,
                        summary,
                        backedUpAtLocal: new Date().toLocaleString()
                    };
                    firebaseBackupData.dailyBackupUpdatedAt = firebase.firestore.FieldValue.serverTimestamp();
                    await ref.set(firebaseBackupData);
                    dailyAutoBackupLastSignature = signature;
                    console.log('Daily Firebase backup saved:', dateKey, summary);
                } catch(e) {
                    console.warn('Firebase daily backup skipped:', e);
                    dailyAutoBackupLastSignature = signature;
                }
            } finally {
                dailyAutoBackupInProgress = false;
            }
        }

        try {
            const backupForGuard = localStorage.getItem('liv_auto_backup');
            if (backupForGuard) lastKnownNonEmptyCount = Math.max(lastKnownNonEmptyCount, countImportantData(JSON.parse(backupForGuard)));
        } catch(e) {
            console.warn('Backup count check failed:', e);
        }

        db.collection("config").doc("mainData").onSnapshot((doc) => {
            document.getElementById('firebase-loading').style.display = 'none';
            if (doc.metadata.hasPendingWrites) return;
            firebaseLoadedOnce = true;
            if (doc.exists) {
                livData = doc.data();

                lastKnownNonEmptyCount = Math.max(lastKnownNonEmptyCount, countImportantData(livData));
                
                if (livData.writers.length > 0 || livData.memos.length > 0 || livData.extraTasks.length > 0) {
                    livData.lastBackupTime = new Date().toLocaleString(); try { localStorage.setItem('liv_auto_backup', JSON.stringify(livData)); } catch(e) { console.warn('Local auto backup failed:', e); }

                runDailyAutoBackup('snapshot');

        // Firestore 문서 용량 초과 방지: 이미지가 원격 저장 전체를 막지 않도록 저장 직전 자동 압축만 수행
        function isLivDataImage(value) {
            return typeof value === 'string' && value.indexOf('data:image/') === 0;
        }
        function livPayloadBytes(data) {
            try { return new Blob([JSON.stringify(data)]).size; }
            catch(e) { try { return JSON.stringify(data).length; } catch(err) { return 0; } }
        }
        function resizeLivDataUrl(dataUrl, maxWidth, quality) {
            return new Promise(resolve => {
                if (!isLivDataImage(dataUrl)) return resolve(dataUrl);
                const img = new Image();
                img.onload = () => {
                    try {
                        const sourceW = img.naturalWidth || img.width;
                        const sourceH = img.naturalHeight || img.height;
                        if (!sourceW || !sourceH) return resolve(dataUrl);
                        const ratio = Math.min(1, maxWidth / sourceW);
                        const targetW = Math.max(1, Math.round(sourceW * ratio));
                        const targetH = Math.max(1, Math.round(sourceH * ratio));
                        const canvas = document.createElement('canvas');
                        canvas.width = targetW;
                        canvas.height = targetH;
                        const ctx = canvas.getContext('2d');
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        ctx.drawImage(img, 0, 0, targetW, targetH);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    } catch(e) {
                        console.warn('Image resize failed:', e);
                        resolve(dataUrl);
                    }
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            });
        }
        async function resizeLivFileToDataUrl(file, maxWidth, quality) {
            const original = await new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
            return resizeLivDataUrl(original, maxWidth, quality);
        }
        async function compactEmbeddedImagesForFirestore(deep = false) {
            const coverMax = deep ? 90 : 120;
            const coverQuality = deep ? 0.62 : 0.74;
            const webtoonMax = deep ? 220 : 300;
            const webtoonQuality = deep ? 0.68 : 0.82;

            if (Array.isArray(livData.writers)) {
                for (const writer of livData.writers) {
                    if (!Array.isArray(writer.works)) continue;
                    for (const work of writer.works) {
                        if (isLivDataImage(work.coverImg) && (deep || work.coverImg.length > 18000)) {
                            work.coverImg = await resizeLivDataUrl(work.coverImg, coverMax, coverQuality);
                        }
                    }
                }
            }
            if (Array.isArray(livData.webtoons)) {
                for (const item of livData.webtoons) {
                    if (isLivDataImage(item.image) && (deep || item.image.length > 45000)) {
                        item.image = await resizeLivDataUrl(item.image, webtoonMax, webtoonQuality);
                    }
                }
            }
        }
        async function prepareLivDataForFirebaseSave() {
            await compactEmbeddedImagesForFirestore(false);
            let size = livPayloadBytes(livData);
            if (size > 850000) {
                await compactEmbeddedImagesForFirestore(true);
                size = livPayloadBytes(livData);
            }
            return size;
        }
async function saveData() {
            if (!livData) return;
            if (!Array.isArray(livData.writers)) livData.writers = [];
            if (!Array.isArray(livData.extraTasks)) livData.extraTasks = [];
            if (!Array.isArray(livData.memos)) livData.memos = [];
            if (!Array.isArray(livData.webtoons)) livData.webtoons = [];
            if (!Array.isArray(livData.salesRecords)) livData.salesRecords = [];

            const nowImportantCount = countImportantData(livData);
            const hasBusinessData = nowImportantCount > 0;

            if (!firebaseLoadedOnce) {
                console.warn('Firebase 로딩 완료 전 저장 차단');
                return;
            }

            if (lastKnownNonEmptyCount > 0 && nowImportantCount === 0) {
                console.error('Blocked dangerous empty save:', { lastKnownNonEmptyCount, livData });
                alert('데이터 전체 삭제 위험이 감지되어 저장을 차단했습니다. 기존 Firebase 데이터는 덮어쓰지 않았습니다.');
                return;
            }

            if (!hasBusinessData) {
                if(!confirm("🚨 데이터가 비어있습니다! 보호하시려면 '취소'를 누르세요.")) return;
            } else {
                lastKnownNonEmptyCount = Math.max(lastKnownNonEmptyCount, nowImportantCount);
                livData.lastBackupTime = new Date().toLocaleString();
            }

            let payloadSize = 0;
            try {
                payloadSize = await prepareLivDataForFirebaseSave();
            } catch(e) {
                console.warn('Image compaction skipped:', e);
                payloadSize = livPayloadBytes(livData);
            }

            if (payloadSize > 1000000) {
                console.error('Firestore payload is still too large:', payloadSize);
                alert('저장할 데이터 용량이 Firebase 한도에 너무 가까워 저장을 멈췄습니다. 표지/웹툰 이미지가 너무 많이 쌓인 상태라 추가 분리 작업이 필요합니다. 기존 Firebase 데이터는 덮어쓰지 않았습니다.');
                return;
            }

            if (hasBusinessData) {
                try { localStorage.setItem('liv_auto_backup', JSON.stringify(livData)); }
                catch(e) { console.warn('Local auto backup failed:', e); }
            }

            db.collection("config").doc("mainData").set(livData)
                .then(() => { lastKnownNonEmptyCount = Math.max(lastKnownNonEmptyCount, countImportantData(livData)); runDailyAutoBackup('save'); })
                .catch(err => {
                    console.error('Firebase save failed:', err);
                    const code = err && err.code ? err.code : 'unknown';
                    const message = err && err.message ? err.message : String(err || '');
                    alert(`저장에 실패했습니다.\n오류 코드: ${code}\n${message}\n\n기존 Firebase 데이터는 덮어쓰지 않았고, 가능한 경우 이 기기 자동 백업에는 보관했습니다.`);
                });
            renderSidebarWriters();
        }

            const pc = document.getElementById('published-container');
            
            let parentPublished = [];
            livData.writers.forEach(w => {
                (w.works || []).forEach(wk => {
                    if (wk.msStatus === '출간 완료') {
                        let allChecked = wk.platforms && platforms.every(p => wk.platforms.includes(p));
                        if (!wk.parentId) {
                            parentPublished.push({ writer: w, work: wk, allChecked: allChecked, pubDate: wk.pubDate || '' });

                });

            } else {
                html += `<div class="card" style="margin-bottom:20px; padding: 20px;">
                    <h3 style="margin-top:0; border-bottom: 2px solid #ffbba1; padding-bottom:10px; color:var(--black);">🎨 표지 진행 상황</h3>

            });

        function generateWorkRows(w) {
            if(!w.works||w.works.length===0) return `<tr><td colspan="6" style="text-align:center; padding:30px; color:#999; border:none;">등록된 작품이 없습니다.</td></tr>`;
            let h=''; w.works.filter(x=>!x.parentId).forEach(p=>{ h+=getRowHtml(w.id,p,false); w.works.filter(c=>c.parentId===p.id).forEach(c=>{ h+=getRowHtml(w.id,c,true); }); }); return h;
        }

        const msStatuses2 = ['계약 완료', '원고 피드백', '원고 입고 대기', '1교 대기', '1교 중', '1교 완료', '작교 대기', '작교 완료', '2교 대기', '2교 중', '2교 완료', '최종고 완성', '이펍 제작 완료', '출간 등록 완료', '출간 대기', '출간 완료'];

                <td class="desktop-only-td" style="text-align:center;"><button class="btn-del" onclick="deleteWork(${wId}, ${w.id})">삭제</button></td>
            </tr>`;
        }

        async function importSettlementPdfs(files) {
            if(!files || files.length === 0) return;
            if(!window.pdfjsLib) return alert('PDF 읽기 모듈을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            for(const file of files) {
                const text = await extractPdfText(file);
                const rec = parseSettlementPdfText(text, file.name);
                if(rec) { if(!livData.salesRecords) livData.salesRecords = []; livData.salesRecords.push(rec); }
            }
            saveData(); changeView('sales');
        }
        async function extractPdfText(file) {
            const data = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({data}).promise;
            let text = '';
            for(let i=1; i<=pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const rows = [];
                content.items.forEach(it => {
                    const y = Math.round(it.transform[5]);
                    const x = it.transform[4];
                    let row = rows.find(r => Math.abs(r.y - y) <= 2);
                    if(!row) { row = { y, items: [] }; rows.push(row); }
                    row.items.push({ x, str: it.str });
                });
                rows.sort((a,b) => b.y - a.y);
                text += rows.map(r => r.items.sort((a,b)=>a.x-b.x).map(it=>it.str).join(' ').trim()).join('\n') + '\n';
            }
            return text;
        }
        function parseMoney(v) { return Number(String(v||'').replace(/[^0-9.]/g,'')) || 0; }
        function parseSettlementPdfText(text, fileName) {
            const clean = text.replace(/\s+/g, ' ').trim();
            const fm = fileName.match(/(\d{2,4})년\s*(\d{1,2})월/) || clean.match(/(\d{4})년\s*(\d{1,2})월\s*정산서/);
            const year = fm ? (fm[1].length === 2 ? `20${fm[1]}` : fm[1]) : String(new Date().getFullYear());
            const monthNo = fm ? fm[2].padStart(2,'0') : String(new Date().getMonth()+1).padStart(2,'0');
            const month = `${year}-${monthNo}`;
            const authorFromFile = (fileName.match(/정산서_([^(.]+)\(?/) || [])[1];
            const summary = clean.match(/([가-힣A-Za-z0-9_]+)\s+\d+건\s+([\d,.]+)원\s+([\d,]+)원\s+([\d,]+)원/);
            const author = summary ? summary[1] : (authorFromFile || '미상');
            const totalSettlement = summary ? parseMoney(summary[2]) : 0;
            const tax = summary ? parseMoney(summary[3]) : 0;
            const authorPayout = summary ? parseMoney(summary[4]) : 0;
            const profit = Math.max(0, totalSettlement - tax - authorPayout);
            const works = [];
            const lines = text.split(/\n|\r/).map(x=>x.trim()).filter(Boolean);
            lines.forEach(line => {
                if(line.includes('합계') || line.includes('작품명') || !line.includes('%')) return;
                const moneyMatches = [...line.matchAll(/[\d,]+(?:\.\d+)?원/g)];
                if(moneyMatches.length < 3) return;
                const title = line.slice(0, moneyMatches[0].index).trim();
                const settlementToken = moneyMatches[moneyMatches.length - 3][0];
                if(title) works.push({ title, sales: parseMoney(settlementToken) });
            });
            if(works.length === 0 && totalSettlement) works.push({ title: '전체', sales: totalSettlement });
            return { id: Date.now() + Math.floor(Math.random()*100000), fileName, month, author, totalSettlement, tax, authorPayout, profit, works, createdAt: getKstDateString() };
        }
        function drawSalesChart(monthKeys, byMonth) {
            const canvas = document.getElementById('sales-chart'); if(!canvas) return;
            const ctx = canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height);
            const pad = 45, w = canvas.width - pad*2, h = canvas.height - pad*2;
            ctx.font = '12px Pretendard, sans-serif'; ctx.fillStyle = '#888';
            ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, pad+h); ctx.lineTo(pad+w, pad+h); ctx.strokeStyle = '#ddd'; ctx.stroke();
            if(monthKeys.length === 0) { ctx.fillText('등록된 매출 데이터가 없습니다.', pad+20, pad+40); return; }
            const max = Math.max(...monthKeys.map(k=>byMonth[k].sales), 1);
            const step = w / Math.max(monthKeys.length, 1);
            ctx.beginPath();
            monthKeys.forEach((k, i) => {
                const x = pad + step*i + step/2;
                const y = pad + h - (byMonth[k].sales / max) * h;
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                ctx.fillStyle = '#111'; ctx.fillText(k, x-22, pad+h+20);
                ctx.fillText(formatWon(byMonth[k].sales), x-35, y-10);
                ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fillStyle = '#ff85a2'; ctx.fill(); ctx.beginPath(); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            });
            ctx.strokeStyle = '#ff85a2'; ctx.lineWidth = 2; ctx.stroke();
        }

function gwInjectStyles() {
  if (document.getElementById('gw-style')) return;
  const st = document.createElement('style');
  st.id = 'gw-style';
  st.textContent = `
    .logo-area { padding: 22px 18px 18px; }
    .liv-logo-card { width: 180px !important; height: 100px !important; background: transparent !important; box-shadow: none !important; padding: 0 !important; border-radius: 0 !important; }
    .liv-logo-img { width: 100% !important; height: 100% !important; object-fit: contain !important; }
    .nav-group::-webkit-scrollbar { width: 10px; }
    .nav-group::-webkit-scrollbar-track { background: #0f0f0f; }
    .nav-group::-webkit-scrollbar-thumb { background: var(--main-pink); border-radius: 999px; border: 2px solid #0f0f0f; }
    .nav-group { scrollbar-color: var(--main-pink) #0f0f0f; scrollbar-width: thin; }
    .ev-email { background:#f5efff !important; border-left-color:#b993ff !important; }
    .ev-personal { background:#eefaf3 !important; border-left-color:#7bcfa2 !important; }
    .ev-settlement { background:#fff1f1 !important; border-left-color:#ff4d4f !important; }
    .dash-grid-4 { display:grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap:15px; }
    .work-row-highlight { animation: rowFlash 1.25s ease; }
    @keyframes rowFlash { 0% { box-shadow: inset 0 0 0 999px rgba(255,133,162,.28); } 100% { box-shadow: inset 0 0 0 999px rgba(255,133,162,0); } }
    .work-action-group { display:flex; gap:6px; flex-wrap:wrap; align-items:center; justify-content:center; }
    .modal-content.large { width:min(720px,92vw); }
    .modal-form-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:12px; }
    .modal-field label { display:block; font-size:.78rem; color:#666; font-weight:700; margin-bottom:6px; }
    .webtoon-card-grid { display:grid !important; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap:18px; align-items:start; }
    .webtoon-card { width:auto !important; min-height:0 !important; display:flex; flex-direction:column; gap:10px; }
    .webtoon-cover { width:100%; aspect-ratio:3/4; height:auto !important; object-fit:cover; border-radius:10px; background:#f4f4f4; }
    .webtoon-info-box { background:#fafafa; border:1px solid #eee; border-radius:8px; padding:10px 12px; font-size:.82rem; line-height:1.55; }
    .webtoon-progress { display:flex; gap:6px; flex-wrap:wrap; }
    .webtoon-progress .step { font-size:.72rem; padding:4px 8px; border-radius:999px; background:#f3f3f3; color:#777; border:1px solid #e8e8e8; }
    .webtoon-progress .step.active { background:var(--soft-pink); color:var(--main-pink); border-color:var(--main-pink); font-weight:700; }
    .sales-month-card { padding:18px; border:1px solid #eee; border-radius:12px; background:#fff; margin-bottom:16px; }
    .sales-month-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
    .sales-metrics { display:grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap:10px; }
    .sales-metric-box { background:#fff8fa; border:1px solid #ffd6df; border-radius:10px; padding:12px; }
    .sales-metric-box .k { font-size:.74rem; color:#777; font-weight:700; margin-bottom:6px; }
    .sales-metric-box .v { font-size:1rem; font-weight:900; color:#111; }
    .sales-toggle-list { display:none; margin-top:12px; border-top:1px dashed #eee; padding-top:12px; }
    .sales-toggle-list.show { display:block; }
    .sales-file-item { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:10px 0; border-top:1px solid #f0f0f0; }
    .progress-stack { display:flex; gap:15px; overflow-x:auto; padding-bottom:10px; align-items:flex-start; }
    .progress-accordion { display:flex; flex-direction:column; gap:10px; }
    .progress-accordion-item { border:1px solid #eee; border-radius:10px; overflow:hidden; background:#fff; }
    .progress-accordion-head { padding:14px 16px; font-weight:800; display:flex; justify-content:space-between; gap:10px; cursor:pointer; }
    .progress-accordion-body { display:none; padding:0 12px 12px; }
    .progress-accordion-item.open .progress-accordion-body { display:block; }
    .progress-work-pill { background:#fafafa; border:1px solid #eee; border-radius:8px; padding:10px 12px; margin-top:8px; cursor:pointer; }
    .progress-work-pill:hover { background:var(--soft-pink); }
    @media (max-width: 1200px), (orientation: portrait) { .dash-grid-4 { grid-template-columns: 1fr; } .webtoon-card-grid { grid-template-columns: 1fr !important; } }
  `;
  document.head.appendChild(st);
}

function gwSetupUi() {
  gwInjectStyles();
  const logoWrap = document.querySelector('.liv-logo-card');
  if (logoWrap) logoWrap.innerHTML = `<img src="${WHITE_LOGO_DATA}" alt="Liv romance story" class="liv-logo-img">`;
  const navGroup = document.querySelector('.nav-group');
  if (navGroup) {
    const webtoonNav = navGroup.querySelector('[data-view="webtoon"]');
    const salesNav = navGroup.querySelector('[data-view="sales"]');
    if (webtoonNav && salesNav && salesNav.previousElementSibling !== webtoonNav) webtoonNav.insertAdjacentElement('afterend', salesNav);
  }
  gwEnsureModals();
}

function initMonthlySystemTasks() {

async function importSettlementPdfs(files) { if(!files||!files.length) return; pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; for(const file of files){ const text=await extractPdfText(file); const rec=parseSettlementPdfText(text,file.name); if(rec) livData.salesRecords.push(rec); } saveData(); changeView('sales'); }
function parseSettlementPdfText(text,fileName) {
  const clean = text.replace(/\s+/g,' ').trim();
  const fm = fileName.match(/(\d{2,4})년\s*(\d{1,2})월/) || clean.match(/(\d{4})년\s*(\d{1,2})월\s*정산서/);
  const year = fm ? (fm[1].length===2 ? `20${fm[1]}` : fm[1]) : String(new Date().getFullYear());
  const monthNo = fm ? fm[2].padStart(2,'0') : String(new Date().getMonth()+1).padStart(2,'0');
  const month = `${year}-${monthNo}`;
  const authorFromFile = (fileName.match(/정산서_([^(.]+)\(?/) || [])[1];
  const summary = clean.match(/([가-힣A-Za-z0-9_]+)\s+\d+\s*(?:건|작품)\s+([\d,.]+)원\s+([\d,.]+)원\s+([\d,.]+)원/);
  let author = summary ? summary[1] : (authorFromFile || '미상');
  let totalSettlement = summary ? parseMoney(summary[2]) : 0;
  let tax = summary ? parseMoney(summary[3]) : 0;
  let authorPayout = summary ? parseMoney(summary[4]) : 0;
  const works = [];
  const lines = text.split(/\n|\r/).map(x=>x.trim()).filter(Boolean);

  lines.forEach(line=>{
    if(line.includes('작품명') || line.includes('작가명') || line.includes('정산서') || line.includes('정산일') || line.includes('출처:') || line.includes('문의:') || line.includes('원 단위')) return;
    if(line.includes('합계')) return;
    if(!line.includes('%')) return;

    const newRow = line.match(/^(.+?)\s+((?:[\d,]+(?:\.\d+)?\s+){10}[\d,]+(?:\.\d+)?)\s+\d+(?:\.\d+)?%\s+[\d,]+(?:\.\d+)?\s*원?$/);
    if(newRow) {
      const nums = newRow[2].trim().split(/\s+/);
      const title = newRow[1].trim();
      const settlementToken = nums[9];
      if(title) works.push({title, sales:parseMoney(settlementToken)});
      return;
    }

    const moneyMatches = [...line.matchAll(/[\d,]+(?:\.\d+)?원/g)];
    if(moneyMatches.length >= 3) {
      const title = line.slice(0,moneyMatches[0].index).trim();
      const settlementToken = moneyMatches[moneyMatches.length-3][0];
      if(title) works.push({title, sales:parseMoney(settlementToken)});
    }
  });

  if(!summary) {
    const totalLine = lines.find(line => line.trim().startsWith('합계'));
    if(totalLine) {
      const totalNew = totalLine.match(/^합계\s+((?:[\d,]+(?:\.\d+)?\s+){10}[\d,]+(?:\.\d+)?)\s+-\s+([\d,]+(?:\.\d+)?)\s*원?$/);
      if(totalNew) {
        const nums = totalNew[1].trim().split(/\s+/);
        totalSettlement = parseMoney(nums[9]);
        tax = parseMoney(nums[10]);
        authorPayout = parseMoney(totalNew[2]);
      }
    }
  }

  if(!totalSettlement && works.length) totalSettlement = works.reduce((s,w)=>s+Number(w.sales||0),0);
  if(author === '미상' && authorFromFile) author = authorFromFile;

  const worksSettlementSum = works.reduce((s,w)=>s+Number(w.sales||0),0);
  const profit = Math.max(0, Number(totalSettlement||0)-Number(tax||0)-Number(authorPayout||0));
  return {id:Date.now()+Math.floor(Math.random()*100000), fileName, month, author, totalSettlement, tax, authorPayout, profit, works, worksSettlementSum, crossCheckDiff:Math.abs((totalSettlement||0)-(worksSettlementSum||0)), createdAt:getKstDateString()};
}
function drawSalesChart(monthKeys,byMonth) { const canvas=document.getElementById('sales-chart'); if(!canvas) return; const wrap=canvas.parentElement; const dpr=window.devicePixelRatio||1; const cssWidth=Math.max(wrap.clientWidth||700,700), cssHeight=280; canvas.style.width=cssWidth+'px'; canvas.style.height=cssHeight+'px'; canvas.width=Math.floor(cssWidth*dpr); canvas.height=Math.floor(cssHeight*dpr); const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cssWidth,cssHeight); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cssWidth,cssHeight); const pad={left:52,right:24,top:24,bottom:44}, w=cssWidth-pad.left-pad.right, h=cssHeight-pad.top-pad.bottom; ctx.strokeStyle='#ececec'; for(let i=0;i<5;i++){ const y=pad.top+(h/4)*i; ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(pad.left+w,y); ctx.stroke(); } if(!monthKeys.length){ ctx.fillStyle='#888'; ctx.font='14px Pretendard, sans-serif'; ctx.fillText('등록된 매출 데이터가 없습니다.', pad.left+16, pad.top+28); return; } const max=Math.max(...monthKeys.map(k=>byMonth[k].sales),1); const step=monthKeys.length>1 ? w/(monthKeys.length-1):0; ctx.beginPath(); monthKeys.forEach((k,i)=>{ const x=pad.left+step*i, y=pad.top+h-(byMonth[k].sales/max)*h; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }); ctx.strokeStyle='#ff85a2'; ctx.lineWidth=3; ctx.stroke(); monthKeys.forEach((k,i)=>{ const x=pad.left+step*i, y=pad.top+h-(byMonth[k].sales/max)*h; ctx.beginPath(); ctx.arc(x,y,4.5,0,Math.PI*2); ctx.fillStyle='#ff85a2'; ctx.fill(); ctx.fillStyle='#666'; ctx.font='12px Pretendard, sans-serif'; const label=k.slice(5).replace('-','/'); ctx.fillText(label, x-14, cssHeight-18); ctx.fillStyle='#333'; ctx.font='11px Pretendard, sans-serif'; const val=formatWon(byMonth[k].sales).replace('원',''); ctx.fillText(val, x-ctx.measureText(val).width/2, y-10); }); }

  const FINAL_WEBTOON_STATUSES = ['구두 확정', '계약서 작성 완료', '캐시트 전달 완료', '론칭 완료'];

  function baseTitle(v) {
    return String(v || '').replace(/\s*\d+권\s*$/,'').replace(/[<>\[\]【】「」『』()（）\s]/g,'').toLowerCase();
  }
  function countMainWorks(writer) {
    return (writer && writer.works ? writer.works : []).filter(w => !w.parentId).length;
  }
  function won(n) {
    return `${Math.round(Number(n || 0)).toLocaleString()}원`;
  }
  function writerSales(writer) {
    if (!writer || !Array.isArray(livData.salesRecords)) return 0;
    const name = String(writer.name || '').trim();
    const titles = new Set((writer.works || []).map(w => baseTitle(w.title)).filter(Boolean));
    let sum = 0;
    livData.salesRecords.forEach(r => {
      if (name && String(r.author || '').trim() === name) {
        sum += Number(r.totalSettlement || 0);
        return;
      }
      (r.works || []).forEach(w => {
        if (titles.has(baseTitle(w.title))) sum += Number(w.sales || 0);
      });
    });
    return sum;
  }
  function isBizDay(ds) {
    const d = parseDateString(ds);
    return d.getDay() !== 0 && d.getDay() !== 6 && !getHolidayName(ds);
  }
  function adjustedDate(y, m, day) {
    const d = new Date(y, m - 1, day);
    while (true) {
      const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if (isBizDay(ds)) return ds;
      d.setDate(d.getDate() - 1);
    }
  }

  window.ensureMonthlySettlementTasks = function() {
    if (!livData.extraTasks) livData.extraTasks = [];
    const cy = new Date().getFullYear();
    const years = [...new Set([cy - 1, cy, cy + 1, 2026, 2027])];
    years.forEach(y => {
      for (let m = 1; m <= 12; m++) {
        [
          [adjustedDate(y, m, 25), '정산서 발송'],
          [adjustedDate(y, m, new Date(y, m, 0).getDate()), '작가 인세 지급']
        ].forEach(([date, title]) => {
          const id = `system-settlement-${title}-${date}`;
          const found = livData.extraTasks.find(t => t.id === id);
          if (found) {
            const completed = !!found.completed;
            Object.assign(found, { id, date, type:'ev-settlement', title, fixed:true, systemSettlement:true, completed });
          } else {
            livData.extraTasks.push({ id, date, type:'ev-settlement', title, fixed:true, systemSettlement:true, completed:false });
          }
        });
      }
    });
  };
