    window.dailyV9SaveEdit = function (id) {
        const block = livData.dailyTimeBlocks.find(b => b.id === id);
        if (!block) return;

        const title = document.getElementById('daily-v9-edit-title').value.trim() || '제목 없음';
        const desc = document.getElementById('daily-v9-edit-desc').value.trim() || '';
        const start = document.getElementById('daily-v9-edit-start').value || DEFAULT_START;
        const end = document.getElementById('daily-v9-edit-end').value || minToTime(timeToMin(start) + 60);
        const cls = document.getElementById('daily-v9-edit-class').value || 'ev-task';

        if (timeToMin(end) <= timeToMin(start)) {
            alert('종료 시간은 시작 시간보다 늦어야 해요.');
            return;
        }

        block.title = title;
        block.desc = desc;
        block.start = start;
        block.end = end;
        block.className = cls;

        save();
        renderDailySources();
        renderDailyBlocks();
    };

        renderDailyBlocks();
    };

    window.dailyV9ClearDay = function () {
        const date = getDailyDate();
        if (!confirm(`${date}의 데일리 시간표를 전부 비울까요?`)) return;

        livData.dailyTimeBlocks = livData.dailyTimeBlocks.filter(b => b.date !== date);
        selectedBlockId = null;

        save();
        dailyV9CloseEditor();
        renderDailySources();
        renderDailyBlocks();
    };

    function detectWorkKey(item) {
        if (!item || !item.classList) return null;

        for (const cls in WORK_CLASS_TO_KEY) {
            if (item.classList.contains(cls)) return WORK_CLASS_TO_KEY[cls];
        }

        return null;
    }

    function detectExtraType(item) {
        if (!item || !item.classList) return null;
        return EXTRA_CLASSES.find(cls => item.classList.contains(cls)) || null;
    }

    function parseIds(attr) {
        const text = String(attr || '');

        let m = text.match(/openWorkPage\(\s*['"]?([^,'")]+)['"]?\s*,\s*['"]?([^'")]+)['"]?\s*\)/);
        if (m) return { kind: 'work', writerId: String(m[1]).trim(), workId: String(m[2]).trim() };

        m = text.match(/completeWorkTask\(\s*['"]?([^,'")]+)['"]?\s*,\s*['"]?([^,'")]+)['"]?\s*,\s*['"]([^'"]+)['"]/);
        if (m) return { kind: 'work', writerId: String(m[1]).trim(), workId: String(m[2]).trim(), key: String(m[3]).trim() };

        m = text.match(/drag\(\s*event\s*,\s*['"]([^'"]+)['"]\s*,\s*['"]?([^,'")]+)['"]?\s*,\s*['"]?([^'")]+)['"]?\s*\)/);
        if (m && m[1] !== 'extraTask') return { kind: 'work', key: String(m[1]).trim(), writerId: String(m[2]).trim(), workId: String(m[3]).trim() };

        m = text.match(/handleExtraTask(?:Dbl)?Click\(\s*event\s*,\s*['"]([^'"]+)['"]/);
        if (m) return { kind: 'extra', extraId: String(m[1]).trim() };

        m = text.match(/copyExtraTask\(\s*event\s*,\s*['"]([^'"]+)['"]/);
        if (m) return { kind: 'extra', extraId: String(m[1]).trim() };

        m = text.match(/drag\(\s*event\s*,\s*['"]extraTask['"]\s*,\s*null\s*,\s*['"]([^'"]+)['"]\s*\)/);
        if (m) return { kind: 'extra', extraId: String(m[1]).trim() };

        return null;
    }

    function getDateFromItem(item, fallback) {
        if (item.dataset.livV9Date) return item.dataset.livV9Date;

        const parent = item.closest('[id]');
        if (parent) {
            const m = String(parent.id || '').match(/(\d{4}-\d{2}-\d{2})/);
            if (m) return m[1];
        }

        return fallback || null;
    }

    function attrsForItem(item) {
        const attrs = [
            item.getAttribute('onclick'),
            item.getAttribute('ondblclick'),
            item.getAttribute('ondragstart'),
            item.getAttribute('oncontextmenu')
        ];

        const titleEl = item.querySelector('.evt-title, .week-evt-title, .clickable-title');
        if (titleEl) {
            attrs.push(titleEl.getAttribute('onclick'));
            attrs.push(titleEl.getAttribute('ondblclick'));
        }

        return attrs;
    }

    function findWorkByText(item, key, dateStr) {
        const titleEl = item.querySelector('.evt-title, .week-evt-title, .clickable-title') || item;
        const writerEl = item.querySelector('.evt-writer, .week-evt-writer');

        const title = cleanText(titleEl.textContent);
        const writerName = writerEl ? cleanText(writerEl.textContent) : '';

        for (const writer of livData.writers) {
            for (const work of (writer.works || [])) {
                const sameTitle = cleanText(work.title) === title;
                const sameWriter = !writerName || cleanText(writer.name) === writerName;
                const hasDate = getDateList(work, key).includes(dateStr);

                if (sameTitle && sameWriter && hasDate) {
                    return { kind: 'work', writerId: writer.id, workId: work.id, key, date: dateStr };
                }
            }
        }

        return null;
    }

    function findExtraByText(item, type, dateStr) {
        const titleEl = item.querySelector('.evt-title, .week-evt-title') || item;
        const writerEl = item.querySelector('.evt-writer, .week-evt-writer');

        const title = cleanText(titleEl.textContent);
        const writerName = writerEl ? cleanText(writerEl.textContent) : '';

        for (const task of livData.extraTasks) {
            if (!task || task.hidden || task.date !== dateStr) continue;
            if (type && normalizeType(task.type) !== type) continue;

            const rawTitle = cleanText(task.title);
            const labeledTitle = cleanText(`[${extraLabel(task.type)}] ${task.title}`);
            const sameTitle = rawTitle === title || labeledTitle === title;

            const writer = task.writerId ? getWriter(task.writerId) : null;
            const sameWriter = !writerName || (writer && cleanText(writer.name) === writerName);

            if (sameTitle && sameWriter) {
                return { kind: 'extra', extraId: task.id, date: dateStr };
            }
        }

        return null;
    }

    function getWorkTarget(item, fallbackDate) {
        const keyFromClass = detectWorkKey(item);
        if (!keyFromClass) return null;

        if (item.dataset.livV9Kind === 'work') {
            return {
                kind: 'work',
                writerId: item.dataset.livV9WriterId,
                workId: item.dataset.livV9WorkId,
                key: item.dataset.livV9Key,
                date: item.dataset.livV9Date || fallbackDate
            };
        }

        for (const attr of attrsForItem(item)) {
            const parsed = parseIds(attr);

            if (parsed && parsed.kind === 'work') {
                return {
                    kind: 'work',
                    writerId: parsed.writerId,
                    workId: parsed.workId,
                    key: parsed.key && WORK_KEYS[parsed.key] ? parsed.key : keyFromClass,
                    date: fallbackDate
                };
            }
        }

        return findWorkByText(item, keyFromClass, fallbackDate);
    }

    function getExtraTarget(item, fallbackDate) {
        const type = detectExtraType(item);
        if (!type) return null;

        if (item.dataset.livV9Kind === 'extra') {
            return {
                kind: 'extra',
                extraId: item.dataset.livV9ExtraId,
                date: item.dataset.livV9Date || fallbackDate
            };
        }

        for (const attr of attrsForItem(item)) {
            const parsed = parseIds(attr);
            if (parsed && parsed.kind === 'extra') {
                return { kind: 'extra', extraId: parsed.extraId, date: fallbackDate };
            }
        }

        return findExtraByText(item, type, fallbackDate);
    }

    function copyWork(target) {
        if (!target || !WORK_KEYS[target.key]) return;

        const found = getWork(target.writerId, target.workId);
        const work = found.work;
        const info = WORK_KEYS[target.key];

        if (!work) {
            alert('복사할 작품 일정을 찾지 못했어요.');
            return;
        }

        const sourceDate = target.date || work[target.key];

        if (!sourceDate) {
            alert('복사 기준 날짜를 찾지 못했어요.');
            return;
        }

        const targetDate = prompt(`"${work.title}" ${info.label} 일정을 어느 날짜로 복사할까요?`, nextDate(sourceDate, 1));
        if (!targetDate) return;

        if (!/^\d{4}-\d{2}-\d{2}$/.test(targetDate)) {
            alert('날짜는 2026-06-21처럼 입력해 주세요.');
            return;
        }

        const dates = getDateList(work, target.key);
        dates.push(sourceDate, targetDate);

        setDateList(work, target.key, dates);
        addCopiedWorkOccurrence(work, target.key, targetDate);

        save();
        rerenderCalendar();
    }

    function copyExtra(target) {
        if (!target || !target.extraId) return;

        const source = getExtra(target.extraId);

        if (!source) {
            alert('복사할 일정을 찾지 못했어요.');
            return;
        }

        if (source.fixed || source.systemSettlement) {
            alert('고정/시스템 일정은 복사하지 않는 편이 안전해요.');
            return;
        }

        const sourceDate = source.date || target.date;

        if (!sourceDate) {
            alert('복사 기준 날짜를 찾지 못했어요.');
            return;
        }

        const targetDate = prompt(`"${source.title || '일정'}" 일정을 어느 날짜로 복사할까요?`, nextDate(sourceDate, 1));
        if (!targetDate) return;

        if (!/^\d{4}-\d{2}-\d{2}$/.test(targetDate)) {
            alert('날짜는 2026-06-21처럼 입력해 주세요.');
            return;
        }

        const copied = JSON.parse(JSON.stringify(source));
        copied.id = makeId('extra_v9');
        copied.date = targetDate;
        copied.completed = false;
        copied.fixed = false;
        copied.systemSettlement = false;
        copied._livCopied = true;
        copied._livCopyV9 = true;
        copied._dailyCopySourceId = source.id;

        livData.extraTasks.push(copied);

        save();
        rerenderCalendar();
    }

    function deleteCopiedWork(target) {
        if (!target || !WORK_KEYS[target.key]) return false;

        const found = getWork(target.writerId, target.workId);
        const work = found.work;

        if (!work || !isCopiedWorkOccurrence(work, target.key, target.date)) return false;

        const info = WORK_KEYS[target.key];

        if (!confirm(`이 복사된 ${info.label} 일정을 삭제할까요?`)) return true;

        removeWorkOccurrence(work, target.key, target.date);

        save();
        rerenderCalendar();

        return true;
    }

    function deleteCopiedExtra(target) {
        if (!target || !target.extraId) return false;

        const task = getExtra(target.extraId);

        if (!isCopiedExtra(task)) return false;

        if (!confirm('이 복사된 일정을 삭제할까요?')) return true;

        livData.extraTasks = livData.extraTasks.filter(t => String(t.id) !== String(task.id));

        save();
        rerenderCalendar();

        return true;
    }

    function appendMissingWorkOccurrences(dateStr, containerId, view, filter) {
        const container = document.getElementById(containerId);
        if (!container || !ensureData()) return;

        const existing = new Set();

        container.querySelectorAll('.event-item, .week-evt-item').forEach(item => {
            const date = getDateFromItem(item, dateStr);
            const target = getWorkTarget(item, date);

            if (target && target.kind === 'work') {
                existing.add(`${target.writerId}:${target.workId}:${target.key}:${date}`);
            }
        });

        const currentFilter = filter || 'all';
        let html = '';

        livData.writers.forEach(writer => {
            (writer.works || []).forEach(work => {
                Object.keys(WORK_KEYS).forEach(key => {
                    const info = WORK_KEYS[key];

                    if (key === 'pubDate' && !(currentFilter === 'all' || currentFilter === 'pub')) return;
                    if (key === 'coverDate' && !(currentFilter === 'all' || currentFilter === 'cover')) return;
                    if ((key === 'proofDate' || key === 'proofDate2') && !(currentFilter === 'all' || currentFilter === 'proof')) return;

                    const dates = getDateList(work, key);

                    if (!dates.includes(dateStr)) return;

                    const unique = `${writer.id}:${work.id}:${key}:${dateStr}`;
                    if (existing.has(unique)) return;

                    if (work[key] === dateStr) return;

                    const itemClass = view === 'week-calendar' ? 'week-evt-item' : 'event-item';
                    const titleClass = view === 'week-calendar' ? 'week-evt-title' : 'evt-title';
                    const writerClass = view === 'week-calendar' ? 'week-evt-writer' : 'evt-writer';

                    html += `
                        <div class="${itemClass} ${info.cls}"
                             data-liv-v9-kind="work"
                             data-liv-v9-writer-id="${esc(writer.id)}"
                             data-liv-v9-work-id="${esc(work.id)}"
                             data-liv-v9-key="${esc(key)}"
                             data-liv-v9-date="${esc(dateStr)}">
                            <span class="${titleClass}">[${info.label}] ${esc(work.title)}</span>
                            <span class="${writerClass}">${esc(writer.name)}</span>
                        </div>
                    `;
                });
            });
        });

        if (html) container.insertAdjacentHTML('beforeend', html);
    }

    function markItems(dateStr, containerId, view, filter) {
        const container = document.getElementById(containerId);
        if (!container || !ensureData()) return;

        appendMissingWorkOccurrences(dateStr, containerId, view, filter);

        container.querySelectorAll('.event-item, .week-evt-item').forEach(item => {
            const date = getDateFromItem(item, dateStr);
            const workTarget = getWorkTarget(item, date);

            if (workTarget && workTarget.kind === 'work') {
                const found = getWork(workTarget.writerId, workTarget.workId);
                const work = found.work;
                const copied = work && isCopiedWorkOccurrence(work, workTarget.key, date);

                item.dataset.livV9Kind = 'work';
                item.dataset.livV9WriterId = workTarget.writerId;
                item.dataset.livV9WorkId = workTarget.workId;
                item.dataset.livV9Key = workTarget.key;
                item.dataset.livV9Date = date;
                item.dataset.livV9Copied = copied ? '1' : '0';

                item.classList.toggle('liv-v9-copied', !!copied);
                return;
            }

            const extraTarget = getExtraTarget(item, date);

            if (extraTarget && extraTarget.kind === 'extra') {
                const task = getExtra(extraTarget.extraId);
                const copied = isCopiedExtra(task);

                item.dataset.livV9Kind = 'extra';
                item.dataset.livV9ExtraId = extraTarget.extraId;
                item.dataset.livV9Date = date;
                item.dataset.livV9Copied = copied ? '1' : '0';

                item.classList.toggle('liv-v9-copied', !!copied);
            }
        });

        sortScheduleContainer(container);
    }

    function priority(item) {
        const text = cleanText(item.textContent);

        if (
            item.classList.contains('ev-settlement') ||
            text.includes('정산') ||
            text.includes('정산서') ||
            text.includes('정산금')
        ) {
            return 0;
        }

        for (let i = 1; i < ORDER.length; i++) {
            if (item.classList.contains(ORDER[i])) return i;
        }

        return 99;
    }

    function sortScheduleContainer(container) {
        if (!container) return;

        const items = Array.from(container.children).filter(el => {
            return el.classList && (
                el.classList.contains('event-item') ||
                el.classList.contains('week-evt-item')
            );
        });

        if (items.length < 2) return;

        const sorted = items
            .map((el, index) => ({ el, index, priority: priority(el) }))
            .sort((a, b) => {
                if (a.priority !== b.priority) return a.priority - b.priority;
                return a.index - b.index;
            });

        let changed = false;
        for (let i = 0; i < items.length; i++) {
            if (items[i] !== sorted[i].el) {
                changed = true;
                break;
            }
        }

        if (!changed) return;

        sorted.forEach(obj => container.appendChild(obj.el));
    }

    function rerenderCalendar() {
        const main = document.getElementById('main-view');

        try {
            if (currentView() === 'week-calendar' && typeof renderWeekCalendar === 'function') {
                renderWeekCalendar(main);
            } else if (typeof renderCalendar === 'function') {
                renderCalendar(main);
            }
        } catch (e) {
            console.warn('v9 rerender skipped', e);
        }
    }

    function patchChangeView() {
        if (typeof changeView !== 'function' || changeView.__livV9Patched) return;

        const original = changeView;

        changeView = function (viewName, param) {
            if (viewName === DAILY_VIEW) {
                setCurrentView(DAILY_VIEW);
                setActiveDailyNav();

                const main = document.getElementById('main-view');
                if (main) renderDaily(main);

                if (typeof closeSidebarMobile === 'function') {
                    try { closeSidebarMobile(); } catch (e) {}
                }

                return;
            }

            return original(viewName, param);
        };

        changeView.__livV9Patched = true;
        window.changeView = changeView;
    }

    function patchCalendarRenderers() {
        if (typeof updateTasksHtml === 'function' && !updateTasksHtml.__livV9Patched) {
            const original = updateTasksHtml;

            updateTasksHtml = function (dateStr, containerId, view, filter) {
                original(dateStr, containerId, view, filter);
                markItems(dateStr, containerId, view || 'calendar', filter || 'all');
            };

            updateTasksHtml.__livV9Patched = true;
            window.updateTasksHtml = updateTasksHtml;
        }

        if (typeof updateWeekTasksHtml === 'function' && !updateWeekTasksHtml.__livV9Patched) {
            const originalWeek = updateWeekTasksHtml;

            updateWeekTasksHtml = function (dateStr, containerId) {
                originalWeek(dateStr, containerId);
                markItems(dateStr, containerId, 'week-calendar', 'all');
            };

            updateWeekTasksHtml.__livV9Patched = true;
            window.updateWeekTasksHtml = updateWeekTasksHtml;
        }
    }

    document.addEventListener('dragstart', function () {
        isDragging = true;
    }, true);

    document.addEventListener('dragend', function () {
        setTimeout(() => { isDragging = false; }, 50);
    }, true);

    document.addEventListener('drop', function () {
        setTimeout(() => { isDragging = false; }, 50);
    }, true);

    document.addEventListener('contextmenu', function (event) {
        if (isDragging) return;

        const item = event.target.closest('.event-item, .week-evt-item');
        if (!item) return;

        const date = getDateFromItem(item);
        const workTarget = getWorkTarget(item, date);

        if (workTarget && workTarget.kind === 'work') {
            event.preventDefault();
            event.stopImmediatePropagation();
            copyWork(workTarget);
            return false;
        }

        const extraTarget = getExtraTarget(item, date);

        if (extraTarget && extraTarget.kind === 'extra') {
            event.preventDefault();
            event.stopImmediatePropagation();
            copyExtra(extraTarget);
            return false;
        }
    }, true);

    document.addEventListener('click', function (event) {
        const item = event.target.closest('.event-item, .week-evt-item');
        if (!item) return;

        const date = getDateFromItem(item);
        const workTarget = getWorkTarget(item, date);

        if (workTarget && workTarget.kind === 'work') {
            const handled = deleteCopiedWork(workTarget);

            if (handled) {
                event.preventDefault();
                event.stopImmediatePropagation();
                return false;
            }
        }

        const extraTarget = getExtraTarget(item, date);

        if (extraTarget && extraTarget.kind === 'extra') {
            const handled = deleteCopiedExtra(extraTarget);

            if (handled) {
                event.preventDefault();
                event.stopImmediatePropagation();
                return false;
            }
        }
    }, true);

    window.copyWorkDateTaskSafe = function (event, writerId, workId, key, sourceDate) {
        if (event) {
            event.preventDefault();
            event.stopImmediatePropagation();
        }

        copyWork({
            kind: 'work',
            writerId,
            workId,
            key,
            date: sourceDate
        });

        return false;
    };

    window.copyExtraTask = function (event, extraId) {
        if (event) {
            event.preventDefault();
            event.stopImmediatePropagation();
        }

        const task = getExtra(extraId);

        copyExtra({
            kind: 'extra',
            extraId,
            date: task ? task.date : null
        });

        return false;
    };

    window.livRemoveWorkOccurrence = function (titlePart, dateStr, key) {
        if (!ensureData()) return false;

        let removed = false;

        livData.writers.forEach(writer => {
            (writer.works || []).forEach(work => {
                if (!String(work.title || '').includes(titlePart)) return;

                const keys = key && WORK_KEYS[key] ? [key] : Object.keys(WORK_KEYS);

                keys.forEach(k => {
                    if (!getDateList(work, k).includes(dateStr)) return;
                    removeWorkOccurrence(work, k, dateStr);
                    removed = true;
                });
            });
        });

        if (removed) {
            save();
            rerenderCalendar();
        }

        return removed;
    };

    function markVisibleCalendar() {
        document.querySelectorAll('[id]').forEach(el => {
            const m = String(el.id || '').match(/(\d{4}-\d{2}-\d{2})/);
            if (m && el.querySelector && el.querySelector('.event-item, .week-evt-item')) {
                markItems(m[1], el.id, currentView(), 'all');
            }
        });
    }

    function install() {
        if (installed || !ready()) return;

        ensureData();
        addDailyMenu();
        patchChangeView();
        patchCalendarRenderers();

        installed = true;

        markVisibleCalendar();

        if (currentView() === DAILY_VIEW) {
            const main = document.getElementById('main-view');
            if (main) renderDaily(main);
        }
    }

    const timer = setInterval(function () {
        install();

        if (installed) clearInterval(timer);
    }, 300);

    const observer = new MutationObserver(function () {
        if (!installed) return;
        setTimeout(markVisibleCalendar, 60);
    });

    function start() {
        install();

        const root = document.getElementById('main-view') || document.body;
        try {
            observer.observe(root, { childList: true, subtree: true });
        } catch (e) {}

        setInterval(function () {
            if (currentView() === DAILY_VIEW) updateNowLine();
            markVisibleCalendar();
        }, 15000);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
    } else {
        start();
    }
})();

        if (fn) {
            try { return fn(value || ''); } catch (e) {}

        return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

        if (typeof getKstDateString === 'function') {
            try { return getKstDateString(0); } catch (e) {}

        const parts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Seoul',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
        }).formatToParts(new Date());

        const data = {};
        parts.forEach(p => {
            if (p.type !== 'literal') data[p.type] = p.value;
        });

        return `${data.year}-${data.month}-${data.day}`;
    }

    function nowKst() {
        const parts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Seoul',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            hourCycle: 'h23'
        }).formatToParts(new Date());

        const data = {};
        parts.forEach(p => {
            if (p.type !== 'literal') data[p.type] = p.value;
        });

        return {
            date: `${data.year}-${data.month}-${data.day}`,
            minutes: Number(data.hour || 0) * 60 + Number(data.minute || 0),
            time: `${data.hour}:${data.minute}`
        };
    }

    function nextDate(dateStr, delta) {
        const d = new Date(dateStr + 'T00:00:00');
        d.setDate(d.getDate() + Number(delta || 1));
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

    function timeToMin(value) {
        const parts = String(value || DEFAULT_START).split(':');
        return Number(parts[0] || 0) * 60 + Number(parts[1] || 0);
    }

    function minToTime(mins) {
        mins = Math.round(Number(mins || 0));

        while (mins < 0) mins += 24 * 60;

        const h = Math.floor(mins / 60) % 24;
        const m = mins % 60;

        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function durationLabel(minutes) {
        minutes = Math.max(0, Math.round(Number(minutes || 0)));
        const h = Math.floor(minutes / 60);
        const m = minutes % 60;

        if (h && m) return `${h}시간 ${m}분`;
        if (h) return `${h}시간`;
        return `${m}분`;
    }

        return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    }

        return String(value || '')
            .replace(/\[[^\]]+\]/g, '')
            .replace(/\s+/g, ' ')

        return el ? el.value : (window.dailyV9Date || todayKst());

        ensureData();
        return livData.dailyStartTimes[dateStr] || DEFAULT_START;

        if (!ensureData() || !dateStr || !start) return;
        livData.dailyStartTimes[dateStr] = start;
    }

        if (!ensureData()) return null;
        return livData.writers.find(w => String(w.id) === String(writerId)) || null;

    function getWork(writerId, workId) {
        const writer = getWriter(writerId);

        return { writer, work };
    }

    function getExtra(extraId) {
        if (!ensureData()) return null;
        return livData.extraTasks.find(t => String(t.id) === String(extraId)) || null;
    }

    function normalizeType(type) {
        const t = String(type || 'ev-task');
        if (t.startsWith('ev-')) return t;

        const map = {
            task: 'ev-task',
            email: 'ev-email',
            meeting: 'ev-meeting',
            settlement: 'ev-settlement',
            personal: 'ev-personal',
            writing: 'ev-writing',
            rest: 'ev-rest',
            cover: 'ev-cover',
            proof1: 'ev-proof1',
            proof2: 'ev-proof2',
            pub: 'ev-pub'
        };

        return map[t] || t;
    }

    function extraLabel(type) {
        const cls = normalizeType(type);

        if (typeof extraTaskLabel === 'function') {
            try {
                const label = extraTaskLabel(cls);
                if (label) return label;
            } catch (e) {}
        }

        return TYPE_LABELS[cls] || '일정';
    }

    function getDateList(work, key) {
        const info = WORK_KEYS[key];
        if (!work || !info) return [];

        const list = [];
        if (work[key]) list.push(work[key]);
        if (Array.isArray(work[info.arr])) list.push(...work[info.arr]);

        return Array.from(new Set(list.filter(Boolean))).sort();
    }

    function setDateList(work, key, dates) {
        const info = WORK_KEYS[key];
        if (!work || !info) return;

        const clean = Array.from(new Set((dates || []).filter(Boolean))).sort();

        if (!clean.length) {
            work[key] = '';
            work[info.arr] = [];
            return;
        }

        work[info.arr] = clean;
        work[key] = clean[clean.length - 1];
    }

    function ensureCopiedDates(work, key) {
        if (!work._livCopiedDates || typeof work._livCopiedDates !== 'object') {
            work._livCopiedDates = {};
        }

        if (!Array.isArray(work._livCopiedDates[key])) {
            const dates = getDateList(work, key);
            work._livCopiedDates[key] = dates.filter(d => d !== work[key]);
        }

        return work._livCopiedDates[key];
    }

    function isCopiedWorkOccurrence(work, key, dateStr) {
        if (!work || !key || !dateStr) return false;

        const copied = ensureCopiedDates(work, key);
        if (copied.includes(dateStr)) return true;

        const dates = getDateList(work, key);
        return dates.length > 1 && dateStr !== work[key];
    }

    function addCopiedWorkOccurrence(work, key, dateStr) {
        const copied = ensureCopiedDates(work, key);
        if (!copied.includes(dateStr)) copied.push(dateStr);
        work._livCopiedDates[key] = Array.from(new Set(copied)).sort();
    }

    function removeWorkOccurrence(work, key, dateStr) {
        if (!work || !WORK_KEYS[key] || !dateStr) return;

        ensureCopiedDates(work, key);
        work._livCopiedDates[key] = work._livCopiedDates[key].filter(d => d !== dateStr);

        const dates = getDateList(work, key).filter(d => d !== dateStr);
        setDateList(work, key, dates);
    }

    function isCopiedExtra(task) {
        return !!(
            task &&
            (
                task._livCopied === true ||
                task._livCopyV9 === true ||
                task._dailyCopied === true ||
                task._dailyCopySourceId ||
                task.copiedFromId ||
                task.copyOfId ||
                String(task.id || '').startsWith('extra_v9_') ||
                String(task.id || '').startsWith('extra_copy_')
            )
        );
    }

    function dailyBlocks(dateStr) {
        if (!ensureData()) return [];

        return livData.dailyTimeBlocks
            .filter(b => b && b.date === dateStr)
            .sort((a, b) => timeToMin(a.start) - timeToMin(b.start));
    }

    function nextStartForDaily(dateStr) {
        const start = timeToMin(getStartForDate(dateStr));
        const blocks = dailyBlocks(dateStr);

        if (!blocks.length) return minToTime(start);

        const lastEnd = Math.max(...blocks.map(b => timeToMin(b.end || b.start || getStartForDate(dateStr))));
        return minToTime(Math.max(start, lastEnd));
    }

    function collectDailySources(dateStr) {
        if (!ensureData()) return [];

        const items = [];

        livData.extraTasks.forEach(task => {
            if (!task || task.hidden || task.date !== dateStr) return;

            const cls = normalizeType(task.type);
            const writer = task.writerId ? getWriter(task.writerId) : null;

            items.push({
                sourceKey: `extra:${task.id}`,
                title: `[${extraLabel(cls)}] ${task.title || '제목 없음'}`,
                writerName: writer ? writer.name : '',
                className: cls,
                defaultMinutes: TYPE_DEFAULT_MINUTES[cls] || 60
            });
        });

        livData.writers.forEach(writer => {
            (writer.works || []).forEach(work => {
                Object.keys(WORK_KEYS).forEach(key => {
                    const info = WORK_KEYS[key];

                    if (!getDateList(work, key).includes(dateStr)) return;

                    items.push({
                        sourceKey: `work:${writer.id}:${work.id}:${key}:${dateStr}`,
                        title: `[${info.label}] ${work.title || '제목 없음'}`,
                        writerName: writer.name || '',
                        className: info.cls,
                        defaultMinutes: info.minutes
                    });
                });
            });
        });

        return items;
    }

    function renderDailySources() {
        const box = document.getElementById('daily-v9-sources');
        if (!box) return;

        const date = getDailyDate();
        const sources = collectDailySources(date);
        const registered = new Set(dailyBlocks(date).map(b => b.sourceKey).filter(Boolean));

        window.__dailyV9Sources = sources;

        if (!sources.length) {
            box.innerHTML = `<div class="daily-v9-empty">이 날짜에 월간 스케줄러 일정이 없습니다.<br>아래에서 직접 추가할 수 있어요.</div>`;

        box.innerHTML = sources.map((item, idx) => {

            return `

                    <div class="daily-v9-source-title">${esc(item.title)}</div>

                        <button class="daily-v9-btn" ${done ? 'disabled' : ''} onclick="dailyV9RegisterSource(${idx})">${done ? '등록됨' : '등록'}</button>
                    </div>

    function renderDailyBlocks() {
        const layer = document.getElementById('daily-v9-layer');
        const empty = document.getElementById('daily-v9-empty');
        const totalEl = document.getElementById('daily-v9-total');

        if (!layer) return;

        const date = getDailyDate();
        const startBase = timeToMin(getStartForDate(date));
        const endBase = startBase + DAY_SPAN_MINUTES;
        const blocks = dailyBlocks(date);
        const total = blocks.reduce((sum, b) => sum + Math.max(0, timeToMin(b.end) - timeToMin(b.start)), 0);

        if (totalEl) totalEl.textContent = `${date} 작업 합계 ${durationLabel(total)}`;
        if (empty) empty.style.display = blocks.length ? 'none' : 'block';

        layer.innerHTML = blocks.map(block => {
            const startMin = timeToMin(block.start);
            const endMin = timeToMin(block.end);
            const visibleStart = Math.max(startBase, startMin);
            const visibleEnd = Math.min(endBase, endMin);

            if (visibleEnd <= startBase || visibleStart >= endBase) return '';

            const top = Math.max(0, (visibleStart - startBase) * MINUTE_HEIGHT);
            const height = Math.max(30, (visibleEnd - visibleStart) * MINUTE_HEIGHT - 4);
            const active = block.id === selectedBlockId ? 'active' : '';

            return `
                <div class="daily-v9-block ${esc(block.className)} ${active}"
                     style="top:${top}px; height:${height}px;"
                     onclick="dailyV9OpenEditor('${esc(block.id)}')">
                    <div class="daily-v9-block-title">${esc(block.title)}</div>
                    <div class="daily-v9-block-meta">${esc(block.start)} ~ ${esc(block.end)} · ${durationLabel(Math.max(0, endMin - startMin))}</div>
                    ${block.desc ? `<div class="daily-v9-block-desc">${esc(block.desc)}</div>` : ''}
                </div>
            `;
        }).join('');

        updateNowLine();
    }

    function updateNowLine() {
        const date = getDailyDate();
        const line = document.getElementById('daily-v9-now-line');
        if (!line || !date) return;

        const now = nowKst();
        const startBase = timeToMin(getStartForDate(date));
        const endBase = startBase + DAY_SPAN_MINUTES;

        if (date === now.date && now.minutes >= startBase && now.minutes <= endBase) {
            line.style.display = 'block';
            line.style.top = `${(now.minutes - startBase) * MINUTE_HEIGHT}px`;

            const label = line.querySelector('.daily-v9-now-label');
            if (label) label.textContent = `현재 ${now.time}`;
        } else {
            line.style.display = 'none';
        }

        document.querySelectorAll('.daily-v9-block').forEach(block => {
            const meta = block.querySelector('.daily-v9-block-meta');
            const text = meta ? meta.textContent || '' : '';
            const match = text.match(/(\d{2}):(\d{2})\s*~\s*(\d{2}):(\d{2})/);
            if (!match) return;

            const endMin = Number(match[3]) * 60 + Number(match[4]);

            if (date < now.date) block.classList.add('daily-v9-past');
            else if (date > now.date) block.classList.remove('daily-v9-past');
            else if (endMin <= now.minutes) block.classList.add('daily-v9-past');
            else block.classList.remove('daily-v9-past');
        });
    }

    function detectWorkKey(item) {
        if (!item || !item.classList) return null;

        for (const cls in WORK_CLASS_TO_KEY) {
            if (item.classList.contains(cls)) return WORK_CLASS_TO_KEY[cls];
        }

        return null;
    }

    function detectExtraType(item) {
        if (!item || !item.classList) return null;
        return EXTRA_CLASSES.find(cls => item.classList.contains(cls)) || null;
    }

    function parseIds(attr) {
        const text = String(attr || '');

        let m = text.match(/openWorkPage\(\s*['"]?([^,'")]+)['"]?\s*,\s*['"]?([^'")]+)['"]?\s*\)/);
        if (m) return { kind: 'work', writerId: String(m[1]).trim(), workId: String(m[2]).trim() };

        m = text.match(/completeWorkTask\(\s*['"]?([^,'")]+)['"]?\s*,\s*['"]?([^,'")]+)['"]?\s*,\s*['"]([^'"]+)['"]/);
        if (m) return { kind: 'work', writerId: String(m[1]).trim(), workId: String(m[2]).trim(), key: String(m[3]).trim() };

        m = text.match(/drag\(\s*event\s*,\s*['"]([^'"]+)['"]\s*,\s*['"]?([^,'")]+)['"]?\s*,\s*['"]?([^'")]+)['"]?\s*\)/);
        if (m && m[1] !== 'extraTask') return { kind: 'work', key: String(m[1]).trim(), writerId: String(m[2]).trim(), workId: String(m[3]).trim() };

        m = text.match(/handleExtraTask(?:Dbl)?Click\(\s*event\s*,\s*['"]([^'"]+)['"]/);
        if (m) return { kind: 'extra', extraId: String(m[1]).trim() };

        m = text.match(/copyExtraTask\(\s*event\s*,\s*['"]([^'"]+)['"]/);
        if (m) return { kind: 'extra', extraId: String(m[1]).trim() };

        m = text.match(/drag\(\s*event\s*,\s*['"]extraTask['"]\s*,\s*null\s*,\s*['"]([^'"]+)['"]\s*\)/);
        if (m) return { kind: 'extra', extraId: String(m[1]).trim() };

        return null;
    }

    function getDateFromItem(item, fallback) {
        if (item.dataset.livV9Date) return item.dataset.livV9Date;

        const parent = item.closest('[id]');
        if (parent) {
            const m = String(parent.id || '').match(/(\d{4}-\d{2}-\d{2})/);
            if (m) return m[1];
        }

        return fallback || null;
    }

    function attrsForItem(item) {
        const attrs = [
            item.getAttribute('onclick'),
            item.getAttribute('ondblclick'),
            item.getAttribute('ondragstart'),
            item.getAttribute('oncontextmenu')
        ];

        const titleEl = item.querySelector('.evt-title, .week-evt-title, .clickable-title');
        if (titleEl) {
            attrs.push(titleEl.getAttribute('onclick'));
            attrs.push(titleEl.getAttribute('ondblclick'));
        }

        return attrs;
    }

    function findWorkByText(item, key, dateStr) {
        const titleEl = item.querySelector('.evt-title, .week-evt-title, .clickable-title') || item;
        const writerEl = item.querySelector('.evt-writer, .week-evt-writer');

        const title = cleanText(titleEl.textContent);
        const writerName = writerEl ? cleanText(writerEl.textContent) : '';

        for (const writer of livData.writers) {
            for (const work of (writer.works || [])) {
                const sameTitle = cleanText(work.title) === title;
                const sameWriter = !writerName || cleanText(writer.name) === writerName;
                const hasDate = getDateList(work, key).includes(dateStr);

                if (sameTitle && sameWriter && hasDate) {
                    return { kind: 'work', writerId: writer.id, workId: work.id, key, date: dateStr };
                }
            }
        }

        return null;
    }

    function findExtraByText(item, type, dateStr) {
        const titleEl = item.querySelector('.evt-title, .week-evt-title') || item;
        const writerEl = item.querySelector('.evt-writer, .week-evt-writer');

        const title = cleanText(titleEl.textContent);
        const writerName = writerEl ? cleanText(writerEl.textContent) : '';

        for (const task of livData.extraTasks) {
            if (!task || task.hidden || task.date !== dateStr) continue;
            if (type && normalizeType(task.type) !== type) continue;

            const rawTitle = cleanText(task.title);
            const labeledTitle = cleanText(`[${extraLabel(task.type)}] ${task.title}`);
            const sameTitle = rawTitle === title || labeledTitle === title;

            const writer = task.writerId ? getWriter(task.writerId) : null;
            const sameWriter = !writerName || (writer && cleanText(writer.name) === writerName);

            if (sameTitle && sameWriter) {
                return { kind: 'extra', extraId: task.id, date: dateStr };
            }
        }

        return null;
    }

    function getWorkTarget(item, fallbackDate) {
        const keyFromClass = detectWorkKey(item);
        if (!keyFromClass) return null;

        if (item.dataset.livV9Kind === 'work') {
            return {
                kind: 'work',
                writerId: item.dataset.livV9WriterId,
                workId: item.dataset.livV9WorkId,
                key: item.dataset.livV9Key,
                date: item.dataset.livV9Date || fallbackDate
            };
        }

        for (const attr of attrsForItem(item)) {
            const parsed = parseIds(attr);

            if (parsed && parsed.kind === 'work') {
                return {
                    kind: 'work',
                    writerId: parsed.writerId,
                    workId: parsed.workId,
                    key: parsed.key && WORK_KEYS[parsed.key] ? parsed.key : keyFromClass,
                    date: fallbackDate
                };
            }
        }

        return findWorkByText(item, keyFromClass, fallbackDate);
    }

    function getExtraTarget(item, fallbackDate) {
        const type = detectExtraType(item);
        if (!type) return null;

        if (item.dataset.livV9Kind === 'extra') {
            return {
                kind: 'extra',
                extraId: item.dataset.livV9ExtraId,
                date: item.dataset.livV9Date || fallbackDate
            };
        }

        for (const attr of attrsForItem(item)) {
            const parsed = parseIds(attr);
            if (parsed && parsed.kind === 'extra') {
                return { kind: 'extra', extraId: parsed.extraId, date: fallbackDate };
            }
        }

        return findExtraByText(item, type, fallbackDate);
    }

    function copyWork(target) {
        if (!target || !WORK_KEYS[target.key]) return;

        const found = getWork(target.writerId, target.workId);
        const work = found.work;
        const info = WORK_KEYS[target.key];

        if (!work) {
            alert('복사할 작품 일정을 찾지 못했어요.');
            return;
        }

        const sourceDate = target.date || work[target.key];

        if (!sourceDate) {
            alert('복사 기준 날짜를 찾지 못했어요.');
            return;
        }

        const targetDate = prompt(`"${work.title}" ${info.label} 일정을 어느 날짜로 복사할까요?`, nextDate(sourceDate, 1));
        if (!targetDate) return;

        if (!/^\d{4}-\d{2}-\d{2}$/.test(targetDate)) {
            alert('날짜는 2026-06-21처럼 입력해 주세요.');
            return;
        }

        const dates = getDateList(work, target.key);
        dates.push(sourceDate, targetDate);

        setDateList(work, target.key, dates);
        addCopiedWorkOccurrence(work, target.key, targetDate);

        save();
        rerenderCalendar();
    }

    function copyExtra(target) {
        if (!target || !target.extraId) return;

        const source = getExtra(target.extraId);

        if (!source) {
            alert('복사할 일정을 찾지 못했어요.');
            return;
        }

        if (source.fixed || source.systemSettlement) {
            alert('고정/시스템 일정은 복사하지 않는 편이 안전해요.');
            return;
        }

        const sourceDate = source.date || target.date;

        if (!sourceDate) {
            alert('복사 기준 날짜를 찾지 못했어요.');
            return;
        }

        const targetDate = prompt(`"${source.title || '일정'}" 일정을 어느 날짜로 복사할까요?`, nextDate(sourceDate, 1));
        if (!targetDate) return;

        if (!/^\d{4}-\d{2}-\d{2}$/.test(targetDate)) {
            alert('날짜는 2026-06-21처럼 입력해 주세요.');
            return;
        }

        const copied = JSON.parse(JSON.stringify(source));
        copied.id = makeId('extra_v9');
        copied.date = targetDate;
        copied.completed = false;
        copied.fixed = false;
        copied.systemSettlement = false;
        copied._livCopied = true;
        copied._livCopyV9 = true;
        copied._dailyCopySourceId = source.id;

        livData.extraTasks.push(copied);

        save();
        rerenderCalendar();
    }

    function deleteCopiedWork(target) {
        if (!target || !WORK_KEYS[target.key]) return false;

        const found = getWork(target.writerId, target.workId);
        const work = found.work;

        if (!work || !isCopiedWorkOccurrence(work, target.key, target.date)) return false;

        const info = WORK_KEYS[target.key];

        if (!confirm(`이 복사된 ${info.label} 일정을 삭제할까요?`)) return true;

        removeWorkOccurrence(work, target.key, target.date);

        save();
        rerenderCalendar();

        return true;
    }

    function deleteCopiedExtra(target) {
        if (!target || !target.extraId) return false;

        const task = getExtra(target.extraId);

        if (!isCopiedExtra(task)) return false;

        if (!confirm('이 복사된 일정을 삭제할까요?')) return true;

        livData.extraTasks = livData.extraTasks.filter(t => String(t.id) !== String(task.id));

        save();
        rerenderCalendar();

        return true;
    }

    function appendMissingWorkOccurrences(dateStr, containerId, view, filter) {
        const container = document.getElementById(containerId);
        if (!container || !ensureData()) return;

        const existing = new Set();

        container.querySelectorAll('.event-item, .week-evt-item').forEach(item => {
            const date = getDateFromItem(item, dateStr);
            const target = getWorkTarget(item, date);

            if (target && target.kind === 'work') {
                existing.add(`${target.writerId}:${target.workId}:${target.key}:${date}`);
            }
        });

        const currentFilter = filter || 'all';
        let html = '';

        livData.writers.forEach(writer => {
            (writer.works || []).forEach(work => {
                Object.keys(WORK_KEYS).forEach(key => {
                    const info = WORK_KEYS[key];

                    if (key === 'pubDate' && !(currentFilter === 'all' || currentFilter === 'pub')) return;
                    if (key === 'coverDate' && !(currentFilter === 'all' || currentFilter === 'cover')) return;
                    if ((key === 'proofDate' || key === 'proofDate2') && !(currentFilter === 'all' || currentFilter === 'proof')) return;

                    const dates = getDateList(work, key);

                    if (!dates.includes(dateStr)) return;

                    const unique = `${writer.id}:${work.id}:${key}:${dateStr}`;
                    if (existing.has(unique)) return;

                    if (work[key] === dateStr) return;

                    const itemClass = view === 'week-calendar' ? 'week-evt-item' : 'event-item';
                    const titleClass = view === 'week-calendar' ? 'week-evt-title' : 'evt-title';
                    const writerClass = view === 'week-calendar' ? 'week-evt-writer' : 'evt-writer';

                    html += `
                        <div class="${itemClass} ${info.cls}"
                             data-liv-v9-kind="work"
                             data-liv-v9-writer-id="${esc(writer.id)}"
                             data-liv-v9-work-id="${esc(work.id)}"
                             data-liv-v9-key="${esc(key)}"
                             data-liv-v9-date="${esc(dateStr)}">
                            <span class="${titleClass}">[${info.label}] ${esc(work.title)}</span>
                            <span class="${writerClass}">${esc(writer.name)}</span>
                        </div>
                    `;
                });
            });
        });

        if (html) container.insertAdjacentHTML('beforeend', html);
    }

    function markItems(dateStr, containerId, view, filter) {
        const container = document.getElementById(containerId);
        if (!container || !ensureData()) return;

        appendMissingWorkOccurrences(dateStr, containerId, view, filter);

        container.querySelectorAll('.event-item, .week-evt-item').forEach(item => {
            const date = getDateFromItem(item, dateStr);
            const workTarget = getWorkTarget(item, date);

            if (workTarget && workTarget.kind === 'work') {
                const found = getWork(workTarget.writerId, workTarget.workId);
                const work = found.work;
                const copied = work && isCopiedWorkOccurrence(work, workTarget.key, date);

                item.dataset.livV9Kind = 'work';
                item.dataset.livV9WriterId = workTarget.writerId;
                item.dataset.livV9WorkId = workTarget.workId;
                item.dataset.livV9Key = workTarget.key;
                item.dataset.livV9Date = date;
                item.dataset.livV9Copied = copied ? '1' : '0';

                item.classList.toggle('liv-v9-copied', !!copied);
                return;
            }

            const extraTarget = getExtraTarget(item, date);

            if (extraTarget && extraTarget.kind === 'extra') {
                const task = getExtra(extraTarget.extraId);
                const copied = isCopiedExtra(task);

                item.dataset.livV9Kind = 'extra';
                item.dataset.livV9ExtraId = extraTarget.extraId;
                item.dataset.livV9Date = date;
                item.dataset.livV9Copied = copied ? '1' : '0';

                item.classList.toggle('liv-v9-copied', !!copied);
            }
        });

        sortScheduleContainer(container);
    }

    function priority(item) {
        const text = cleanText(item.textContent);

        if (
            item.classList.contains('ev-settlement') ||
            text.includes('정산') ||
            text.includes('정산서') ||
            text.includes('정산금')
        ) {
            return 0;
        }

        for (let i = 1; i < ORDER.length; i++) {
            if (item.classList.contains(ORDER[i])) return i;
        }

        return 99;
    }

    function sortScheduleContainer(container) {
        if (!container) return;

        const items = Array.from(container.children).filter(el => {
            return el.classList && (
                el.classList.contains('event-item') ||
                el.classList.contains('week-evt-item')
            );
        });

        if (items.length < 2) return;

        const sorted = items
            .map((el, index) => ({ el, index, priority: priority(el) }))
            .sort((a, b) => {
                if (a.priority !== b.priority) return a.priority - b.priority;
                return a.index - b.index;
            });

        let changed = false;
        for (let i = 0; i < items.length; i++) {
            if (items[i] !== sorted[i].el) {
                changed = true;
                break;
            }
        }

        if (!changed) return;

        sorted.forEach(obj => container.appendChild(obj.el));
    }

    function rerenderCalendar() {
        const main = document.getElementById('main-view');

        try {
            if (currentView() === 'week-calendar' && typeof renderWeekCalendar === 'function') {
                renderWeekCalendar(main);
            } else if (typeof renderCalendar === 'function') {
                renderCalendar(main);
            }
        } catch (e) {
            console.warn('v9 rerender skipped', e);
        }
    }

    function patchChangeView() {
        if (typeof changeView !== 'function' || changeView.__livV9Patched) return;

        const original = changeView;

        changeView = function (viewName, param) {
            if (viewName === DAILY_VIEW) {
                setCurrentView(DAILY_VIEW);
                setActiveDailyNav();

                const main = document.getElementById('main-view');
                if (main) renderDaily(main);

                if (typeof closeSidebarMobile === 'function') {
                    try { closeSidebarMobile(); } catch (e) {}
                }

                return;
            }

            return original(viewName, param);
        };

        changeView.__livV9Patched = true;
        window.changeView = changeView;
    }

    function patchCalendarRenderers() {
        if (typeof updateTasksHtml === 'function' && !updateTasksHtml.__livV9Patched) {
            const original = updateTasksHtml;

            updateTasksHtml = function (dateStr, containerId, view, filter) {
                original(dateStr, containerId, view, filter);
                markItems(dateStr, containerId, view || 'calendar', filter || 'all');
            };

            updateTasksHtml.__livV9Patched = true;
            window.updateTasksHtml = updateTasksHtml;
        }

        if (typeof updateWeekTasksHtml === 'function' && !updateWeekTasksHtml.__livV9Patched) {
            const originalWeek = updateWeekTasksHtml;

            updateWeekTasksHtml = function (dateStr, containerId) {
                originalWeek(dateStr, containerId);
                markItems(dateStr, containerId, 'week-calendar', 'all');
            };

            updateWeekTasksHtml.__livV9Patched = true;
            window.updateWeekTasksHtml = updateWeekTasksHtml;
        }
    }

    document.addEventListener('dragstart', function () {
        isDragging = true;
    }, true);

    document.addEventListener('dragend', function () {
        setTimeout(() => { isDragging = false; }, 50);
    }, true);

    document.addEventListener('drop', function () {
        setTimeout(() => { isDragging = false; }, 50);
    }, true);

    document.addEventListener('contextmenu', function (event) {
        if (isDragging) return;

        const item = event.target.closest('.event-item, .week-evt-item');
        if (!item) return;

        const date = getDateFromItem(item);
        const workTarget = getWorkTarget(item, date);

        if (workTarget && workTarget.kind === 'work') {
            event.preventDefault();
            event.stopImmediatePropagation();
            copyWork(workTarget);
            return false;
        }

        const extraTarget = getExtraTarget(item, date);

        if (extraTarget && extraTarget.kind === 'extra') {
            event.preventDefault();
            event.stopImmediatePropagation();
            copyExtra(extraTarget);
            return false;
        }
    }, true);

    document.addEventListener('click', function (event) {
        const item = event.target.closest('.event-item, .week-evt-item');
        if (!item) return;

        const date = getDateFromItem(item);
        const workTarget = getWorkTarget(item, date);

        if (workTarget && workTarget.kind === 'work') {
            const handled = deleteCopiedWork(workTarget);

            if (handled) {
                event.preventDefault();
                event.stopImmediatePropagation();
                return false;
            }
        }

        const extraTarget = getExtraTarget(item, date);

        if (extraTarget && extraTarget.kind === 'extra') {
            const handled = deleteCopiedExtra(extraTarget);

            if (handled) {
                event.preventDefault();
                event.stopImmediatePropagation();
                return false;
            }
        }
    }, true);

    window.copyWorkDateTaskSafe = function (event, writerId, workId, key, sourceDate) {
        if (event) {
            event.preventDefault();
            event.stopImmediatePropagation();
        }

        copyWork({
            kind: 'work',
            writerId,
            workId,
            key,
            date: sourceDate
        });

        return false;
    };

    window.copyExtraTask = function (event, extraId) {
        if (event) {
            event.preventDefault();
            event.stopImmediatePropagation();
        }

        const task = getExtra(extraId);

        copyExtra({
            kind: 'extra',
            extraId,
            date: task ? task.date : null
        });

        return false;
    };

    window.livRemoveWorkOccurrence = function (titlePart, dateStr, key) {
        if (!ensureData()) return false;

        let removed = false;

        livData.writers.forEach(writer => {
            (writer.works || []).forEach(work => {
                if (!String(work.title || '').includes(titlePart)) return;

                const keys = key && WORK_KEYS[key] ? [key] : Object.keys(WORK_KEYS);

                keys.forEach(k => {
                    if (!getDateList(work, k).includes(dateStr)) return;
                    removeWorkOccurrence(work, k, dateStr);
                    removed = true;
                });
            });
        });

        if (removed) {
            save();
            rerenderCalendar();
        }

        return removed;
    };

    function markVisibleCalendar() {
        document.querySelectorAll('[id]').forEach(el => {
            const m = String(el.id || '').match(/(\d{4}-\d{2}-\d{2})/);
            if (m && el.querySelector && el.querySelector('.event-item, .week-evt-item')) {
                markItems(m[1], el.id, currentView(), 'all');
            }
        });
    }

    function install() {
        if (installed || !ready()) return;

        ensureData();
        addDailyMenu();
        patchChangeView();
        patchCalendarRenderers();

        installed = true;

        markVisibleCalendar();

        if (currentView() === DAILY_VIEW) {
            const main = document.getElementById('main-view');
            if (main) renderDaily(main);
        }
    }

    const timer = setInterval(function () {
        install();

        if (installed) clearInterval(timer);
    }, 300);

    const observer = new MutationObserver(function () {
        if (!installed) return;
        setTimeout(markVisibleCalendar, 60);
    });

    function start() {
        install();

        const root = document.getElementById('main-view') || document.body;
        try {
            observer.observe(root, { childList: true, subtree: true });
        } catch (e) {}

        setInterval(function () {
            if (currentView() === DAILY_VIEW) updateNowLine();
            markVisibleCalendar();
        }, 15000);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
    } else {
        start();
    }
})();
</script>

<!-- =========================================================
     ★ LIV 데일리 스케줄 22:00 종료 NO-BUFFER 통합 코드 v16
     - 데일리 스케줄 화면만 22:00까지 표시/등록 보정
     - MutationObserver / 반복 setInterval 미사용
     - 정산서 관련 일정은 수정하지 않음
========================================================= -->

        min-height: var(--liv-daily-22-height, 840px) !important;

        border: 1px solid #ffd4df;
        border-radius: 999px;
        padding: 1px 8px;
    }
</style>

<script>
(function () {
    const END_TIME = '22:00';
    const DEFAULT_START = '08:00';
    const MINUTE_HEIGHT = 2;

    let scheduled = false;
    let drawing = false;
    let patched = false;

    function ensureData() {
        if (typeof livData === 'undefined' || !livData) return false;

        if (!Array.isArray(livData.dailyTimeBlocks)) livData.dailyTimeBlocks = [];
        if (!livData.dailyStartTimes || typeof livData.dailyStartTimes !== 'object') livData.dailyStartTimes = {};

        return true;
    }

    function saveLiv() {
        try {
            if (typeof saveData === 'function') saveData();
        } catch (e) {}
    }

    function pad(n) {
        return String(n).padStart(2, '0');
    }

    function todayKst() {
        try {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Seoul',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).formatToParts(new Date());

            const data = {};
            parts.forEach(p => {
                if (p.type !== 'literal') data[p.type] = p.value;
            });

            return `${data.year}-${data.month}-${data.day}`;
        } catch (e) {
            const d = new Date();
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }
    }

    function nowKst() {
        try {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Seoul',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hourCycle: 'h23'
            }).formatToParts(new Date());

            const data = {};
            parts.forEach(p => {
                if (p.type !== 'literal') data[p.type] = p.value;
            });

            return {
                date: `${data.year}-${data.month}-${data.day}`,
                time: `${data.hour}:${data.minute}`,
                minutes: Number(data.hour) * 60 + Number(data.minute)
            };
        } catch (e) {
            const d = new Date();
            return {
                date: todayKst(),
                time: `${pad(d.getHours())}:${pad(d.getMinutes())}`,
                minutes: d.getHours() * 60 + d.getMinutes()
            };
        }
    }

    function timeToMin(value) {
        const p = String(value || DEFAULT_START).split(':');
        return Number(p[0] || 0) * 60 + Number(p[1] || 0);
    }

    function minToTime(min) {
        min = Math.round(Number(min || 0));
        const h = Math.floor(min / 60) % 24;
        const m = min % 60;
        return `${pad(h)}:${pad(m)}`;
    }

    function durationLabel(minutes) {
        minutes = Math.max(0, Math.round(Number(minutes || 0)));
        const h = Math.floor(minutes / 60);
        const m = minutes % 60;

        if (h && m) return `${h}시간 ${m}분`;
        if (h) return `${h}시간`;
        return `${m}분`;
    }

    function esc(v) {
        return String(v ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function isDailyScreen() {
        return !!document.querySelector('.daily-v9-shell, .daily-v9-grid, #daily-v9-layer');
    }

    function getDate() {
        const el = document.getElementById('daily-v9-date');
        return el && el.value ? el.value : (window.dailyV9Date || todayKst());
    }

    function getStart(date) {
        const input = document.getElementById('daily-v9-start');
        const inputVal = input && input.value ? input.value : '';

        if (ensureData()) {
            return inputVal || livData.dailyStartTimes[date] || DEFAULT_START;
        }

        return inputVal || DEFAULT_START;
    }

    function getStartMin(date) {
        return timeToMin(getStart(date));
    }

    function getEndMin() {
        return timeToMin(END_TIME);
    }

    function getHeight(date) {
        return Math.max(60, getEndMin() - getStartMin(date)) * MINUTE_HEIGHT;
    }

    function getBlocks(date) {
        if (!ensureData()) return [];

        const endLimit = getEndMin();
        let changed = false;

        /*
          정산서/월간 일정 extraTasks는 절대 건드리지 않음.
          데일리 시간표용 dailyTimeBlocks만 22:00 안으로 보정.
        */
        livData.dailyTimeBlocks = livData.dailyTimeBlocks.filter(block => {
            if (!block || block.date !== date) return true;

            const start = timeToMin(block.start);
            const end = timeToMin(block.end);

            if (start >= endLimit) {
                changed = true;
                return false;
            }

            if (end > endLimit) {
                block.end = END_TIME;
                changed = true;
            }

            if (timeToMin(block.end) <= start) {
                block.end = minToTime(Math.min(start + 60, endLimit));
                changed = true;
            }

            return timeToMin(block.end) > start;
        });

        if (changed) saveLiv();

        return livData.dailyTimeBlocks
            .filter(block => block && block.date === date)
            .sort((a, b) => timeToMin(a.start) - timeToMin(b.start));
    }

    function buildRows(date) {
        const start = getStartMin(date);
        const end = getEndMin();
        const rows = [];

        for (let t = start; t < end; t += 60) rows.push(t);
        if (!rows.includes(end)) rows.push(end);

        return rows.map(t => `
            <div class="daily-v9-row liv-daily-22-row" style="top:${Math.max(0, (t - start) * MINUTE_HEIGHT)}px; height:${t === end ? 1 : 120}px;">
                <div class="daily-v9-label">${minToTime(t)}</div>
                <div></div>
            </div>
        `).join('');
    }

    function buildBlocks(date) {
        const start = getStartMin(date);
        const end = getEndMin();

        return getBlocks(date).map(block => {
            const s = timeToMin(block.start);
            const e = Math.min(timeToMin(block.end), end);

            if (e <= start || s >= end) return '';

            const visibleStart = Math.max(s, start);
            const visibleEnd = Math.min(e, end);
            const top = Math.max(0, (visibleStart - start) * MINUTE_HEIGHT);
            const height = Math.max(30, (visibleEnd - visibleStart) * MINUTE_HEIGHT - 4);

            return `
                <div class="daily-v9-block ${esc(block.className || 'ev-task')}"
                     style="top:${top}px; height:${height}px;"
                     onclick="if(window.dailyV9OpenEditor) dailyV9OpenEditor('${esc(block.id)}')">
                    <div class="daily-v9-block-title">${esc(block.title || '일정')}</div>
                    <div class="daily-v9-block-meta">${esc(block.start)} ~ ${esc(block.end)} · ${durationLabel(e - s)}</div>
                    ${block.desc ? `<div class="daily-v9-block-desc">${esc(block.desc)}</div>` : ''}
                </div>
            `;
        }).join('');
    }

    function drawNowLine(date) {
        const line = document.getElementById('daily-v9-now-line');
        if (!line) return;

        const now = nowKst();
        const start = getStartMin(date);
        const end = getEndMin();

        if (date === now.date && now.minutes >= start && now.minutes <= end) {
            line.style.display = 'block';
            line.style.top = `${(now.minutes - start) * MINUTE_HEIGHT}px`;

            const label = line.querySelector('.daily-v9-now-label');
            if (label) label.textContent = `현재 ${now.time}`;
        } else {
            line.style.display = 'none';
        }
    }

    function drawEndLine(grid, height) {
        grid.querySelectorAll('.liv-daily-22-end-line').forEach(el => el.remove());

        const endLine = document.createElement('div');
        endLine.className = 'liv-daily-22-end-line';
        endLine.style.top = `${Math.max(0, height - 1)}px`;
        endLine.innerHTML = `
            <div class="liv-daily-22-end-label">22:00</div>
            <div class="liv-daily-22-end-text">일과 종료</div>
        `;

        grid.appendChild(endLine);
    }

    function updateTotal(date) {
        const totalEl = document.getElementById('daily-v9-total');
        if (!totalEl) return;

        const total = getBlocks(date).reduce((sum, block) => {
            return sum + Math.max(0, Math.min(timeToMin(block.end), getEndMin()) - timeToMin(block.start));
        }, 0);

        totalEl.textContent = `${date} 작업 합계 ${durationLabel(total)}`;
    }

    function drawDaily22() {
        if (drawing) return;
        if (!isDailyScreen()) return;

        const grid = document.querySelector('.daily-v9-grid');
        const layer = document.getElementById('daily-v9-layer');
        const empty = document.getElementById('daily-v9-empty');

        if (!grid || !layer) return;

        drawing = true;

        try {
            const date = getDate();
            const height = getHeight(date);

            grid.style.setProperty('--liv-daily-22-height', `${height}px`);
            grid.style.height = `${height}px`;
            grid.style.minHeight = `${height}px`;
            grid.style.position = 'relative';

            grid.querySelectorAll('.daily-v9-row').forEach(el => el.remove());
            grid.insertAdjacentHTML('afterbegin', buildRows(date));

            layer.style.height = `${height}px`;
            layer.innerHTML = buildBlocks(date);

            const blocks = getBlocks(date);
            if (empty) empty.style.display = blocks.length ? 'none' : 'block';

            drawEndLine(grid, height);
            drawNowLine(date);
            updateTotal(date);
        } finally {
            drawing = false;
        }
    }

    function scheduleDraw() {
        if (scheduled) return;

        scheduled = true;

        requestAnimationFrame(() => {
            scheduled = false;
            drawDaily22();
        });
    }

    function nextStart(date, sourceKey) {
        const startLimit = getStartMin(date);
        const endLimit = getEndMin();

        let last = startLimit;

        getBlocks(date).forEach(block => {
            if (sourceKey && block.sourceKey === sourceKey) return;

            const s = timeToMin(block.start);
            const e = Math.min(timeToMin(block.end), endLimit);

            if (s < endLimit && e > last) last = e;
        });

        return Math.max(startLimit, Math.min(last, endLimit));
    }

    function addBlock(date, title, minutes, cls, sourceKey) {
        if (!ensureData()) return false;

        const endLimit = getEndMin();
        const source = sourceKey || '';
        const start = nextStart(date, source);
        const end = Math.min(start + Math.max(5, Number(minutes || 60)), endLimit);

        if (start >= endLimit || end <= start) {
            alert('22:00 이후에는 더 이상 일정을 등록할 수 없어요.');
            scheduleDraw();
            return false;
        }

        const existing = source
            ? livData.dailyTimeBlocks.find(block => block && block.date === date && block.sourceKey === source)
            : null;

        if (existing) {
            existing.title = title || existing.title;
            existing.start = minToTime(start);
            existing.end = minToTime(end);
            existing.className = cls || existing.className || 'ev-task';
        } else {
            livData.dailyTimeBlocks.push({
                id: `daily_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
                date,
                title: title || '일정',
                desc: '',
                start: minToTime(start),
                end: minToTime(end),
                className: cls || 'ev-task',
                sourceKey: source
            });
        }

        saveLiv();
        scheduleDraw();

        return true;
    }

    function labelFor(cls) {
        const labels = {
            'ev-cover': '표지',
            'ev-proof1': '1교',
            'ev-proof2': '2교',
            'ev-pub': '출간',
            'ev-task': '일반',
            'ev-email': '메일',
            'ev-meeting': '미팅',
            'ev-settlement': '정산',
            'ev-personal': '개인',
            'ev-writing': '원고 작성',
            'ev-rest': '휴식'
        };

        return labels[cls] || '일정';
    }

    function patchDailyFunctions() {
        if (patched) return;
        patched = true;

        const oldChangeDate = window.dailyV9ChangeDate;
        const oldChangeStart = window.dailyV9ChangeStart;

        window.dailyV9RegisterSource = function (idx) {
            const sources = window.__dailyV9Sources || [];
            const item = sources[idx];

            if (!item) return false;

            const minEl = document.getElementById(`daily-v9-src-min-${idx}`);
            const minutes = minEl && minEl.value ? Number(minEl.value) : Number(item.defaultMinutes || 60);

            return addBlock(
                getDate(),
                item.title || '일정',
                minutes,
                item.className || 'ev-task',
                item.sourceKey || ''
            );
        };

        window.dailyV9AddManual = function () {
            const titleEl = document.getElementById('daily-v9-manual-title');
            const minEl = document.getElementById('daily-v9-manual-min');
            const typeEl = document.getElementById('daily-v9-manual-type');

            const rawTitle = titleEl && titleEl.value ? titleEl.value.trim() : '';
            const cls = typeEl && typeEl.value ? typeEl.value : 'ev-task';
            const title = `[${labelFor(cls)}] ${rawTitle || '직접 추가 일정'}`;
            const minutes = minEl && minEl.value ? Number(minEl.value) : 60;

            const ok = addBlock(getDate(), title, minutes, cls, '');

            if (ok && titleEl) titleEl.value = '';

            return ok;
        };

        window.dailyV9ChangeDate = function (date) {
            window.dailyV9Date = date || todayKst();

            if (typeof oldChangeDate === 'function' && oldChangeDate !== window.dailyV9ChangeDate) {
                try { oldChangeDate(window.dailyV9Date); } catch (e) {}
            }

            scheduleDraw();
        };

        window.dailyV9ChangeStart = function (start) {
            const date = getDate();

            if (ensureData()) {
                livData.dailyStartTimes[date] = start || DEFAULT_START;
                saveLiv();
            }

            if (typeof oldChangeStart === 'function' && oldChangeStart !== window.dailyV9ChangeStart) {
                try { oldChangeStart(start || DEFAULT_START); } catch (e) {}
            }

            scheduleDraw();
        };
    }

    function start() {
        patchDailyFunctions();

        setTimeout(scheduleDraw, 0);
        setTimeout(scheduleDraw, 120);
        setTimeout(scheduleDraw, 400);

        document.addEventListener('change', function (event) {
            if (!event.target) return;

            if (event.target.id === 'daily-v9-date' || event.target.id === 'daily-v9-start') {
                scheduleDraw();
            }
        }, true);

        document.addEventListener('click', function (event) {
            if (!event.target) return;

            const text = event.target.textContent || '';

            if (
                event.target.closest('.daily-v9-shell') ||
                text.includes('데일리') ||
                text.includes('등록') ||
                text.includes('삭제') ||
                text.includes('저장')
            ) {
                setTimeout(scheduleDraw, 80);
            }
        }, true);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
    } else {
        start();
    }
})();
</script>

<style>

        display: none;

        .daily-v9-left .daily-v9-mobile-toggle-head {
