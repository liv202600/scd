    c.innerHTML=`<div class="card" style="margin-bottom:20px;"><div style="display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;"><h2 style="margin:0;">매출</h2><input type="file" accept="application/pdf" multiple onchange="importSettlementPdfs(this.files)" class="input-text" style="height:auto!important; padding:8px; max-width:340px;"></div></div><div class="sales-summary-grid"><div class="sales-summary-box"><div class="sales-summary-label">전체 매출</div><div class="sales-summary-value">${won(totals.sales)}</div></div><div class="sales-summary-box"><div class="sales-summary-label">원천징수</div><div class="sales-summary-value">${won(totals.tax)}</div></div><div class="sales-summary-box"><div class="sales-summary-label">작가님 인세</div><div class="sales-summary-value">${won(totals.author)}</div></div><div class="sales-summary-box"><div class="sales-summary-label">출판사 이익</div><div class="sales-summary-value" style="color:var(--main-pink);">${won(totals.profit)}</div></div></div><div class="card"><h3 style="margin-top:0;">월별 성장세</h3><div class="sales-chart-wrap"><canvas id="sales-chart" height="280"></canvas></div></div><div class="card"><h3 style="margin-top:0;">월별 내역</h3>${monthKeys.length ? monthKeys.map(k=>`<div class="sales-month-card"><div class="sales-month-head"><div style="font-size:1.08rem; font-weight:900; color:var(--main-pink);">${k}</div><div style="display:flex; gap:8px; flex-wrap:wrap;"><button class="btn btn-del" onclick="openSalesDetailModal('${k}')">작품별 매출 보기</button><button class="btn btn-del" onclick="toggleSalesMonthSection('${k}','pdf')">PDF 목록 보기</button></div></div><div class="sales-metrics"><div class="sales-metric-box"><div class="k">매출</div><div class="v">${won(byMonth[k].sales)}</div></div><div class="sales-metric-box"><div class="k">원천징수</div><div class="v">${won(byMonth[k].tax)}</div></div><div class="sales-metric-box"><div class="k">작가 인세</div><div class="v">${won(byMonth[k].author)}</div></div><div class="sales-metric-box"><div class="k">출판사 이익</div><div class="v" style="color:var(--main-pink);">${won(byMonth[k].profit)}</div></div></div><div id="sales-pdf-${k}" class="sales-toggle-list">${byMonth[k].records.map(r=>`<div class="sales-file-item"><div><b>${escapeHtml(r.fileName)}</b><div style="font-size:.78rem; color:#666;">${escapeHtml(r.author||'')} / 정산액 합계 ${won(r.totalSettlement)} / 원천징수 ${won(r.tax)} / 작가 인세 ${won(r.authorPayout)}</div></div><button class="btn-del" onclick="deleteSalesRecord(${r.id})">삭제</button></div>`).join('')}</div></div>`).join('') : '<div style="color:#888; padding:20px 0;">등록된 매출 PDF가 없습니다.</div>'}</div>`;
    drawSalesChart(chartMonths,byMonth);
  };

  const previousChangeView = window.changeView;
  window.changeView = function(v, p=null) {
    ensureMonthlySettlementTasks();
    gwSetupUi();
    return previousChangeView(v,p);
  };

  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      gwSetupUi();
      ensureMonthlySettlementTasks();
      renderSidebarWriters();
      if(currentViewName === 'dashboard') changeView('dashboard');
    }, 200);
  });
})();
</script>

<script>
/* ===== LIV restore corrections after UI drift ===== */
(function(){
  const WT_STEPS = ['구두 확정', '계약서 작성 완료', '캐시트 전달 완료', '론칭 완료'];

  function safeWon(n) { return `${Math.round(Number(n || 0)).toLocaleString()}원`; }
  function baseWorkTitle(v) { return String(v || '').replace(/\s*\d+권\s*$/,'').replace(/[<>\[\]【】「」『』()（）\s]/g,'').toLowerCase(); }
  function getMainWorkCount(writer) { return (writer && writer.works ? writer.works : []).filter(w => !w.parentId).length; }
  function getWriterSalesTotal(writer) {
    if (!writer || !Array.isArray(livData.salesRecords)) return 0;
    const name = String(writer.name || '').trim();
    const titles = new Set((writer.works || []).map(w => baseWorkTitle(w.title)).filter(Boolean));
    let total = 0;
    livData.salesRecords.forEach(r => {
      if (name && String(r.author || '').trim() === name) { total += Number(r.totalSettlement || 0); return; }
      (r.works || []).forEach(w => { if (titles.has(baseWorkTitle(w.title))) total += Number(w.sales || 0); });
    });
    return total;
  }

  function addRestoreStyles() {
    if (document.getElementById('liv-restore-style')) return;
    const st = document.createElement('style');
    st.id = 'liv-restore-style';
    st.textContent = `
      .progress-stack { display:flex !important; flex-direction:row !important; gap:15px; overflow-x:auto; padding-bottom:10px; align-items:flex-start; }
      .progress-column { min-width:220px; background:var(--gray-light); padding:15px; border-radius:8px; }
      .work-action-group { display:flex !important; flex-direction:column !important; gap:6px !important; align-items:stretch !important; justify-content:center !important; }
      .work-action-group .btn-del { width:58px; }
      .mobile-del-btn { display:none; }
      .mobile-work-actions { display:flex; flex-direction:column; gap:4px; }
      .webtoon-card-grid { display:grid !important; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap:18px; align-items:start; }
      .webtoon-card { width:auto !important; min-height:0 !important; display:flex; flex-direction:column; gap:10px; }
      .webtoon-cover-frame { width:100%; aspect-ratio:3/4; border:1px solid #eee; border-radius:10px; background:#fafafa; overflow:hidden; display:flex; align-items:center; justify-content:center; }
      .webtoon-cover-frame img { width:100%; height:100%; object-fit:contain; display:block; }
      .webtoon-progress { display:grid !important; grid-template-columns: repeat(4, minmax(0, 1fr)); gap:6px !important; }
      .webtoon-progress .step { min-height:42px; border:1px solid #e7e7e7; background:#fafafa; color:#777; border-radius:8px; padding:4px 3px !important; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.2; word-break:keep-all; font-size:.67rem !important; font-weight:700; }
      .webtoon-progress .step.active { background:var(--soft-pink); color:var(--main-pink); border-color:var(--main-pink); }
      .sales-month-card { padding:18px; border:1px solid #eee; border-radius:12px; background:#fff; margin-bottom:16px; }
      .sales-month-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
      .sales-metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(135px,1fr)); gap:10px; }
      .sales-metric-box { background:#fff8fa; border:1px solid #ffd6df; border-radius:10px; padding:12px; }
      .sales-metric-box .k { font-size:.74rem; color:#777; font-weight:700; margin-bottom:6px; }
      .sales-metric-box .v { font-size:1rem; font-weight:900; color:#111; }
      .sales-toggle-list { display:none; margin-top:12px; border-top:1px dashed #eee; padding-top:12px; }
      .sales-toggle-list.show { display:block; }
      .sales-file-item { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:10px 0; border-top:1px solid #f0f0f0; }
      @media (max-width:1200px), (orientation:portrait) {
        .mobile-del-btn { display:block !important; position:absolute !important; top:15px !important; right:15px !important; z-index:10; }
        .mobile-title-wrap .clickable-title + .btn-del { display:none !important; }
        .webtoon-card-grid { grid-template-columns:1fr !important; }
        .webtoon-progress .step { font-size:.6rem !important; min-height:38px; letter-spacing:-.04em; }
      }
    `;
    document.head.appendChild(st);
  }

  const oldGwSetup = window.gwSetupUi;
  window.gwSetupUi = function() {
    if (typeof oldGwSetup === 'function') oldGwSetup();
    addRestoreStyles();
  };

  window.renderProgress = function(c) {
    if (typeof gwSetupUi === 'function') gwSetupUi();
    let msData = {}, cvData = {};
    msStatuses2.forEach(s => msData[s] = []);
    coverStatuses2.forEach(s => cvData[s] = []);
    livData.writers.forEach(w => (w.works || []).forEach(wk => {
      if (wk.msStatus === '출간 완료') return;
      if (wk.msStatus && msData[wk.msStatus]) msData[wk.msStatus].push({title:wk.title, writer:w.name, wId:w.id, workId:wk.id});
      if (wk.coverStatus && cvData[wk.coverStatus]) cvData[wk.coverStatus].push({title:wk.title, writer:w.name, wId:w.id, workId:wk.id});
    }));

    const isNarrow = window.matchMedia('(max-width: 1200px), (orientation: portrait)').matches;
    const title = currentProgressTab === 'ms' ? '📖 원고 진행 상황' : '🎨 표지 진행 상황';
    const data = currentProgressTab === 'ms' ? msData : cvData;
    const list = currentProgressTab === 'ms' ? msStatuses2 : coverStatuses2;
    const accent = currentProgressTab === 'ms' ? 'var(--main-pink)' : '#ffbba1';
    let html = `<h2 style="margin-bottom:15px;">작업 진척도 네비게이터</h2>
      <div style="display:flex; gap:10px; margin-bottom:20px;">
        <button class="btn ${currentProgressTab === 'ms' ? 'btn-black' : 'btn-del'}" onclick="switchProgressTab('ms')">📖 원고 진행 상황</button>
        <button class="btn ${currentProgressTab === 'cv' ? 'btn-black' : 'btn-del'}" onclick="switchProgressTab('cv')">🎨 표지 진행 상황</button>
      </div>
      <div class="card" style="margin-bottom:20px; padding:20px;"><h3 style="margin-top:0; border-bottom:2px solid ${accent}; padding-bottom:10px; color:var(--black);">${title}</h3>`;

    if (isNarrow) {
      html += `<div class="progress-accordion">`;
      let hasAny = false;
      list.forEach(s => {
        const items = data[s] || [];
        if (!items.length) return;
        hasAny = true;
        const key = `${currentProgressTab}:${s}`;
        const open = !!progressAccordionState[key];
        html += `<div class="progress-accordion-item ${open?'open':''}">
          <div class="progress-accordion-head" onclick="progressAccordionState['${key}']=!progressAccordionState['${key}']; renderProgress(document.getElementById('main-view'))"><span>${escapeHtml(s)}</span><span style="color:${currentProgressTab==='ms'?'var(--main-pink)':'#e07a5f'};">${items.length}건 ${open?'▲':'▼'}</span></div>
          <div class="progress-accordion-body">${items.map(item=>`<div class="progress-work-pill" onclick="event.stopPropagation(); openWorkPage(${item.wId}, ${item.workId})"><b>${escapeHtml(item.title)}</b><br><span style="font-size:.76rem; color:#666;">${escapeHtml(item.writer)}</span></div>`).join('')}</div>
        </div>`;
      });
      if (!hasAny) html += `<div style="color:#888; padding:10px;">진행 중인 항목이 없습니다.</div>`;
      html += `</div>`;
    } else {
      html += `<div class="progress-stack">`;
      let hasAny = false;
      list.forEach(s => {
        const items = data[s] || [];
        if (!items.length) return;
        hasAny = true;
        html += `<div class="progress-column" style="border-top:4px solid ${accent};">
          <h4 style="margin-top:0; font-size:.95rem; border-bottom:1px solid #ddd; padding-bottom:8px; color:#333;">${escapeHtml(s)} <span style="color:${currentProgressTab==='ms'?'var(--main-pink)':'#e07a5f'}; font-size:.8rem;">(${items.length})</span></h4>
          <div style="display:flex; flex-direction:column; gap:8px;">${items.map(item=>`<div onclick="openWorkPage(${item.wId}, ${item.workId})" style="cursor:pointer; font-size:.85rem; background:#fff; padding:10px; border-radius:6px; box-shadow:0 1px 3px rgba(0,0,0,.05);"><b>${escapeHtml(item.title)}</b><br><span style="color:#666; font-size:.75rem;">${escapeHtml(item.writer)}</span></div>`).join('')}</div>
        </div>`;
      });
      if (!hasAny) html += `<div style="color:#888; padding:10px;">진행 중인 항목이 없습니다.</div>`;
      html += `</div>`;
    }
    c.innerHTML = html + `</div>`;
  };

  window.getRowHtml = function(wId, w, isC) {
    const rc = isC ? 'row-child' : '', px = isC ? `<span class="child-indicator">└</span>` : '', bT = (w.title || '').replace(/\s*\d+권$/,'').replace(/'/g,"\\'");
    const msB = getStatusColor(w.msStatus,'ms'), cvB = getStatusColor(w.coverStatus,'cover');
    const coverSrc = getWorkCoverSrc(w);
    const sH = w.msStatus === '출간 완료'
      ? `<div class="platform-box" style="margin-top:0; padding:10px;"><div class="platform-box-title" style="margin-bottom:8px;"><span>론칭 플랫폼</span><button class="btn-del" style="height:22px; line-height:20px; font-size:.7rem;" onclick="revertStatus(${wId}, ${w.id})">상태 변경</button></div><div class="platform-grid">${platforms.map(p=>`<label><input type="checkbox" ${w.platforms&&w.platforms.includes(p)?'checked':''} onchange="togglePlatform(${wId}, ${w.id}, '${p}')"> ${p}</label>`).join('')}</div></div>`
      : `<div class="status-row"><span class="status-label">작업</span><select class="input-select" style="background-color:${msB}; font-weight:bold;" onchange="updateWork(${wId}, ${w.id}, 'msStatus', this.value)">${msStatuses2.map(s=>`<option ${w.msStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="status-row"><span class="status-label">표지</span><select class="input-select" style="background-color:${cvB}; font-weight:bold;" onchange="updateWork(${wId}, ${w.id}, 'coverStatus', this.value)">${coverStatuses2.map(s=>`<option ${w.coverStatus===s?'selected':''}>${s}</option>`).join('')}</select></div>`;
    const sqH = !isC ? `<select class="input-select" style="padding:0 6px; width:45px; height:28px!important;" onchange="updateWork(${wId}, ${w.id}, 'sequel', this.value)"><option value="N" ${w.sequel==='N'?'selected':''}>N</option><option value="Y" ${w.sequel==='Y'?'selected':''}>Y</option></select>${w.sequel==='Y'?`<button class="btn" style="background:#ddd; color:#333; height:28px!important; line-height:28px; padding:0 6px; font-size:.7rem;" onclick="addSequel(${wId}, ${w.id}, '${bT}')">생성</button>`:''}` : `<span style="color:#aaa; font-size:.7rem;">종속</span>`;
    return `<tr id="work-row-${w.id}" class="${rc}">
      <td>
        <div class="mobile-del-btn"><div class="mobile-work-actions"><button class="btn-del" onclick="deleteWork(${wId}, ${w.id})">삭제</button><button class="btn-del" onclick="openWorkEditModal(${wId}, ${w.id})">수정</button></div></div>
        <div style="display:flex; gap:12px; align-items:flex-start;"><label style="cursor:pointer; flex-shrink:0;"><img src="${coverSrc}" class="cover-thumb" id="thumb-${w.id}"><input type="file" style="display:none;" accept="image/*" onchange="uploadWorkCover(this, ${wId}, ${w.id})"></label><div class="mobile-title-wrap" style="display:flex; flex-direction:column; gap:6px; flex-grow:1;"><div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">${px}<span class="clickable-title" style="font-weight:800; font-size:.95rem; color:#222; word-break:keep-all; padding-top:4px;" onclick="openWorkPage(${wId}, ${w.id})">${escapeHtml(w.title)}</span></div><div class="mobile-only" style="flex-wrap:wrap; align-items:center; gap:6px; background:rgba(0,0,0,.03); padding:5px 8px; border-radius:4px; border:1px solid #eaeaea;"><span style="font-size:.75rem; font-weight:bold; color:#666;">인세:</span><input type="number" class="input-text" style="width:55px; height:28px!important;" value="${w.royalty}" onchange="updateWork(${wId}, ${w.id}, 'royalty', this.value)">%<span style="font-size:.75rem; font-weight:bold; color:#666; margin-left:5px;">후속:</span>${sqH}</div></div></div>
      </td>
      <td class="desktop-only-td"><input type="number" class="input-text" value="${w.royalty}" onchange="updateWork(${wId}, ${w.id}, 'royalty', this.value)"></td>
      <td class="desktop-only-td"><div style="display:flex; align-items:center; gap:5px;">${sqH}</div></td>
      <td>${sH}</td>
      <td><div class="date-grid-2x2"><div class="date-grid-item"><span class="date-grid-label">출간</span><input type="date" class="input-date" value="${w.pubDate||''}" onchange="updateWork(${wId}, ${w.id}, 'pubDate', this.value)"></div><div class="date-grid-item"><span class="date-grid-label">1교</span><input type="date" class="input-date" value="${w.proofDate||''}" onchange="updateWork(${wId}, ${w.id}, 'proofDate', this.value)"></div><div class="date-grid-item"><span class="date-grid-label">표지</span><input type="date" class="input-date" value="${w.coverDate||''}" onchange="updateWork(${wId}, ${w.id}, 'coverDate', this.value)"></div><div class="date-grid-item"><span class="date-grid-label">2교</span><input type="date" class="input-date" value="${w.proofDate2||''}" onchange="updateWork(${wId}, ${w.id}, 'proofDate2', this.value)"></div></div></td>
      <td class="desktop-only-td" style="text-align:center;"><div class="work-action-group"><button class="btn-del" onclick="openWorkEditModal(${wId}, ${w.id})">수정</button><button class="btn-del" onclick="deleteWork(${wId}, ${w.id})">삭제</button></div></td>
    </tr>`;
  };

  window.renderWebtoon = function(c) {
    if (typeof gwSetupUi === 'function') gwSetupUi();
    if(!livData.webtoons) livData.webtoons = [];
    c.innerHTML = `<div class="card" style="margin-bottom:20px;"><div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;"><h2 style="margin:0;">웹툰</h2><button class="btn btn-black" onclick="openWebtoonModal()">+ 웹툰 등록</button></div></div><div id="webtoon-list" class="webtoon-card-grid"></div>`;
    const box = document.getElementById('webtoon-list');
    if(!livData.webtoons.length) { box.innerHTML = `<div class="card" style="text-align:center; padding:40px; color:#888; width:100%;">등록된 웹툰 계약 작품이 없습니다.</div>`; return; }
    box.innerHTML = livData.webtoons.map(item => {
      const { writer, work } = getWorkRef(item.writerId, item.workId);
      const title = work ? work.title : (item.title || '미지정 작품');
      const writerName = writer ? writer.name : (item.writerName || '미상');
      const status = item.status === '1화 제작 완료' ? '론칭 완료' : (item.status || WT_STEPS[0]);
      const idx = Math.max(0, WT_STEPS.indexOf(status));
      return `<div class="card webtoon-card"><div class="webtoon-cover-frame"><img src="${getWebtoonCoverSrc(item)}" alt="대표 이미지"></div><div class="clickable-title" style="font-weight:900; font-size:1.03rem; line-height:1.4;" onclick="openWorkPage(${item.writerId}, ${item.workId})">${escapeHtml(title)}</div><div class="webtoon-info-box"><div><b>작가</b> ${escapeHtml(writerName)}</div><div><b>에이전시</b> ${escapeHtml(item.agency||'-')}</div><div><b>계약 비율</b> ${escapeHtml(item.ratio||'-')}</div><div><b>MG 수령일</b> ${item.mgDate||'-'}</div><div><b>MG 금액</b> ${item.mgAmount ? safeWon(item.mgAmount) : '-'}</div></div><div class="webtoon-progress">${WT_STEPS.map((s,i)=>`<span class="step ${i<=idx?'active':''}">${escapeHtml(s)}</span>`).join('')}</div><div style="display:flex; gap:8px; margin-top:auto;"><button class="btn btn-del" style="flex:1;" onclick="openWebtoonModal(${item.id})">수정</button><button class="btn-del" style="flex:1;" onclick="deleteWebtoon(${item.id})">삭제</button></div></div>`;
    }).join('');
  };

  window.openWebtoonModal = function(id=null) {
    if (typeof gwEnsureModals === 'function') gwEnsureModals();
    currentEditingWebtoon = id;
    const item = id ? (livData.webtoons || []).find(x => x.id === id) : null;
    const status = item && item.status === '1화 제작 완료' ? '론칭 완료' : (item?.status || WT_STEPS[0]);
    document.getElementById('webtoon-modal-title').innerText = item ? '웹툰 계약 수정' : '웹툰 계약 등록';
    document.getElementById('wt-modal-work').innerHTML = getAllWorkOptions();
    document.getElementById('wt-modal-status').innerHTML = WT_STEPS.map(s => `<option>${s}</option>`).join('');
    document.getElementById('wt-modal-work').value = item ? `${item.writerId}|${item.workId}` : '';
    document.getElementById('wt-modal-agency').value = item?.agency || '';
    document.getElementById('wt-modal-ratio').value = item?.ratio || '';
    document.getElementById('wt-modal-status').value = status;
    document.getElementById('wt-modal-mgdate').value = item?.mgDate || '';
    document.getElementById('wt-modal-mgamount').value = item?.mgAmount || '';
    document.getElementById('wt-modal-preview').src = getWebtoonCoverSrc(item || {});
    document.getElementById('webtoon-modal').classList.add('show');
  };

  window.renderSales = function(c) {
    if (typeof gwSetupUi === 'function') gwSetupUi();
    if(!livData.salesRecords) livData.salesRecords = [];
    const { totals, byMonth } = getSalesAggregates();
    const chartMonths = Object.keys(byMonth).sort();
    const monthKeys = [...chartMonths].sort((a,b)=>b.localeCompare(a));
    c.innerHTML = `<div class="card" style="margin-bottom:20px;"><div style="display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;"><h2 style="margin:0;">매출</h2><input type="file" accept="application/pdf" multiple onchange="importSettlementPdfs(this.files)" class="input-text" style="height:auto!important; padding:8px; max-width:340px;"></div></div>
      <div class="sales-summary-grid"><div class="sales-summary-box"><div class="sales-summary-label">전체 매출</div><div class="sales-summary-value">${safeWon(totals.sales)}</div></div><div class="sales-summary-box"><div class="sales-summary-label">원천징수</div><div class="sales-summary-value">${safeWon(totals.tax)}</div></div><div class="sales-summary-box"><div class="sales-summary-label">작가님 인세</div><div class="sales-summary-value">${safeWon(totals.author)}</div></div><div class="sales-summary-box"><div class="sales-summary-label">출판사 이익</div><div class="sales-summary-value" style="color:var(--main-pink);">${safeWon(totals.profit)}</div></div></div>
      <div class="card"><h3 style="margin-top:0;">월별 성장세</h3><div class="sales-chart-wrap"><canvas id="sales-chart" height="280"></canvas></div></div>
      <div class="card"><h3 style="margin-top:0;">월별 내역</h3>${monthKeys.length ? monthKeys.map(k => `<div class="sales-month-card"><div class="sales-month-head"><div style="font-size:1.08rem; font-weight:900; color:var(--main-pink);">${k}</div><div style="display:flex; gap:8px; flex-wrap:wrap;"><button class="btn btn-del" onclick="openSalesDetailModal('${k}')">작품별 매출 보기</button><button class="btn btn-del" onclick="toggleSalesMonthSection('${k}','pdf')">PDF 목록 보기</button></div></div><div class="sales-metrics"><div class="sales-metric-box"><div class="k">매출</div><div class="v">${safeWon(byMonth[k].sales)}</div></div><div class="sales-metric-box"><div class="k">원천징수</div><div class="v">${safeWon(byMonth[k].tax)}</div></div><div class="sales-metric-box"><div class="k">작가 인세</div><div class="v">${safeWon(byMonth[k].author)}</div></div><div class="sales-metric-box"><div class="k">출판사 이익</div><div class="v" style="color:var(--main-pink);">${safeWon(byMonth[k].profit)}</div></div></div><div id="sales-pdf-${k}" class="sales-toggle-list">${byMonth[k].records.map(r => `<div class="sales-file-item"><div><b>${escapeHtml(r.fileName)}</b><div style="font-size:.78rem; color:#666;">${escapeHtml(r.author||'')} / 정산액 합계 ${safeWon(r.totalSettlement)} / 원천징수 ${safeWon(r.tax)} / 작가 인세 ${safeWon(r.authorPayout)}</div></div><button class="btn-del" onclick="deleteSalesRecord(${r.id})">삭제</button></div>`).join('')}</div></div>`).join('') : '<div style="color:#888; padding:20px 0;">등록된 매출 PDF가 없습니다.</div>'}</div>`;
    drawSalesChart(chartMonths, byMonth);
  };

  window.copyExtraTask = function(event, taskId) {
    if (event) { event.preventDefault(); event.stopPropagation(); }
    const task = (livData.extraTasks || []).find(t => String(t.id) === String(taskId) && !t.fixed && !t.systemSettlement);
    if (!task) return;
    const clone = JSON.parse(JSON.stringify(task));
    clone.id = Date.now() + Math.floor(Math.random() * 10000);
    clone.completed = false;
    livData.extraTasks.push(clone);
    copiedExtraTask = JSON.parse(JSON.stringify(task));
    saveData();
    if (currentViewName === 'calendar') renderCalendar(document.getElementById('main-view'));
    else if (currentViewName === 'week-calendar') renderWeekCalendar(document.getElementById('main-view'));
    else if (currentViewName === 'dashboard') renderDashboard(document.getElementById('main-view'));
    else changeView(currentViewName, currentViewParam);
  };

  window.renderSidebarWriters = function() {
    const el = document.getElementById('sidebar-writer-list');
    if (!el) return;
    el.innerHTML = getSortedWriters().map(w => `<div class="writer-sub-item" onclick="changeView('writer', ${w.id})">${escapeHtml(w.name)} (${getMainWorkCount(w)})</div>`).join('');
  };

  window.renderFilteredWriters = function() {
    let lst = JSON.parse(JSON.stringify(getSortedWriters()));
    if(currentWriterFilter) lst = lst.filter(w => w.id === currentWriterFilter);
    if(currentSearchText) lst = lst.map(w => {
      if(w.name.toLowerCase().includes(currentSearchText)) return w;
      const m = (w.works || []).filter(wk => wk.title.toLowerCase().includes(currentSearchText));
      if(m.length > 0) { w.works = m; return w; }
      return null;
    }).filter(Boolean);
    const c = document.getElementById('writers-container');
    if(lst.length === 0) return c.innerHTML = `<div class="card" style="text-align:center; padding:40px; color:#888;">결과가 없습니다.</div>`;
    let h = '';
    lst.forEach(w => {
      const original = (livData.writers || []).find(x => x.id === w.id) || w;
      const pStyle = w.proofStyle || '정보 없음', eTime = w.emailTime || '정보 없음';
      h += `<div style="display:flex; flex-direction:column; gap:10px;"><div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; padding:20px; margin-bottom:0; background:var(--soft-pink); border:2px solid var(--main-pink);"><div><h2 style="margin:0; margin-bottom:8px;">${escapeHtml(w.name)} <span style="font-size:.9rem; color:#777;">(${getMainWorkCount(original)}작품)</span></h2><div style="font-size:.85rem; font-weight:bold; color:var(--main-pink);"><span>${escapeHtml(pStyle)}</span><span style="margin-left:12px;">${escapeHtml(eTime)}</span><span style="margin-left:12px; color:#111;">누적 매출 ${safeWon(getWriterSalesTotal(original))}</span></div></div><div style="display:flex; gap:8px;"><button class="btn btn-black" onclick="addWork(${w.id})">+ 새 작품 추가</button><button class="btn-del" style="height:32px; line-height:30px;" onclick="deleteWriter(${w.id})">계정 삭제</button></div></div><div class="card" style="padding:0; border:none; box-shadow:none; background:transparent; margin-bottom:0;"><div class="table-wrap"><table class="liv-table"><thead><tr><th style="width:32%;">표지 / 작품명</th><th class="desktop-only-td" style="width:8%;">인세</th><th class="desktop-only-td" style="width:10%;">후속권</th><th style="width:20%;">상태</th><th style="width:25%;">일정</th><th class="desktop-only-td" style="width:5%; text-align:center;">관리</th></tr></thead><tbody>${generateWorkRows(w)}</tbody></table></div></div></div>`;
    });
    c.innerHTML = h;
  };

  const prevChangeView = window.changeView;
  window.changeView = function(v, p=null) {
    if (typeof gwSetupUi === 'function') gwSetupUi();
    return prevChangeView(v, p);
  };

  document.addEventListener('DOMContentLoaded', () => setTimeout(() => {
    if (typeof gwSetupUi === 'function') gwSetupUi();
    renderSidebarWriters();
    if (currentViewName === 'progress') renderProgress(document.getElementById('main-view'));
  }, 150));
})();
</script>


<script>
/* ===== LIV strict requested fixes only ===== */
(function(){
  const WT_STEPS_FIXED = ['구두 계약', '계약 완료', '캐시트 확인', '론칭 완료'];
  const WT_STATUS_MAP = {
    '구두 확정': '구두 계약',
    '계약서 작성 완료': '계약 완료',
    '캐시트 전달 완료': '캐시트 확인',
    '1화 제작 완료': '론칭 완료'
  };

  function normalizeWtStatus(status) {
    return WT_STATUS_MAP[status] || status || WT_STEPS_FIXED[0];
  }

  function livRequestedFixStyles() {
    if (document.getElementById('liv-requested-fixes-style')) return;
    const st = document.createElement('style');
    st.id = 'liv-requested-fixes-style';
    st.textContent = `

      button[onclick^="addWork("],
      button[onclick^="deleteWriter("] {
        width: 116px !important;
        height: 32px !important;
        line-height: 30px !important;
        text-align: center !important;
        padding: 0 8px !important;
      }

      .webtoon-cover-frame {
        width: 100% !important;
        aspect-ratio: 3 / 4 !important;
        border: 1px solid #eee;
        border-radius: 10px;
        background: #fafafa;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .webtoon-cover-frame img {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
        image-rendering: auto !important;
        display: block;
      }
      .webtoon-progress {
        display: grid !important;
        grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
        gap: 6px !important;
      }
      .webtoon-progress .step {
        min-height: 38px !important;
        padding: 5px 3px !important;
        border: 1px solid #e7e7e7 !important;
        border-radius: 8px !important;
        background: #fafafa !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        text-align: center !important;
        white-space: nowrap !important;
        line-height: 1.1 !important;
        font-size: .66rem !important;
        font-weight: 800 !important;
        letter-spacing: -0.05em !important;
      }
      .webtoon-progress .step.active {
        background: var(--soft-pink) !important;
        color: var(--main-pink) !important;
        border-color: var(--main-pink) !important;
      }

      #sales-detail-modal .modal-content.large,
      #sales-detail-modal .modal-content {
        width: min(920px, calc(100vw - 36px)) !important;
        max-width: 920px !important;
      }
      .sales-detail-scroll {
        overflow-x: auto;
        width: 100%;
      }
      .sales-detail-table {
        min-width: 720px;
        width: 100%;
        border-collapse: collapse;
        font-size: .86rem;
      }
      .sales-detail-table th,
      .sales-detail-table td {
        padding: 10px 12px;
        border-bottom: 1px solid #eee;
        text-align: left;
        white-space: nowrap;
      }
      .sales-detail-table th {
        color: #777;
        font-weight: 800;
        background: #fafafa;
      }

      @media (max-width: 1200px), (orientation: portrait) {
        .main-container.view-calendar .holiday-name {
          display: none !important;
        }
        .progress-accordion {
          display: flex !important;
          flex-direction: column !important;
          gap: 10px !important;
        }
        .progress-accordion-item {
          border: 1px solid #eee;
          border-radius: 10px;
          overflow: hidden;
          background: #fff;
        }
        .progress-accordion-head {
          padding: 14px 16px;
          font-weight: 800;
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 10px;
          cursor: pointer;
        }
        .progress-accordion-body {
          display: none;
          padding: 0 12px 12px;
        }
        .progress-accordion-item.open .progress-accordion-body {
          display: block;
        }
        .progress-work-pill {
          background: #fafafa;
          border: 1px solid #eee;
          border-radius: 8px;
          padding: 10px 12px;
          margin-top: 8px;
          cursor: pointer;
        }
        .sales-detail-table {
          min-width: 640px;
          font-size: .74rem;
        }
        .sales-detail-table th,
        .sales-detail-table td {
          padding: 8px 9px;
        }
      }
    `;
    document.head.appendChild(st);
  }

  const previousSetup = window.gwSetupUi;
  window.gwSetupUi = function() {
    if (typeof previousSetup === 'function') previousSetup();
    livRequestedFixStyles();
  };

  window.renderProgress = function(c) {
    if (typeof gwSetupUi === 'function') gwSetupUi();

    const accState = window.__livProgressAccordionState || (window.__livProgressAccordionState = {});
    let msData = {}, cvData = {};
    msStatuses2.forEach(s => msData[s] = []);
    coverStatuses2.forEach(s => cvData[s] = []);

    livData.writers.forEach(w => (w.works || []).forEach(wk => {
      if (wk.msStatus === '출간 완료') return;
      if (wk.msStatus && msData[wk.msStatus]) msData[wk.msStatus].push({ title:wk.title, writer:w.name, wId:w.id, workId:wk.id });
      if (wk.coverStatus && cvData[wk.coverStatus]) cvData[wk.coverStatus].push({ title:wk.title, writer:w.name, wId:w.id, workId:wk.id });
    }));

    const isNarrow = window.matchMedia('(max-width: 1200px), (orientation: portrait)').matches;
    const isMs = currentProgressTab === 'ms';
    const title = isMs ? '📖 원고 진행 상황' : '🎨 표지 진행 상황';
    const data = isMs ? msData : cvData;
    const list = isMs ? msStatuses2 : coverStatuses2;
    const accent = isMs ? 'var(--main-pink)' : '#ffbba1';

    let html = `<h2 style="margin-bottom:15px;">작업 진척도 네비게이터</h2>
      <div style="display:flex; gap:10px; margin-bottom:20px;">
        <button class="btn ${isMs ? 'btn-black' : 'btn-del'}" onclick="switchProgressTab('ms')">📖 원고 진행 상황</button>
        <button class="btn ${!isMs ? 'btn-black' : 'btn-del'}" onclick="switchProgressTab('cv')">🎨 표지 진행 상황</button>
      </div>
      <div class="card" style="margin-bottom:20px; padding:20px;">
        <h3 style="margin-top:0; border-bottom:2px solid ${accent}; padding-bottom:10px; color:var(--black);">${title}</h3>`;

    if (isNarrow) {
      html += `<div class="progress-accordion">`;
      let hasAny = false;
      list.forEach(s => {
        const items = data[s] || [];
        if (!items.length) return;
        hasAny = true;
        const key = `${currentProgressTab}:${s}`;
        const open = !!accState[key];
        html += `<div class="progress-accordion-item ${open ? 'open' : ''}">
          <div class="progress-accordion-head" onclick="window.__livProgressAccordionState['${key}']=!window.__livProgressAccordionState['${key}']; renderProgress(document.getElementById('main-view'))">
            <span>${escapeHtml(s)}</span>
            <span style="color:${isMs ? 'var(--main-pink)' : '#e07a5f'};">${items.length}건 ${open ? '▲' : '▼'}</span>
          </div>
          <div class="progress-accordion-body">
            ${items.map(item => `<div class="progress-work-pill" onclick="event.stopPropagation(); openWorkPage(${item.wId}, ${item.workId})"><b>${escapeHtml(item.title)}</b><br><span style="font-size:.76rem; color:#666;">${escapeHtml(item.writer)}</span></div>`).join('')}
          </div>
        </div>`;
      });
      if (!hasAny) html += `<div style="color:#888; padding:10px;">진행 중인 항목이 없습니다.</div>`;
      html += `</div>`;
    } else {
      html += `<div style="display:flex; overflow-x:auto; gap:15px; padding-bottom:10px; align-items:flex-start;">`;
      let hasAny = false;
      list.forEach(s => {
        const items = data[s] || [];
        if (!items.length) return;
        hasAny = true;
        html += `<div style="min-width:220px; background:var(--gray-light); padding:15px; border-radius:8px; border-top:4px solid ${accent};">
          <h4 style="margin-top:0; font-size:.95rem; border-bottom:1px solid #ddd; padding-bottom:8px; color:#333;">${escapeHtml(s)} <span style="color:${isMs ? 'var(--main-pink)' : '#e07a5f'}; font-size:.8rem;">(${items.length})</span></h4>
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${items.map(item => `<div onclick="openWorkPage(${item.wId}, ${item.workId})" style="cursor:pointer; font-size:.85rem; background:#fff; padding:10px; border-radius:6px; box-shadow:0 1px 3px rgba(0,0,0,.05);"><b>${escapeHtml(item.title)}</b><br><span style="color:#666; font-size:.75rem;">${escapeHtml(item.writer)}</span></div>`).join('')}
          </div>
        </div>`;
      });
      if (!hasAny) html += `<div style="color:#888; padding:10px;">진행 중인 항목이 없습니다.</div>`;
      html += `</div>`;
    }

    c.innerHTML = html + `</div>`;
  };

  window.uploadWebtoonImage = function(inp, id) {
    if (inp.files && inp.files[0]) {
      const r = new FileReader();
      r.onload = e => {
        const item = (livData.webtoons || []).find(x => x.id === id);
        if (item) item.image = e.target.result;
        saveData();
        changeView('webtoon');
      };
      r.readAsDataURL(inp.files[0]);
    }
  };

  window.handleWebtoonModalFile = function(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      document.getElementById('wt-modal-preview').src = ev.target.result;
      document.getElementById('webtoon-modal').dataset.tempImage = ev.target.result;
    };
    r.readAsDataURL(file);
  };

  window.renderWebtoon = function(c) {
    if (typeof gwSetupUi === 'function') gwSetupUi();
    if (!livData.webtoons) livData.webtoons = [];

    c.innerHTML = `<div class="card" style="margin-bottom:20px;"><div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;"><h2 style="margin:0;">웹툰</h2><button class="btn btn-black" onclick="openWebtoonModal()">+ 웹툰 등록</button></div></div><div id="webtoon-list" class="webtoon-card-grid"></div>`;
    const box = document.getElementById('webtoon-list');
    if (!livData.webtoons.length) {
      box.innerHTML = `<div class="card" style="text-align:center; padding:40px; color:#888; width:100%;">등록된 웹툰 계약 작품이 없습니다.</div>`;
      return;
    }

    box.innerHTML = livData.webtoons.map(item => {
      const { writer, work } = getWorkRef(item.writerId, item.workId);
      const title = work ? work.title : (item.title || '미지정 작품');
      const writerName = writer ? writer.name : (item.writerName || '미상');
      const status = normalizeWtStatus(item.status);
      const idx = Math.max(0, WT_STEPS_FIXED.indexOf(status));
      const img = typeof getWebtoonCoverSrc === 'function' ? getWebtoonCoverSrc(item) : (item.image || (typeof DEFAULT_WORK_COVER !== 'undefined' ? DEFAULT_WORK_COVER : ''));
      return `<div class="card webtoon-card">
        <div class="webtoon-cover-frame"><img src="${img}" alt="대표 이미지"></div>
        <div class="clickable-title" style="font-weight:900; font-size:1.03rem; line-height:1.4;" onclick="openWorkPage(${item.writerId}, ${item.workId})">${escapeHtml(title)}</div>
        <div class="webtoon-info-box"><div><b>작가</b> ${escapeHtml(writerName)}</div><div><b>에이전시</b> ${escapeHtml(item.agency||'-')}</div><div><b>계약 비율</b> ${escapeHtml(item.ratio||'-')}</div><div><b>MG 수령일</b> ${item.mgDate||'-'}</div><div><b>MG 금액</b> ${item.mgAmount ? formatWon(item.mgAmount) : '-'}</div></div>
        <div class="webtoon-progress">${WT_STEPS_FIXED.map((s,i)=>`<span class="step ${i<=idx?'active':''}">${escapeHtml(s)}</span>`).join('')}</div>
        <div style="display:flex; gap:8px; margin-top:auto;"><button class="btn btn-del" style="flex:1;" onclick="openWebtoonModal(${item.id})">수정</button><button class="btn-del" style="flex:1;" onclick="deleteWebtoon(${item.id})">삭제</button></div>
      </div>`;
    }).join('');
  };

  window.openWebtoonModal = function(id=null) {
    if (typeof gwEnsureModals === 'function') gwEnsureModals();
    currentEditingWebtoon = id;
    const item = id ? (livData.webtoons || []).find(x => x.id === id) : null;

    document.getElementById('webtoon-modal-title').innerText = item ? '웹툰 계약 수정' : '웹툰 계약 등록';
    document.getElementById('wt-modal-work').innerHTML = getAllWorkOptions();
    document.getElementById('wt-modal-status').innerHTML = WT_STEPS_FIXED.map(s => `<option>${s}</option>`).join('');
    document.getElementById('wt-modal-work').value = item ? `${item.writerId}|${item.workId}` : '';
    document.getElementById('wt-modal-agency').value = item?.agency || '';
    document.getElementById('wt-modal-ratio').value = item?.ratio || '';
    document.getElementById('wt-modal-status').value = normalizeWtStatus(item?.status);
    document.getElementById('wt-modal-mgdate').value = item?.mgDate || '';
    document.getElementById('wt-modal-mgamount').value = item?.mgAmount || '';
    document.getElementById('wt-modal-preview').src = item ? (typeof getWebtoonCoverSrc === 'function' ? getWebtoonCoverSrc(item) : item.image) : (typeof DEFAULT_WORK_COVER !== 'undefined' ? DEFAULT_WORK_COVER : '');
    document.getElementById('webtoon-modal').classList.add('show');
  };

  window.saveWebtoonModal = function() {
    const val = document.getElementById('wt-modal-work').value;
    if (!val) return alert('작품을 선택하세요.');
    const [wId, workId] = val.split('|').map(Number);
    const { writer, work } = getWorkRef(wId, workId);
    if (!writer || !work) return alert('작품 정보를 찾을 수 없습니다.');
    if (!livData.webtoons) livData.webtoons = [];

    const payload = {
      writerId: wId,
      workId,
      writerName: writer.name,
      title: work.title,
      agency: document.getElementById('wt-modal-agency').value.trim(),
      ratio: document.getElementById('wt-modal-ratio').value.trim(),
      status: document.getElementById('wt-modal-status').value,
      mgDate: document.getElementById('wt-modal-mgdate').value,
      mgAmount: document.getElementById('wt-modal-mgamount').value,
      image: document.getElementById('webtoon-modal').dataset.tempImage || ''
    };

    if (currentEditingWebtoon) {
      const item = livData.webtoons.find(x => x.id === currentEditingWebtoon);
      if (item) Object.assign(item, payload, { image: payload.image || item.image || '' });
    } else {
      livData.webtoons.push({ id: Date.now(), ...payload });
    }
    saveData();
    closeWebtoonModal();
    changeView('webtoon');
  };

  window.openSalesDetailModal = function(month) {
    if (typeof gwSetupUi === 'function') gwSetupUi();
    const data = getSalesAggregates().byMonth[month];
    if (!data) return;
    const works = Object.entries(data.works).sort((a,b)=>b[1]-a[1]);

    document.getElementById('sales-detail-title').innerText = `${month} 작품별 매출 상세`;
    document.getElementById('sales-detail-body').innerHTML = `
      <div class="sales-detail-scroll">

/* ===== LIV exact mobile-only fixes: writer sales / webtoon mobile list / 500KB image / sales mobile detail ===== */
(function(){
  const WT_STEPS_MOBILE = ['구두 계약', '계약 완료', '캐시트 확인', '론칭 완료'];

    '구두 확정': '구두 계약',
    '계약서 작성 완료': '계약 완료',
    '캐시트 전달 완료': '캐시트 확인',
    '1화 제작 완료': '론칭 완료'
  };

  function isRealMobile() {
    return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
  }

  function normalizeWt(v) {
    return WT_MAP_MOBILE[v] || v || WT_STEPS_MOBILE[0];
  }

  function wonMobile(n) {
    return `${Math.round(Number(n || 0)).toLocaleString()}원`;
  }

  async function compressImageTo500KB(file) {
    const maxBytes = 500 * 1024;
    const originalDataUrl = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file);
    });

    if (file.size <= maxBytes) return originalDataUrl;

    const img = await new Promise((resolve) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.src = originalDataUrl;
    });

    let width = img.naturalWidth || img.width;
    let height = img.naturalHeight || img.height;
    let quality = 0.92;
    let best = originalDataUrl;

    for (let i = 0; i < 14; i++) {
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(width));
      canvas.height = Math.max(1, Math.round(height));
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      const bytes = Math.ceil((dataUrl.length - 'data:image/jpeg;base64,'.length) * 3 / 4);

      if (bytes <= maxBytes) return dataUrl;
      best = dataUrl;

      if (quality > 0.72) quality -= 0.08;
      else {
        width *= 0.9;
        height *= 0.9;
        quality = 0.82;
      }
    }

    return best;
  }

<script>
/* ===== LIV exact fix: webtoon image edit + 300px preview only ===== */
(function(){
  async function resizeWebtoonPreviewTo300(file) {
    const originalDataUrl = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file);
    });

    const img = await new Promise((resolve) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.src = originalDataUrl;
    });

    const sourceW = img.naturalWidth || img.width;
    const sourceH = img.naturalHeight || img.height;
    if (!sourceW || !sourceH) return originalDataUrl;

    const targetW = 300;
    const ratio = targetW / sourceW;
    const targetH = Math.max(1, Math.round(sourceH * ratio));

    const canvas = document.createElement('canvas');
    canvas.width = targetW;
    canvas.height = targetH;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, targetW, targetH);

    return canvas.toDataURL('image/jpeg', 0.82);
  }

  function applyWebtoonPreviewSize() {
    const preview = document.getElementById('wt-modal-preview');
    if (!preview) return;
    preview.style.width = '300px';
    preview.style.maxWidth = '100%';
    preview.style.height = 'auto';
    preview.style.aspectRatio = '3 / 4';
    preview.style.objectFit = 'contain';
    preview.style.background = '#fafafa';
  }

  const previousOpenWebtoonModal = window.openWebtoonModal;
  window.openWebtoonModal = function(id=null) {
    if (typeof previousOpenWebtoonModal === 'function') previousOpenWebtoonModal(id);
    const modal = document.getElementById('webtoon-modal');
    if (modal) delete modal.dataset.tempImage;
    applyWebtoonPreviewSize();
  };

  window.handleWebtoonModalFile = async function(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const dataUrl = await resizeWebtoonPreviewTo300(file);
    const preview = document.getElementById('wt-modal-preview');
    if (preview) {
      preview.src = dataUrl;
      applyWebtoonPreviewSize();
    }
    const modal = document.getElementById('webtoon-modal');
    if (modal) modal.dataset.tempImage = dataUrl;
  };

  window.uploadWebtoonImage = async function(inp, id) {
    if (!inp.files || !inp.files[0]) return;
    const dataUrl = await resizeWebtoonPreviewTo300(inp.files[0]);
    const item = (livData.webtoons || []).find(x => String(x.id) === String(id));
    if (item) item.image = dataUrl;
    try { localStorage.setItem('liv_webtoons_backup', JSON.stringify(livData.webtoons || [])); } catch(e) {}
    if (typeof saveData === 'function') saveData();
    if (currentViewName === 'webtoon') renderWebtoon(document.getElementById('main-view'));
  };

  window.saveWebtoonModal = function() {
    const workSelect = document.getElementById('wt-modal-work');
    if (!workSelect || !workSelect.value) return alert('작품을 선택하세요.');

    const [writerId, workId] = workSelect.value.split('|').map(Number);
    const ref = getWorkRef(writerId, workId);
    if (!ref.writer || !ref.work) return alert('작품 정보를 찾을 수 없습니다.');

    if (!Array.isArray(livData.webtoons)) livData.webtoons = [];
    const modal = document.getElementById('webtoon-modal');
    const newImage = modal ? (modal.dataset.tempImage || '') : '';

    const editing = currentEditingWebtoon !== null && currentEditingWebtoon !== undefined && currentEditingWebtoon !== '';
    const existing = editing ? livData.webtoons.find(x => String(x.id) === String(currentEditingWebtoon)) : null;

    const payload = {
      writerId,
      workId,

<script>
/* ===== LIV exact fix: remove duplicate settlement schedules only ===== */
(function(){
  const SETTLEMENT_TITLES = new Set(['정산서 발송', '작가 인세 지급']);

  function settlementIsSystemTask(task) {
    if (!task || task.type !== 'ev-settlement' || !SETTLEMENT_TITLES.has(task.title)) return false;
    const id = String(task.id || '');
    return !!task.fixed || !!task.systemSettlement || id.startsWith('sys-') || id.startsWith('system-settlement-');
  }

  function cleanupDuplicateSettlementTasks() {
    if (!Array.isArray(livData.extraTasks)) livData.extraTasks = [];
    const kept = new Map();

    livData.extraTasks = livData.extraTasks.filter(task => {
      if (!settlementIsSystemTask(task)) return true;

      const key = `${task.date}|${task.title}`;
      if (!kept.has(key)) {
        const canonical = `system-settlement-${task.title}-${task.date}`;
        task.id = canonical;
        task.type = 'ev-settlement';
        task.fixed = true;
        task.systemSettlement = true;
        kept.set(key, task);
        return true;
      }

      const first = kept.get(key);
      first.completed = !!first.completed || !!task.completed;
      return false;
    });
  }

  window.initMonthlySystemTasks = function() {
    cleanupDuplicateSettlementTasks();
  };

  window.ensureMonthlySettlementTasks = function() {
    if (!Array.isArray(livData.extraTasks)) livData.extraTasks = [];

    const currentYear = new Date().getFullYear();
    const years = [...new Set([currentYear - 1, currentYear, currentYear + 1, 2026, 2027])];

    function isBizDay(ds) {
      const d = parseDateString(ds);
      return d.getDay() !== 0 && d.getDay() !== 6 && !getHolidayName(ds);
    }

    function adjustedDate(year, month, day) {
      const d = new Date(year, month - 1, day);
      while (true) {
        const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        if (isBizDay(ds)) return ds;
        d.setDate(d.getDate() - 1);
      }
    }

    years.forEach(year => {
      for (let month = 1; month <= 12; month++) {
        [
          [adjustedDate(year, month, 25), '정산서 발송'],
          [adjustedDate(year, month, new Date(year, month, 0).getDate()), '작가 인세 지급']
        ].forEach(([date, title]) => {
          const id = `system-settlement-${title}-${date}`;
          let task = livData.extraTasks.find(t => String(t.id) === id);
          if (!task) {
            task = livData.extraTasks.find(t => t.date === date && t.title === title && settlementIsSystemTask(t));
          }

          if (task) {
            const completed = !!task.completed;
            Object.assign(task, { id, date, title, type:'ev-settlement', fixed:true, systemSettlement:true, completed });
          } else {
            livData.extraTasks.push({ id, date, title, type:'ev-settlement', fixed:true, systemSettlement:true, completed:false });
          }
        });
      }
    });

    cleanupDuplicateSettlementTasks();
  };

  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      cleanupDuplicateSettlementTasks();
      if (typeof saveData === 'function') saveData();
      if (currentViewName === 'dashboard') renderDashboard(document.getElementById('main-view'));
      if (currentViewName === 'calendar') renderCalendar(document.getElementById('main-view'));
      if (currentViewName === 'week-calendar') renderWeekCalendar(document.getElementById('main-view'));
    }, 300);
  });
})();

<script>
/* ===== LIV Google Drive JSON auto backup via Google Apps Script: hourly, keep only last 72 hours =====
   - Existing Firebase save/backup/restore logic is not modified.
   - Runs only while this program page is open.
   - No Google OAuth popup is used in this page.
   - Setup required once: deploy the provided Google Apps Script as a Web App and paste its Web App URL here.
   - The Apps Script saves JSON files to Google Drive and deletes backups older than 72 hours.
*/
(function(){
  const DRIVE_FILE_PREFIX = 'LIV_backup_';
  const WEBAPP_URL_KEY = 'liv_drive_apps_script_webapp_url';
  const SECRET_KEY = 'liv_drive_apps_script_secret';
  const ENABLED_KEY = 'liv_drive_auto_backup_enabled';
  const LAST_BACKUP_KEY = 'liv_drive_last_backup_at';
  const LAST_ERROR_KEY = 'liv_drive_last_error_at';
  const BACKUP_INTERVAL_MS = 60 * 60 * 1000;
  const CHECK_INTERVAL_MS = 60 * 1000;
  const STARTUP_CHECK_DELAY_MS = 15000;

  let driveBackupTimer = null;
  let driveBackupInProgress = false;

  function normalizeWebAppUrl(url) {
    return String(url || '').trim();
  }

  function getWebAppUrl(interactive) {
    let url = localStorage.getItem(WEBAPP_URL_KEY) || '';
    if (!url && interactive) {
      url = prompt('Google Drive 자동 백업용 Apps Script 웹앱 URL을 입력하세요.\n\n※ Apps Script 배포 후 받은 /exec 로 끝나는 URL입니다.\n※ 예: https://script.google.com/macros/s/xxxxx/exec');
      url = normalizeWebAppUrl(url);
      if (url) localStorage.setItem(WEBAPP_URL_KEY, url);
    }
    return normalizeWebAppUrl(url);
  }

  function getBackupSecret(interactive) {
    let secret = localStorage.getItem(SECRET_KEY) || '';
    if (!secret && interactive) {
      secret = prompt('Apps Script 백업 비밀번호를 입력하세요.\n\n※ Apps Script 코드의 LIV_BACKUP_SECRET 값과 똑같이 입력해야 합니다.\n※ 남이 네 백업 URL로 장난치는 것을 막기 위한 간단한 비밀번호입니다.');
      secret = String(secret || '').trim();
      if (secret) localStorage.setItem(SECRET_KEY, secret);
    }
    return String(secret || '').trim();
  }

  function resetDriveAppsScriptSettings() {
    localStorage.removeItem(WEBAPP_URL_KEY);
    localStorage.removeItem(SECRET_KEY);
  }

  function getKstBackupStamp() {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false
    }).formatToParts(new Date()).reduce((acc, p) => {
      acc[p.type] = p.value;
      return acc;
    }, {});
    return `${parts.year}-${parts.month}-${parts.day}_${parts.hour}-${parts.minute}`;
  }

  function getDriveBackupPayload(reason) {
    const data = JSON.parse(JSON.stringify(livData || {}));
    data.driveBackupMeta = {
      backedUpAt: new Date().toISOString(),
      backedUpAtKst: getKstBackupStamp(),
      reason: reason || 'manual',
      summary: (typeof getDailyBackupSummary === 'function') ? getDailyBackupSummary(data) : undefined,
      importantCount: (typeof countImportantData === 'function') ? countImportantData(data) : undefined
    };
    return data;
  }

  function getLastDriveBackupTime() {
    const last = Date.parse(localStorage.getItem(LAST_BACKUP_KEY) || '');
    return Number.isFinite(last) ? last : 0;
  }

  async function postJsonToAppsScript(url, body) {
    // Apps Script Web App does not reliably support normal CORS preflight.
    // text/plain + no-cors lets the browser send the backup without OAuth popups.
    await fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    });
    return true;
  }

  async function doDriveBackupToAppsScript(reason, interactive) {
    if (driveBackupInProgress) return null;
    if (!livData || typeof livData !== 'object') throw new Error('백업할 livData가 없습니다.');
    if (typeof countImportantData === 'function' && countImportantData(livData) <= 0) {
      throw new Error('백업할 주요 데이터가 비어 있어 Drive 백업을 중단했습니다.');
    }

    const url = getWebAppUrl(interactive);
    if (!url) throw new Error('Apps Script 웹앱 URL이 없습니다. Drive 자동 백업 버튼을 눌러 URL을 입력하세요.');
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) {
      throw new Error('Apps Script 웹앱 URL 형식이 이상합니다. /exec 로 끝나는 배포 URL을 넣어야 합니다.');
    }

    const secret = getBackupSecret(interactive);
    if (!secret) throw new Error('Apps Script 백업 비밀번호가 없습니다.');

    driveBackupInProgress = true;
    try {
      const stamp = getKstBackupStamp();
      const fileName = `${DRIVE_FILE_PREFIX}${stamp}.json`;
      const payload = getDriveBackupPayload(reason || 'hourly-auto');
      await postJsonToAppsScript(url, {
        secret,
        fileName,
        payload
      });
      localStorage.setItem(LAST_BACKUP_KEY, new Date().toISOString());
      localStorage.removeItem(LAST_ERROR_KEY);
      console.log('LIV Drive backup sent to Apps Script:', fileName);
      return { name: fileName };
    } finally {
      driveBackupInProgress = false;
    }
  }

  async function runDriveAutoBackupIfDue(reason) {
    if (localStorage.getItem(ENABLED_KEY) !== 'true') return null;
    const last = getLastDriveBackupTime();
    if (last && Date.now() - last < BACKUP_INTERVAL_MS) return null;
    return doDriveBackupToAppsScript(reason || 'hourly-auto', false);
  }

  function startDriveAutoBackupTimer() {
    if (driveBackupTimer) clearInterval(driveBackupTimer);
    driveBackupTimer = setInterval(() => {
      runDriveAutoBackupIfDue('hourly-auto').catch(e => {
        localStorage.setItem(LAST_ERROR_KEY, new Date().toISOString() + ' / ' + (e && e.message ? e.message : e));
        console.warn('Hourly Drive backup skipped:', e);
      });
    }, CHECK_INTERVAL_MS);
  }

  window.enableDriveAutoBackup = async function() {
    try {
      await doDriveBackupToAppsScript('enable-now', true);
      localStorage.setItem(ENABLED_KEY, 'true');
      startDriveAutoBackupTimer();
      alert('Google Drive 자동 백업을 켰습니다.\n\n이제 Google 로그인창 없이, 프로그램이 열려 있는 동안 1시간마다 Apps Script가 Drive에 JSON 백업을 저장합니다.\n최근 3일치만 남기고 오래된 백업은 Apps Script가 자동 삭제합니다.');
    } catch(e) {
      localStorage.setItem(ENABLED_KEY, 'false');
      console.error(e);
      alert('Drive 자동 백업 설정에 실패했습니다.\n' + (e && e.message ? e.message : e));
    }
  };

  window.runDriveBackupNow = async function() {
    try {
      const result = await doDriveBackupToAppsScript('manual-now', true);
      alert('Google Drive 백업 요청을 보냈습니다.\n\nDrive의 LIV_AUTO_BACKUP_JSON 폴더에서 새 JSON 파일을 확인하세요.\n파일명: ' + (result && result.name ? result.name : 'LIV_backup_날짜_시간.json'));
    } catch(e) {
      console.error(e);
      alert('Drive 즉시 백업에 실패했습니다.\n' + (e && e.message ? e.message : e));
    }
  };

  window.disableDriveAutoBackup = function() {
    localStorage.setItem(ENABLED_KEY, 'false');
    if (driveBackupTimer) clearInterval(driveBackupTimer);
    driveBackupTimer = null;
    alert('Google Drive 자동 백업을 껐습니다.');
  };

  window.resetDriveBackupClientId = function() {
    if (confirm('저장된 Apps Script 웹앱 URL과 백업 비밀번호를 지울까요?\n다음 Drive 백업 때 다시 입력하게 됩니다.')) {
      resetDriveAppsScriptSettings();
      alert('저장된 Apps Script 백업 설정을 지웠습니다.');
    }
  };

  window.checkDriveBackupStatus = function() {
    const enabled = localStorage.getItem(ENABLED_KEY) === 'true';
    const last = localStorage.getItem(LAST_BACKUP_KEY) || '없음';
    const lastError = localStorage.getItem(LAST_ERROR_KEY) || '없음';
    const url = localStorage.getItem(WEBAPP_URL_KEY) || '없음';
    alert('Drive 자동 백업 상태\n\n사용 여부: ' + (enabled ? '켜짐' : '꺼짐') + '\n마지막 백업 요청: ' + last + '\n마지막 자동 백업 오류: ' + lastError + '\nApps Script URL: ' + url);
  };

  document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem(ENABLED_KEY) === 'true') {
      startDriveAutoBackupTimer();
      setTimeout(() => {
        runDriveAutoBackupIfDue('startup-auto').catch(e => console.warn('Startup Drive backup skipped:', e));
      }, STARTUP_CHECK_DELAY_MS);
    }
  });
})();
</script>

    <script>
/* ===== LIV settlement schedule override: 24일 정산서 배포 고정 ===== */
(function(){
  const SETTLEMENT_TITLES = new Set(['정산서 발송', '정산서 배포', '작가 인세 지급']);

  function getData() {
    if (typeof livData === 'undefined') return null;
    if (!Array.isArray(livData.extraTasks)) livData.extraTasks = [];
    return livData;
  }

  function parseDateSafe(ds) {
    if (typeof parseDateString === 'function') return parseDateString(ds);
    const [y, m, d] = String(ds).split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function holidayNameSafe(ds) {
    if (typeof getHolidayName === 'function') return getHolidayName(ds);
    return '';
  }

  function isBizDay(ds) {
    const d = parseDateSafe(ds);
    return d.getDay() !== 0 && d.getDay() !== 6 && !holidayNameSafe(ds);
  }

  function fixedDate(year, month, day) {
    return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }

  function adjustedDate(year, month, day) {
    const d = new Date(year, month - 1, day);
    while (true) {
      const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if (isBizDay(ds)) return ds;
      d.setDate(d.getDate() - 1);
    }
  }

  function isSystemSettlementTask(task) {
    if (!task || task.type !== 'ev-settlement' || !SETTLEMENT_TITLES.has(task.title)) return false;
    const id = String(task.id || '');
    return !!task.fixed || !!task.systemSettlement || id.startsWith('sys-') || id.startsWith('system-settlement-');
  }

  function captureLegacyStatementCompletedMonths() {
    const data = getData();
    const completedMonths = new Set();
    if (!data) return completedMonths;

    data.extraTasks.forEach(task => {
      if (
        task &&
        task.type === 'ev-settlement' &&
        task.title === '정산서 발송' &&
        task.date &&
        isSystemSettlementTask(task) &&
        task.completed
      ) {
        completedMonths.add(String(task.date).slice(0, 7));
      }
    });

    return completedMonths;
  }

  function cleanupDuplicateSettlementTasks(legacyCompletedMonths) {
    const data = getData();
    if (!data) return;

    const kept = new Map();

    data.extraTasks = data.extraTasks.filter(task => {
      if (!isSystemSettlementTask(task)) return true;

      // 기존 자동 생성 일정명은 더 이상 사용하지 않음
      // 완료 체크가 되어 있던 월은 새 "정산서 배포" 일정으로 넘김
      if (task.title === '정산서 발송') return false;

      const key = `${task.date}|${task.title}`;

        ].forEach(([date, title]) => {

      if (typeof currentViewName !== 'undefined' && currentViewName === 'calendar' && typeof renderCalendar === 'function') renderCalendar(main);

            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            hourCycle: 'h23'
        }).formatToParts(new Date());

        const data = {};
        parts.forEach(p => {
            if (p.type !== 'literal') data[p.type] = p.value;
        });

        return {
            date: `${data.year}-${data.month}-${data.day}`,
            minutes: Number(data.hour || 0) * 60 + Number(data.minute || 0),
            time: `${data.hour}:${data.minute}`
        };
    }

    function nextDate(dateStr, delta) {
        const d = new Date(dateStr + 'T00:00:00');
        d.setDate(d.getDate() + Number(delta || 1));
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function timeToMin(value) {
        const parts = String(value || DEFAULT_START).split(':');
        return Number(parts[0] || 0) * 60 + Number(parts[1] || 0);
    }

    function minToTime(mins) {
        mins = Math.round(Number(mins || 0));

        while (mins < 0) mins += 24 * 60;

        const h = Math.floor(mins / 60) % 24;
        const m = mins % 60;

        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function durationLabel(minutes) {
        minutes = Math.max(0, Math.round(Number(minutes || 0)));
        const h = Math.floor(minutes / 60);
        const m = minutes % 60;

        if (h && m) return `${h}시간 ${m}분`;
        if (h) return `${h}시간`;
        return `${m}분`;
    }

    function makeId(prefix) {
        return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    }

    function cleanText(value) {
        return String(value || '')
            .replace(/\[[^\]]+\]/g, '')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function currentView() {
        try { return currentViewName || 'dashboard'; } catch (e) { return 'dashboard'; }
    }

    function setCurrentView(v) {
        try { currentViewName = v; } catch (e) {}
    }

    function getDailyDate() {
        const el = document.getElementById('daily-v9-date');
        return el ? el.value : (window.dailyV9Date || todayKst());
    }

    function getStartForDate(dateStr) {
        ensureData();
        return livData.dailyStartTimes[dateStr] || DEFAULT_START;
    }

    function setStartForDate(dateStr, start) {
        if (!ensureData() || !dateStr || !start) return;
        livData.dailyStartTimes[dateStr] = start;
    }

    function getWriter(writerId) {
        if (!ensureData()) return null;
        return livData.writers.find(w => String(w.id) === String(writerId)) || null;
    }

    function getWork(writerId, workId) {
        const writer = getWriter(writerId);
        if (!writer) return { writer: null, work: null };

        const work = (writer.works || []).find(w => String(w.id) === String(workId)) || null;
        return { writer, work };
    }

    function getExtra(extraId) {
        if (!ensureData()) return null;
        return livData.extraTasks.find(t => String(t.id) === String(extraId)) || null;
    }

    function normalizeType(type) {
        const t = String(type || 'ev-task');
        if (t.startsWith('ev-')) return t;

        const map = {
            task: 'ev-task',
            email: 'ev-email',
            meeting: 'ev-meeting',
            settlement: 'ev-settlement',
            personal: 'ev-personal',
            writing: 'ev-writing',
            rest: 'ev-rest',
            cover: 'ev-cover',
            proof1: 'ev-proof1',
            proof2: 'ev-proof2',
            pub: 'ev-pub'
        };

        return map[t] || t;
    }

    function extraLabel(type) {
        const cls = normalizeType(type);

        if (typeof extraTaskLabel === 'function') {
            try {
                const label = extraTaskLabel(cls);
                if (label) return label;
            } catch (e) {}
        }

        return TYPE_LABELS[cls] || '일정';
    }

    function getDateList(work, key) {
        const info = WORK_KEYS[key];
        if (!work || !info) return [];

        const list = [];
        if (work[key]) list.push(work[key]);
        if (Array.isArray(work[info.arr])) list.push(...work[info.arr]);

        return Array.from(new Set(list.filter(Boolean))).sort();
    }

    function setDateList(work, key, dates) {
        const info = WORK_KEYS[key];
        if (!work || !info) return;

        const clean = Array.from(new Set((dates || []).filter(Boolean))).sort();

        if (!clean.length) {
            work[key] = '';
            work[info.arr] = [];
            return;
        }

        work[info.arr] = clean;
        work[key] = clean[clean.length - 1];
    }

    function ensureCopiedDates(work, key) {
        if (!work._livCopiedDates || typeof work._livCopiedDates !== 'object') {
            work._livCopiedDates = {};
        }

        if (!Array.isArray(work._livCopiedDates[key])) {
            const dates = getDateList(work, key);
            work._livCopiedDates[key] = dates.filter(d => d !== work[key]);
        }

        return work._livCopiedDates[key];
    }

    function isCopiedWorkOccurrence(work, key, dateStr) {
        if (!work || !key || !dateStr) return false;

        const copied = ensureCopiedDates(work, key);
        if (copied.includes(dateStr)) return true;

        const dates = getDateList(work, key);
        return dates.length > 1 && dateStr !== work[key];
    }

    function addCopiedWorkOccurrence(work, key, dateStr) {
        const copied = ensureCopiedDates(work, key);
        if (!copied.includes(dateStr)) copied.push(dateStr);
        work._livCopiedDates[key] = Array.from(new Set(copied)).sort();
    }

    function removeWorkOccurrence(work, key, dateStr) {
        if (!work || !WORK_KEYS[key] || !dateStr) return;

        ensureCopiedDates(work, key);
        work._livCopiedDates[key] = work._livCopiedDates[key].filter(d => d !== dateStr);

        const dates = getDateList(work, key).filter(d => d !== dateStr);
        setDateList(work, key, dates);
    }

    function isCopiedExtra(task) {
        return !!(
            task &&
            (
                task._livCopied === true ||
                task._livCopyV9 === true ||
                task._dailyCopied === true ||
                task._dailyCopySourceId ||
                task.copiedFromId ||
                task.copyOfId ||
                String(task.id || '').startsWith('extra_v9_') ||
                String(task.id || '').startsWith('extra_copy_')
            )
        );
    }

    function dailyBlocks(dateStr) {
        if (!ensureData()) return [];

        return livData.dailyTimeBlocks
            .filter(b => b && b.date === dateStr)
            .sort((a, b) => timeToMin(a.start) - timeToMin(b.start));
    }

    function nextStartForDaily(dateStr) {
        const start = timeToMin(getStartForDate(dateStr));
        const blocks = dailyBlocks(dateStr);

        if (!blocks.length) return minToTime(start);

        const lastEnd = Math.max(...blocks.map(b => timeToMin(b.end || b.start || getStartForDate(dateStr))));
        return minToTime(Math.max(start, lastEnd));
    }

    function collectDailySources(dateStr) {
        if (!ensureData()) return [];

        const items = [];

        livData.extraTasks.forEach(task => {
            if (!task || task.hidden || task.date !== dateStr) return;

            const cls = normalizeType(task.type);
            const writer = task.writerId ? getWriter(task.writerId) : null;

            items.push({
                sourceKey: `extra:${task.id}`,
                title: `[${extraLabel(cls)}] ${task.title || '제목 없음'}`,
                writerName: writer ? writer.name : '',
                className: cls,
                defaultMinutes: TYPE_DEFAULT_MINUTES[cls] || 60
            });
        });

        livData.writers.forEach(writer => {
            (writer.works || []).forEach(work => {
                Object.keys(WORK_KEYS).forEach(key => {
                    const info = WORK_KEYS[key];

                    if (!getDateList(work, key).includes(dateStr)) return;

                    items.push({
                        sourceKey: `work:${writer.id}:${work.id}:${key}:${dateStr}`,
                        title: `[${info.label}] ${work.title || '제목 없음'}`,
                        writerName: writer.name || '',
                        className: info.cls,
                        defaultMinutes: info.minutes
                    });
                });
            });
        });

        return items;
    }

    function renderDailySources() {
        const box = document.getElementById('daily-v9-sources');
        if (!box) return;

        const date = getDailyDate();
        const sources = collectDailySources(date);
        const registered = new Set(dailyBlocks(date).map(b => b.sourceKey).filter(Boolean));

        window.__dailyV9Sources = sources;

        if (!sources.length) {
            box.innerHTML = `<div class="daily-v9-empty">이 날짜에 월간 스케줄러 일정이 없습니다.<br>아래에서 직접 추가할 수 있어요.</div>`;
            return;
        }

        box.innerHTML = sources.map((item, idx) => {
            const done = registered.has(item.sourceKey);

            return `
                <div class="daily-v9-source ${esc(item.className)}">
                    <div class="daily-v9-source-title">${esc(item.title)}</div>
                    <div class="daily-v9-source-meta">${item.writerName ? esc(item.writerName) + ' · ' : ''}${esc(date)}</div>
                    <div class="daily-v9-source-actions">
                        <input type="number" id="daily-v9-src-min-${idx}" min="5" step="5" value="${Number(item.defaultMinutes || 60)}" placeholder="소요 시간(분)">
                        <button class="daily-v9-btn" ${done ? 'disabled' : ''} onclick="dailyV9RegisterSource(${idx})">${done ? '등록됨' : '등록'}</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderDailyBlocks() {
        const layer = document.getElementById('daily-v9-layer');
        const empty = document.getElementById('daily-v9-empty');
        const totalEl = document.getElementById('daily-v9-total');

        if (!layer) return;

        const date = getDailyDate();
        const startBase = timeToMin(getStartForDate(date));
        const endBase = startBase + DAY_SPAN_MINUTES;
        const blocks = dailyBlocks(date);
        const total = blocks.reduce((sum, b) => sum + Math.max(0, timeToMin(b.end) - timeToMin(b.start)), 0);

        if (totalEl) totalEl.textContent = `${date} 작업 합계 ${durationLabel(total)}`;
        if (empty) empty.style.display = blocks.length ? 'none' : 'block';

        layer.innerHTML = blocks.map(block => {
            const startMin = timeToMin(block.start);
            const endMin = timeToMin(block.end);
            const visibleStart = Math.max(startBase, startMin);
            const visibleEnd = Math.min(endBase, endMin);

            if (visibleEnd <= startBase || visibleStart >= endBase) return '';

            const top = Math.max(0, (visibleStart - startBase) * MINUTE_HEIGHT);
            const height = Math.max(30, (visibleEnd - visibleStart) * MINUTE_HEIGHT - 4);
            const active = block.id === selectedBlockId ? 'active' : '';

            return `
                <div class="daily-v9-block ${esc(block.className)} ${active}"
                     style="top:${top}px; height:${height}px;"
                     onclick="dailyV9OpenEditor('${esc(block.id)}')">
                    <div class="daily-v9-block-title">${esc(block.title)}</div>
                    <div class="daily-v9-block-meta">${esc(block.start)} ~ ${esc(block.end)} · ${durationLabel(Math.max(0, endMin - startMin))}</div>
                    ${block.desc ? `<div class="daily-v9-block-desc">${esc(block.desc)}</div>` : ''}
                </div>
            `;
        }).join('');

        updateNowLine();
    }

    function updateNowLine() {
        const date = getDailyDate();
        const line = document.getElementById('daily-v9-now-line');
        if (!line || !date) return;

        const now = nowKst();
        const startBase = timeToMin(getStartForDate(date));
        const endBase = startBase + DAY_SPAN_MINUTES;

        if (date === now.date && now.minutes >= startBase && now.minutes <= endBase) {
            line.style.display = 'block';
            line.style.top = `${(now.minutes - startBase) * MINUTE_HEIGHT}px`;

            const label = line.querySelector('.daily-v9-now-label');
            if (label) label.textContent = `현재 ${now.time}`;
        } else {
            line.style.display = 'none';
        }

        document.querySelectorAll('.daily-v9-block').forEach(block => {
            const meta = block.querySelector('.daily-v9-block-meta');
            const text = meta ? meta.textContent || '' : '';
            const match = text.match(/(\d{2}):(\d{2})\s*~\s*(\d{2}):(\d{2})/);
            if (!match) return;

            const endMin = Number(match[3]) * 60 + Number(match[4]);

            if (date < now.date) block.classList.add('daily-v9-past');
            else if (date > now.date) block.classList.remove('daily-v9-past');
            else if (endMin <= now.minutes) block.classList.add('daily-v9-past');
            else block.classList.remove('daily-v9-past');
        });
    }

    window.dailyV9ChangeStart = function (start) {
        const date = getDailyDate();

        setStartForDate(date, start || DEFAULT_START);
        save();

        const main = document.getElementById('main-view');
        if (main) renderDaily(main);
    };

    window.dailyV9RegisterSource = function (idx) {
        if (!ensureData()) return;

        const sources = window.__dailyV9Sources || [];
        const item = sources[idx];
        if (!item) return;

        const minEl = document.getElementById(`daily-v9-src-min-${idx}`);
        const minutes = Math.max(5, Number(minEl && minEl.value ? minEl.value : item.defaultMinutes || 60));
        const date = getDailyDate();
        const start = nextStartForDaily(date);
        const startMin = timeToMin(start);

        livData.dailyTimeBlocks.push({
            id: makeId('daily'),
            date,
            title: item.title,
            desc: '',
            start: minToTime(startMin),
            end: minToTime(startMin + minutes),
            className: item.className,
            sourceKey: item.sourceKey
        });

        save();
        renderDailySources();
        renderDailyBlocks();
    };

    window.dailyV9AddManual = function () {
        if (!ensureData()) return;

        const titleEl = document.getElementById('daily-v9-manual-title');
        const minEl = document.getElementById('daily-v9-manual-min');
        const typeEl = document.getElementById('daily-v9-manual-type');

        const title = (titleEl && titleEl.value ? titleEl.value.trim() : '') || '직접 추가 일정';
        const minutes = Math.max(5, Number(minEl && minEl.value ? minEl.value : 60));
        const cls = typeEl && typeEl.value ? typeEl.value : 'ev-task';
        const label = TYPE_LABELS[cls] || '일정';
        const date = getDailyDate();
        const start = nextStartForDaily(date);
        const startMin = timeToMin(start);

        livData.dailyTimeBlocks.push({
            id: makeId('daily'),
            date,
            title: `[${label}] ${title}`,
            desc: '',
            start: minToTime(startMin),
            end: minToTime(startMin + minutes),
            className: cls
        });

        if (titleEl) titleEl.value = '';

        save();
        renderDailyBlocks();
    };
